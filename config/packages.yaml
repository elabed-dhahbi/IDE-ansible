# =============================================================================
# DEPENDENCY PACKAGE LISTS
# =============================================================================

offline_packages:
  - name: "HTTP server packages"
    packages:
      - "httpd-*.rpm"
      - "httpd-core-*.rpm"
      - "httpd-filesystem-*.rpm"
      - "httpd-tools-*.rpm"
      - "mod_http2-*.rpm"
      - "mod_lua-*.rpm"
      - "*logos-httpd*.rpm"
  
  - name: "APR packages"
    packages:
      - "apr-*.rpm"
      - "apr-util-*.rpm"
  
  - name: "Database packages"
    packages:
      - "mariadb-connector-c-*.rpm"
      - "mariadb-connector-c-config-*.rpm"
      - "unixODBC-*.rpm"
      - "postgresql{{ versions.postgres }}-libs-*.rpm"
      - "libpq5-*.rpm"
  
  - name: "PHP packages"
    packages:
      - "php-*.rpm"
  
  - name: "Java packages"
    packages:
      - "javapackages-filesystem-*.rpm"
      - "tzdata-java-*.rpm"
      - "java-17-openjdk-headless-*.rpm"
      - "copy-jdk-configs-*.rpm"
      - "lksctp-tools-*.rpm"
  
  - name: "Other dependencies"
    packages:
      - "js-jquery-*.rpm"
      - "web-assets-filesystem-*.rpm"
      - "libssh2-*.rpm"
      - "net-snmp-libs-*.rpm"
      - "OpenIPMI-libs-*.rpm"
      - "python3-psycopg2-*.rpm"
      - "fping-*.rpm"
      - "gd-*.rpm"
      - "libXpm-*.rpm"
      - "mailcap-*.rpm"
      - "nginx-filesystem-*.rpm"

