# DMC4.6.18 Package Definitions and Configuration Defaults
# This file contains package patterns and all auto-calculated configuration
# Version numbers come from values.yaml

# =============================================================================
# PACKAGE GLOB PATTERNS - Auto-use versions from values.yaml
# =============================================================================

package_globs:
  # SICAP application packages
  dmc_rpm: "SCPdmc-*.tar.gz"
  drs_rpm: "SCPdrs-*.rpm"
  sls_rpm: "SCPsls-*.tar.gz"
  mmg_rpm: "SCPmmg-*.rpm"
  mmsoap_rpm: "SCPmmsoap-*.rpm"
  smppc_rpm: "SCPsmppc-*.rpm"
  
  # PostgreSQL packages
  postgresql_rpm: "postgresql15-{{ versions.postgresql }}*.rpm"
  postgresql_libs_rpm: "postgresql15-libs-{{ versions.postgresql }}*.rpm"
  postgresql_server_rpm: "postgresql15-server-{{ versions.postgresql }}*.rpm"
  postgresql_contrib_rpm: "postgresql15-contrib-{{ versions.postgresql }}*.rpm"
  libpq_rpm: "libpq5-{{ versions.libpq }}*.rpm"
  python3_psycopg2_rpm: "python3-psycopg2-{{ versions.python3_psycopg2 }}*.rpm"
  pgdg_repo_rpm: "pgdg-redhat-repo-latest.noarch.rpm"
  
  # Elasticsearch/Kibana packages
  elasticsearch_rpm: "elasticsearch-{{ versions.elasticsearch }}*.rpm"
  es_rpm: "elasticsearch-{{ versions.elasticsearch }}*.rpm"
  kibana_rpm: "kibana-{{ versions.kibana }}*.rpm"
  
  # Logstash packages
  logstash_rpm: "logstash-{{ versions.logstash }}-x86_64.rpm"
  logstash_oss_rpm: "logstash-oss-{{ versions.logstash_oss }}-x86_64.rpm"
  logstash_filter_rest: "logstash-filter-rest-*.zip"
  logstash_output_opensearch: "logstash-output-opensearch-*.gem"
  
  # OpenSearch packages
  opensearch_rpm: "opensearch-{{ versions.opensearch }}*.rpm"
  opensearch_dashboards_rpm: "opensearch-dashboards-{{ versions.opensearch }}*.rpm"
  
  # Zabbix packages - using wildcards to match both release1 and release2
  zabbix_agent2_rpm: "zabbix-agent2-{{ versions.zabbix }}-release*.el9.x86_64.rpm"
  zabbix_agent2_plugin_mongodb_rpm: "zabbix-agent2-plugin-mongodb-{{ versions.zabbix }}-release*.el9.x86_64.rpm"
  zabbix_agent2_plugin_mssql_rpm: "zabbix-agent2-plugin-mssql-{{ versions.zabbix }}-release*.el9.x86_64.rpm"
  zabbix_agent2_plugin_postgresql_rpm: "zabbix-agent2-plugin-postgresql-{{ versions.zabbix }}-release*.el9.x86_64.rpm"
  zabbix_apache_conf_rpm: "zabbix-apache-conf-{{ versions.zabbix }}-release*.el9.noarch.rpm"
  zabbix_java_gateway_rpm: "zabbix-java-gateway-{{ versions.zabbix }}-release*.el9.x86_64.rpm"
  zabbix_selinux_policy_rpm: "zabbix-selinux-policy-{{ versions.zabbix }}-release*.el9.x86_64.rpm"
  zabbix_server_pgsql_rpm: "zabbix-server-pgsql-{{ versions.zabbix }}-release*.el9.x86_64.rpm"
  zabbix_sql_scripts_rpm: "zabbix-sql-scripts-{{ versions.zabbix }}-release*.el9.noarch.rpm"
  zabbix_web_rpm: "zabbix-web-{{ versions.zabbix }}-release*.el9.noarch.rpm"
  zabbix_web_deps_rpm: "zabbix-web-deps-{{ versions.zabbix }}-release*.el9.noarch.rpm"
  zabbix_web_pgsql_rpm: "zabbix-web-pgsql-{{ versions.zabbix }}-release*.el9.noarch.rpm"
  
  # Java packages
  jdk8_tgz: "openlogic-openjdk-{{ versions.jdk8 }}*linux*.tar.gz"
  jdk8_32bit: "openlogic-openjdk-{{ versions.jdk8 }}*linux*.tar.gz"
  jdk8_64bit: "1_8_0_92-jdk.tar.gz"
  
  # HAProxy packages
  haproxy_rpm: "haproxy-{{ versions.haproxy }}.el8.x86_64.rpm"


