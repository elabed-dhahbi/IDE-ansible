# TT Environment Inventory
#
# lprep1p and lpdb1p share 192.168.251.188 (same VM, two inventory names).
# Ansible tracks failures per inventory name, not per IP. Keep OpenSearch on
# one name only. If OpenSearch is lpdb1p and Dashboards is lprep1p, a failed
# OpenSearch play will still install Dashboards on the same machine.

[postgres]
lprep1p ansible_host=192.168.251.188

[elasticsearch]
#lpmmg1p ansible_host=192.168.251.93

[opensearch]
lpdb1p ansible_host=192.168.251.188

[kibana]
#lpmmg1p ansible_host=192.168.251.93

[opensearch_dashboards]
# Same host as OpenSearch (lpdb1p). Do not put Dashboards on DMC: a Zabbix
# failure on lpdmc1p/lpdmc2p would skip this play entirely.
lpdb1p ansible_host=192.168.251.188

[logstash]
#lpdmc1p ansible_host=192.168.251.42

[logstash_oss]
lpdmc1p ansible_host=192.168.251.42

[elkstatistic]
#lpdmc1p ansible_host=192.168.251.42

[zabbix]
# Zabbix server + web only. DMC nodes get agents via the zabbix-agents play.
lpdb1p ansible_host=192.168.251.188

[zabbix_agents]
lpdmc1p ansible_host=192.168.251.42
lpdmc2p ansible_host=192.168.251.191
lpdb1p ansible_host=192.168.251.188

[dmc1]
lpdmc1p ansible_host=192.168.251.42

[dmc2]
lpdmc2p ansible_host=192.168.251.191

[drs]
lpdmc1p ansible_host=192.168.251.42
lpdmc2p ansible_host=192.168.251.191

[mmg]
lpmmg1p ansible_host=192.168.251.93
lpsls1p ansible_host=192.168.251.93
lpmmsoap1p ansible_host=192.168.251.93

[mmsoap]
lpmmsoap1p ansible_host=192.168.251.93

[smppc]
#lpsmppc1 ansible_host=192.168.251.93

[sls]
lpsls1p ansible_host=192.168.251.93

[haproxy]
#lphaproxy1p ansible_host=192.168.251.93

[lprep]
lprep1p ansible_host=192.168.251.188
lpdb1p ansible_host=192.168.251.188

[all]
lpdmc1p ansible_host=192.168.251.42
lpdmc2p ansible_host=192.168.251.191
lpmmg1p ansible_host=192.168.251.93
lprep1p ansible_host=192.168.251.188
lpdb1p ansible_host=192.168.251.188

[all:vars]
ansible_user=ansible
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
