    - "vars/env/default.yml"
    - "../config/packages.yaml"
    - "../config/values.yaml"
  roles:
    - dmc
    - drs
    - "{{ 'logstash_oss' if stack_type == 'opensearch' else 'logstash' }}"
    - elkstatistic
  tags:
    - dmc1
  pre_tasks:
    - import_tasks: tasks/install_logstash_opensearch_plugin.yml
      when: stack_type | default('') == 'opensearch'

