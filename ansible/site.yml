# e2.3) Zabbix agents and Java Gateway installation (all hosts)
- name: Install Zabbix agents and Java Gateway on all hosts
  hosts: all
  gather_facts: yes
  vars_files:
    - "vars/release.yml"
    - "vars/env/default.yml"
    - "../config/packages.yaml"
    - "../config/values.yaml"
  tasks:
    - name: Include Zabbix agent installation tasks
      include_tasks: roles/zabbix/tasks/install_agents_only.yml
      tags: [zabbix, install]

    - name: Include Zabbix agent configuration tasks
      include_tasks: roles/zabbix/tasks/configure_agents_only.yml
      tags: [zabbix, config]

    - name: Include Zabbix agent service configuration tasks
      include_tasks: roles/zabbix/tasks/configure_agent_services.yml
      tags: [zabbix, service]
  tags:
    - zabbix-agents

