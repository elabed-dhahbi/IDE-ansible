# l) SLS installation (REQUIRED - Core Service)
- name: Install and configure SLS
  hosts: sls
  gather_facts: yes
  vars_files:
    - "vars/release.yml"
    - "vars/env/default.yml"
    - "../config/packages.yaml"
    - "../config/values.yaml"
  roles:
    - sls
  tags:
    - sls

- name: SLS License Upload Pause
  hosts: sls
  gather_facts: yes
  vars_files:
    - "vars/release.yml"
    - "vars/env/default.yml"
    - "../config/packages.yaml"
    - "../config/values.yaml"
  tags:
    - sls
  tasks:
    - name: SLS Installation Complete - Manual License Upload Required
      pause:
        prompt: |
          ================================================
          SLS INSTALLATION COMPLETE
          ================================================

          Next steps:
          1. Open browser and go to: http://{{ ansible_host }}:50420
          2. Upload all required licenses via the web interface
          3. Verify SLS is working properly
          4. Run the remaining services installation:

             make install-tag TAG=sicap-services

          Press ENTER when licenses are uploaded and SLS is verified...
      when: inventory_hostname in groups['sls']

