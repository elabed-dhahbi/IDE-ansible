---
# Zabbix Service Configuration Tasks
# Simple service management only

# Server services (only on Zabbix server host)
- name: Check if zabbix-server-pgsql package is installed
  command: rpm -q zabbix-server-pgsql
  register: zabbix_server_check
  failed_when: false
  changed_when: false
  become: true
  when: inventory_hostname in groups['zabbix']
  tags: [zabbix, service, server]

- name: Check if zabbix-server service file exists
  stat:
    path: /usr/lib/systemd/system/zabbix-server.service
  register: zabbix_server_service_file
  become: true
  when: 
    - inventory_hostname in groups['zabbix']
    - zabbix_server_check.rc == 0
  tags: [zabbix, service, server]

- name: Check if zabbix-server service exists in systemd
  command: systemctl list-unit-files zabbix-server.service
  register: zabbix_server_service_check
  failed_when: false
  changed_when: false
  become: true
  when: 
    - inventory_hostname in groups['zabbix']
    - zabbix_server_check.rc == 0
  tags: [zabbix, service, server]

- name: Start and enable Zabbix server
  systemd:
    name: "zabbix-server"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when: 
    - inventory_hostname in groups['zabbix']
    - zabbix_server_check.rc == 0
    - zabbix_server_service_file.stat.exists | default(false)
  tags: [zabbix, service, server]

- name: Warn if zabbix-server package is not installed
  debug:
    msg: "WARNING: zabbix-server-pgsql package is not installed. Cannot start zabbix-server service."
  when:
    - inventory_hostname in groups['zabbix']
    - zabbix_server_check.rc != 0
  tags: [zabbix, service, server]

- name: Warn if zabbix-server service file does not exist
  debug:
    msg: |
      WARNING: zabbix-server service file does not exist at /usr/lib/systemd/system/zabbix-server.service.
      The package may not have installed the systemd service file.
      Please check if zabbix-server-pgsql package was installed correctly.
  when:
    - inventory_hostname in groups['zabbix']
    - zabbix_server_check.rc == 0
    - not (zabbix_server_service_file.stat.exists | default(false))
  tags: [zabbix, service, server]

- name: Check if httpd package is installed
  command: rpm -q httpd
  register: httpd_check
  failed_when: false
  changed_when: false
  become: true
  when: inventory_hostname in groups['zabbix']
  tags: [zabbix, service, apache]

- name: Find httpd package in offline directory if not installed
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "httpd-*.el9.x86_64.rpm"
      - "httpd-core-*.el9.x86_64.rpm"
      - "httpd-filesystem-*.el9.noarch.rpm"
      - "httpd-tools-*.el9.x86_64.rpm"
  register: httpd_packages
  delegate_to: localhost
  when: 
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
  tags: [zabbix, service, apache]

- name: Copy httpd packages to target if found
  copy:
    src: "{{ item.path }}"
    dest: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ httpd_packages.files }}"
  become: yes
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length > 0
  tags: [zabbix, service, apache]

- name: Find system-logos-httpd package in offline directory
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "system-logos-httpd-*.el9.noarch.rpm"
      - "redhat-logos-httpd-*.el9.noarch.rpm"
      - "rocky-logos-httpd-*.el9.noarch.rpm"
  register: httpd_logos_package
  delegate_to: localhost
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length > 0
  tags: [zabbix, service, apache]

- name: Copy httpd logos package to target if found
  copy:
    src: "{{ item.path }}"
    dest: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ httpd_logos_package.files }}"
  become: yes
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length > 0
    - httpd_logos_package.files | length > 0
  tags: [zabbix, service, apache]

- name: Install system-logos-httpd first (required by httpd)
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ httpd_logos_package.files }}"
  become: yes
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length > 0
    - httpd_logos_package.files | length > 0
  ignore_errors: yes
  tags: [zabbix, service, apache]

- name: Check if APR is installed (required by httpd-core and httpd-tools)
  command: rpm -q apr
  register: apr_check
  failed_when: false
  changed_when: false
  become: true
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length > 0
  tags: [zabbix, service, apache]

- name: Find APR package in offline directory if missing
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "apr-*.el9.x86_64.rpm"
  register: apr_package
  delegate_to: localhost
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length > 0
    - apr_check.rc != 0
  tags: [zabbix, service, apache]

- name: Copy APR package to target if found
  copy:
    src: "{{ item.path }}"
    dest: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ apr_package.files }}"
  become: yes
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length > 0
    - apr_check.rc != 0
    - apr_package.files | length > 0
  tags: [zabbix, service, apache]

- name: Install APR from offline directory if found
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ apr_package.files }}"
  become: yes
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length > 0
    - apr_check.rc != 0
    - apr_package.files | length > 0
  ignore_errors: yes
  tags: [zabbix, service, apache]

- name: Install APR from system repositories if missing and not found offline
  yum:
    name: apr
    state: present
  become: yes
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length > 0
    - apr_check.rc != 0
    - apr_package.files | length == 0
  ignore_errors: yes
  tags: [zabbix, service, apache]

- name: Install all httpd packages together using rpm (handles dependencies better)
  shell: |
    # Install logos packages first (required by httpd)
    for pkg in httpd-filesystem system-logos-httpd redhat-logos-httpd rocky-logos-httpd; do
      if ls {{ paths.offline_dir }}/$pkg*.rpm 2>/dev/null; then
        rpm -Uvh --force {{ paths.offline_dir }}/$pkg*.rpm 2>/dev/null || true
      fi
    done
    # Install httpd-core (required by httpd)
    if ls {{ paths.offline_dir }}/httpd-core*.rpm 2>/dev/null; then
      rpm -Uvh --force {{ paths.offline_dir }}/httpd-core*.rpm 2>/dev/null || true
    fi
    # Install httpd-tools (optional)
    if ls {{ paths.offline_dir }}/httpd-tools*.rpm 2>/dev/null; then
      rpm -Uvh --force {{ paths.offline_dir }}/httpd-tools*.rpm 2>/dev/null || true
    fi
    # Install httpd main package last (exclude core, tools, filesystem)
    for pkg in {{ paths.offline_dir }}/httpd-*.x86_64.rpm; do
      if [ -f "$pkg" ] && ! echo "$pkg" | grep -qE "(httpd-core|httpd-tools|httpd-filesystem)"; then
        rpm -Uvh --force "$pkg" 2>/dev/null || true
        break
      fi
    done
  become: yes
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length > 0
  ignore_errors: yes
  tags: [zabbix, service, apache]

- name: Try to install httpd from system repositories as fallback
  yum:
    name:
      - httpd
      - httpd-tools
      - system-logos-httpd
    state: present
  become: yes
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
    - httpd_packages.files | length == 0
  ignore_errors: yes
  register: httpd_system_install
  tags: [zabbix, service, apache]

- name: Re-check if httpd package is installed after installation attempt
  command: rpm -q httpd
  register: httpd_check
  failed_when: false
  changed_when: false
  become: true
  when: inventory_hostname in groups['zabbix']
  tags: [zabbix, service, apache]

- name: Check if httpd service file exists
  stat:
    path: /usr/lib/systemd/system/httpd.service
  register: httpd_service_file
  become: true
  when: 
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc == 0
  tags: [zabbix, service, apache]

- name: Start and enable Apache
  systemd:
    name: "httpd"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when: 
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc == 0
    - httpd_service_file.stat.exists | default(false)
  tags: [zabbix, service, apache]

- name: Warn if httpd package is not installed
  debug:
    msg: "WARNING: httpd package is not installed. Cannot start httpd service."
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc != 0
  tags: [zabbix, service, apache]

- name: Warn if httpd service file does not exist
  debug:
    msg: |
      WARNING: httpd service file does not exist at /usr/lib/systemd/system/httpd.service.
      The package may not have installed the systemd service file.
      Please check if httpd package was installed correctly.
  when:
    - inventory_hostname in groups['zabbix']
    - httpd_check.rc == 0
    - not (httpd_service_file.stat.exists | default(false))
  tags: [zabbix, service, apache]

- name: Check if php-fpm package is installed
  command: rpm -q php-fpm
  register: php_fpm_check
  failed_when: false
  changed_when: false
  become: true
  when: inventory_hostname in groups['zabbix']
  tags: [zabbix, service, php_fpm]

- name: Check if php-fpm service file exists
  stat:
    path: /usr/lib/systemd/system/php-fpm.service
  register: php_fpm_service_file
  become: true
  when: 
    - inventory_hostname in groups['zabbix']
    - php_fpm_check.rc == 0
  tags: [zabbix, service, php_fpm]

- name: Start and enable PHP-FPM
  systemd:
    name: "php-fpm"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when: 
    - inventory_hostname in groups['zabbix']
    - php_fpm_check.rc == 0
    - php_fpm_service_file.stat.exists | default(false)
  ignore_errors: true
  tags: [zabbix, service, php_fpm]

- name: Warn if php-fpm package is not installed
  debug:
    msg: "WARNING: php-fpm package is not installed. PHP-FPM service will not be started (this is optional for Zabbix)."
  when:
    - inventory_hostname in groups['zabbix']
    - php_fpm_check.rc != 0
  tags: [zabbix, service, php_fpm]

- name: Warn if php-fpm service file does not exist
  debug:
    msg: |
      WARNING: php-fpm service file does not exist at /usr/lib/systemd/system/php-fpm.service.
      The package may not have installed the systemd service file.
      PHP-FPM is optional for Zabbix web interface.
  when:
    - inventory_hostname in groups['zabbix']
    - php_fpm_check.rc == 0
    - not (php_fpm_service_file.stat.exists | default(false))
  tags: [zabbix, service, php_fpm]

# Agent services (on all hosts, including Zabbix server)
- name: Check if zabbix-agent2 is installed
  command: rpm -q zabbix-agent2
  register: zabbix_agent2_check
  failed_when: false
  changed_when: false
  become: true
  tags: [zabbix, service, agent2]

- name: Check if zabbix-agent is installed
  command: rpm -q zabbix-agent
  register: zabbix_agent_check
  failed_when: false
  changed_when: false
  become: true
  tags: [zabbix, service, agent]

- name: Start and enable Zabbix agent2 (if installed)
  systemd:
    name: "zabbix-agent2"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when: zabbix_agent2_check.rc == 0
  ignore_errors: true
  tags: [zabbix, service, agent2]

- name: Start and enable Zabbix agent (if agent2 is not installed)
  systemd:
    name: "zabbix-agent"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when:
    - zabbix_agent2_check.rc != 0
    - zabbix_agent_check.rc == 0
  ignore_errors: true
  tags: [zabbix, service, agent]

- name: Check if zabbix-java-gateway package is installed
  command: rpm -q zabbix-java-gateway
  register: zabbix_java_gateway_check
  failed_when: false
  changed_when: false
  become: true
  tags: [zabbix, service, java_gateway]

- name: Check if zabbix-java-gateway service file exists
  stat:
    path: /usr/lib/systemd/system/zabbix-java-gateway.service
  register: zabbix_java_gateway_service_file
  become: true
  when: zabbix_java_gateway_check.rc == 0
  tags: [zabbix, service, java_gateway]

- name: Start and enable Zabbix Java Gateway
  systemd:
    name: "zabbix-java-gateway"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when:
    - zabbix_java_gateway_check.rc == 0
    - zabbix_java_gateway_service_file.stat.exists | default(false)
  ignore_errors: true
  tags: [zabbix, service, java_gateway]
