---
# Zabbix Agents and Java Gateway Installation Only
# This file installs only agents and Java Gateway, no server components

- name: Ensure offline directory exists on agent hosts
  file:
    path: "{{ paths.offline_dir }}"
    state: directory
    mode: '0755'
  become: yes
  tags: [zabbix, install, repository]

- name: Check if createrepo_c is installed
  command: rpm -q createrepo_c
  register: createrepo_c_check
  failed_when: false
  changed_when: false
  become: yes
  tags: [zabbix, install, dependencies]

# These hosts are offline, so `dnf install createrepo_c` cannot work. Install it
# from the offline RPMs the same way the Zabbix server play does.
- name: Find createrepo_c packages on the controller
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "createrepo_c-*.rpm"
      - "createrepo_c-libs-*.rpm"
  register: createrepo_packages_local
  delegate_to: localhost
  when: createrepo_c_check.rc != 0
  tags: [zabbix, install, dependencies]

- name: Copy createrepo_c packages to agent host
  copy:
    src: "{{ item.path }}"
    dest: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ createrepo_packages_local.files | default([]) }}"
  become: yes
  tags: [zabbix, install, dependencies]

- name: Install createrepo_c-libs first (dependency for createrepo_c)
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ createrepo_packages_local.files | default([]) | selectattr('path', 'match', '.*createrepo_c-libs.*') | list }}"
  become: yes
  ignore_errors: yes
  tags: [zabbix, install, dependencies]

- name: Install createrepo_c after libs
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ createrepo_packages_local.files | default([]) | rejectattr('path', 'match', '.*createrepo_c-libs.*') | list }}"
  become: yes
  ignore_errors: yes
  tags: [zabbix, install, dependencies]

- name: Re-check createrepo_c after offline install
  command: rpm -q createrepo_c
  register: createrepo_c_present
  failed_when: false
  changed_when: false
  become: yes
  tags: [zabbix, install, repository]

- name: Clean existing repodata directory if it exists
  file:
    path: "{{ paths.offline_dir }}/.repodata"
    state: absent
  become: yes
  tags: [zabbix, install, repository]

- name: Create local YUM repository from offline packages
  command: createrepo_c {{ paths.offline_dir }}
  become: yes
  when: createrepo_c_present.rc == 0
  ignore_errors: yes
  tags: [zabbix, install, repository]

- name: Check offline repository metadata
  stat:
    path: "{{ paths.offline_dir }}/repodata/repomd.xml"
  register: offline_repo_metadata
  become: yes
  tags: [zabbix, install, repository]

- name: Record whether offline-repo can be used
  set_fact:
    zabbix_offline_repo_usable: "{{ offline_repo_metadata.stat.exists | default(false) }}"
  tags: [zabbix, install, repository]

- name: Create local repository configuration
  copy:
    content: |
      [offline-repo]
      name=Offline Repository
      baseurl=file://{{ paths.offline_dir }}
      enabled=1
      gpgcheck=0
    dest: /etc/yum.repos.d/offline.repo
    mode: '0644'
  become: yes
  when: zabbix_offline_repo_usable | bool
  tags: [zabbix, install, repository]

# A repo definition without repodata/repomd.xml breaks every later dnf/yum call
# on the host ("Failed to download metadata for repo 'offline-repo'"), including
# the DMC and MMG installs. Remove it instead of leaving it behind.
- name: Remove offline-repo definition when it has no metadata
  file:
    path: /etc/yum.repos.d/offline.repo
    state: absent
  become: yes
  when: not (zabbix_offline_repo_usable | bool)
  tags: [zabbix, install, repository]

- name: Warn when offline-repo is unavailable and direct RPM installs are used
  debug:
    msg: >-
      No {{ paths.offline_dir }}/repodata/repomd.xml on {{ inventory_hostname }}
      (createrepo_c missing). Zabbix agent packages install directly from RPM
      files instead of through offline-repo.
  when: not (zabbix_offline_repo_usable | bool)
  tags: [zabbix, install, repository]

- name: Clean YUM cache
  command: yum clean all
  become: yes
  failed_when: false
  tags: [zabbix, install, repository]

- name: Remove any existing Zabbix packages to avoid conflicts
  dnf:
    name:
      - zabbix-agent
      - zabbix-agent2
      - zabbix-java-gateway
      - zabbix-selinux-policy
    state: absent
    autoremove: yes
  become: true
  ignore_errors: yes
  tags: [zabbix, install, cleanup]

- name: Check if zabbix-agent2 package exists in offline directory
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "zabbix-agent2-*.el9.x86_64.rpm"
      - "zabbix-agent2-*.rpm"
  register: zabbix_agent2_package_check
  delegate_to: localhost
  tags: [zabbix, install, dependencies]

- name: Check if zabbix-agent package exists in offline directory
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "zabbix-agent-*.el9.x86_64.rpm"
      - "zabbix-agent-*.rpm"
  register: zabbix_agent_package_check
  delegate_to: localhost
  tags: [zabbix, install, dependencies]

- name: Copy zabbix-agent2 package to target if found (exclude plugins)
  copy:
    src: "{{ item.path }}"
    dest: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ zabbix_agent2_package_check.files | rejectattr('path', 'match', '.*plugin.*') | list }}"
  become: yes
  when: zabbix_agent2_package_check.files | length > 0
  tags: [zabbix, install, dependencies]

- name: Install Zabbix agent2 and dependencies (if agent2 is available) - try repository first
  dnf:
    name:
      - zabbix-agent2
      - zabbix-agent2-plugin-postgresql
      - zabbix-agent2-plugin-mongodb
      - zabbix-agent2-plugin-mssql
      - zabbix-selinux-policy
      - fping
    state: present
    enablerepo: offline-repo
    disablerepo: epel,epel-modular
    disable_gpg_check: yes
  become: true
  when:
    - zabbix_agent2_package_check.files | length > 0
    - zabbix_offline_repo_usable | bool
  ignore_errors: yes
  register: agent2_install_result
  tags: [zabbix, install, dependencies]

- name: Install zabbix-agent2 directly from RPM if repository installation failed
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ zabbix_agent2_package_check.files | rejectattr('path', 'match', '.*plugin.*') | list }}"
  become: true
  when:
    - zabbix_agent2_package_check.files | length > 0
    - agent2_install_result is defined
    - (agent2_install_result.skipped | default(false))
      or (agent2_install_result.failed | default(false))
      or ((agent2_install_result.rc | default(0)) != 0)
  ignore_errors: yes
  register: agent2_direct_install
  tags: [zabbix, install, dependencies]

- name: Verify zabbix-agent2 is installed
  command: rpm -q zabbix-agent2
  register: zabbix_agent2_installed_check
  failed_when: false
  changed_when: false
  become: true
  when: zabbix_agent2_package_check.files | length > 0
  tags: [zabbix, install, dependencies]

- name: Install zabbix-agent2 plugins directly from RPM if agent2 was installed
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ zabbix_agent2_package_check.files | selectattr('path', 'match', '.*plugin.*') | list }}"
  become: true
  when:
    - zabbix_agent2_package_check.files | length > 0
    - zabbix_agent2_installed_check.rc == 0
  ignore_errors: yes
  tags: [zabbix, install, dependencies]

- name: Install zabbix-selinux-policy and fping if not already installed
  dnf:
    name:
      - zabbix-selinux-policy
      - fping
    state: present
    enablerepo: offline-repo
    disablerepo: epel,epel-modular
    disable_gpg_check: yes
  become: true
  when:
    - zabbix_agent2_package_check.files | length > 0
    - zabbix_offline_repo_usable | bool
  ignore_errors: yes
  tags: [zabbix, install, dependencies]

- name: Find zabbix-selinux-policy and fping RPMs for direct install
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "zabbix-selinux-policy-*.rpm"
      - "fping-*.rpm"
  register: zabbix_selinux_fping_local
  delegate_to: localhost
  when: not (zabbix_offline_repo_usable | bool)
  tags: [zabbix, install, dependencies]

- name: Copy zabbix-selinux-policy and fping RPMs to agent host
  copy:
    src: "{{ item.path }}"
    dest: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ zabbix_selinux_fping_local.files | default([]) }}"
  become: yes
  tags: [zabbix, install, dependencies]

- name: Install zabbix-selinux-policy and fping directly from RPM
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ zabbix_selinux_fping_local.files | default([]) }}"
  become: yes
  ignore_errors: yes
  tags: [zabbix, install, dependencies]

- name: Install Zabbix agent (fallback if agent2 is not available)
  dnf:
    name:
      - zabbix-agent
      - zabbix-selinux-policy
      - fping
    state: present
    enablerepo: offline-repo
    disablerepo: epel,epel-modular
    disable_gpg_check: yes
  become: true
  when: 
    - zabbix_agent2_package_check.files | length == 0
    - zabbix_agent_package_check.files | length > 0
    - zabbix_offline_repo_usable | bool
  ignore_errors: yes
  register: agent_install_result
  tags: [zabbix, install, dependencies]

- name: Install zabbix-agent directly from RPM if repository installation failed
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ zabbix_agent_package_check.files }}"
  become: true
  when:
    - zabbix_agent2_package_check.files | length == 0
    - zabbix_agent_package_check.files | length > 0
    - agent_install_result is defined
    - (agent_install_result.skipped | default(false))
      or (agent_install_result.failed | default(false))
      or ((agent_install_result.rc | default(0)) != 0)
  ignore_errors: yes
  tags: [zabbix, install, dependencies]

- name: Warn if no agent package is available
  debug:
    msg: |
      WARNING: Neither zabbix-agent2 nor zabbix-agent package found in {{ paths.offline_dir }}.
      Please ensure at least one agent package is available.
  when:
    - zabbix_agent2_package_check.files | length == 0
    - zabbix_agent_package_check.files | length == 0
  tags: [zabbix, install, dependencies]

- name: Find Java dependency packages in offline directory
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "lksctp-tools-*.x86_64.rpm"
      - "javapackages-filesystem-*.noarch.rpm"
      - "copy-jdk-configs-*.noarch.rpm"
      - "tzdata-java-*.noarch.rpm"
      - "java-17-openjdk-headless-*.x86_64.rpm"
  register: java_deps_packages
  delegate_to: localhost
  when: inventory_hostname in groups['zabbix'] | default([])
  tags: [zabbix, install, java_gateway]

- name: Copy Java dependency packages to target if found
  copy:
    src: "{{ item.path }}"
    dest: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ java_deps_packages.files | default([]) }}"
  become: yes
  when: inventory_hostname in groups['zabbix'] | default([])
  tags: [zabbix, install, java_gateway]

- name: Install Java dependencies first (required by java-17-openjdk-headless)
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ java_deps_packages.files | default([]) | selectattr('path', 'match', '.*(lksctp-tools|javapackages-filesystem|copy-jdk-configs|tzdata-java).*') | list }}"
  become: yes
  when: inventory_hostname in groups['zabbix'] | default([])
  ignore_errors: yes
  tags: [zabbix, install, java_gateway]

- name: Install java-17-openjdk-headless (required by zabbix-java-gateway)
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ java_deps_packages.files | default([]) | selectattr('path', 'match', '.*java-17-openjdk-headless.*') | list }}"
  become: yes
  when: inventory_hostname in groups['zabbix'] | default([])
  ignore_errors: yes
  tags: [zabbix, install, java_gateway]

- name: Install Zabbix Java Gateway (only on Zabbix servers) - try repository first
  dnf:
    name:
      - zabbix-java-gateway
    state: present
    enablerepo: offline-repo
    disablerepo: epel,epel-modular
    disable_gpg_check: yes
  become: true
  when:
    - inventory_hostname in groups['zabbix'] | default([])
    - zabbix_offline_repo_usable | bool
  ignore_errors: yes
  register: java_gateway_install_result
  tags: [zabbix, install, java_gateway]

- name: Find zabbix-java-gateway package in offline directory
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "zabbix-java-gateway-*.el9.x86_64.rpm"
      - "zabbix-java-gateway-*.rpm"
  register: zabbix_java_gateway_package
  delegate_to: localhost
  when:
    - inventory_hostname in groups['zabbix'] | default([])
    - java_gateway_install_result is defined
    - (java_gateway_install_result.skipped | default(false))
      or (java_gateway_install_result.failed | default(false))
      or ((java_gateway_install_result.rc | default(0)) != 0)
  tags: [zabbix, install, java_gateway]

- name: Copy zabbix-java-gateway package to target if found
  copy:
    src: "{{ item.path }}"
    dest: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ zabbix_java_gateway_package.files | default([]) }}"
  become: yes
  when: inventory_hostname in groups['zabbix'] | default([])
  tags: [zabbix, install, java_gateway]

- name: Install zabbix-java-gateway directly from RPM if repository installation failed
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ zabbix_java_gateway_package.files | default([]) }}"
  become: yes
  when: inventory_hostname in groups['zabbix'] | default([])
  ignore_errors: yes
  tags: [zabbix, install, java_gateway]
