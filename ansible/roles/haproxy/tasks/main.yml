---
# HAProxy Installation Tasks
# Supports both offline and online installation

- name: Ensure offline directory exists on target
  file:
    path: "{{ paths.offline_dir }}"
    state: directory
    mode: '0755'
  become: yes
  tags: [haproxy, install, packages]

- name: Get HAProxy package files from control node
  set_fact:
    haproxy_source_files: "{{ lookup('fileglob', paths.offline_dir + '/haproxy-*.rpm', wantlist=True, errors='ignore') }}"
  tags: [haproxy, install, packages]

- name: Display HAProxy source files found on control node
  debug:
    msg: "HAProxy source files found: {{ haproxy_source_files }}"
  tags: [haproxy, install, packages, debug]

- name: Copy HAProxy package to target
  copy:
    src: "{{ item }}"
    dest: "{{ paths.offline_dir }}/"
    mode: '0644'
  loop: "{{ haproxy_source_files | default([]) }}"
  become: yes
  when: haproxy_source_files | length > 0
  tags: [haproxy, install, packages]

- name: Find HAProxy package in offline directory
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "haproxy-*.rpm"
      - "{{ package_globs.haproxy_rpm }}"
    file_type: file
  register: haproxy_package_files
  tags: [haproxy, install, packages]

- name: Display HAProxy packages found
  debug:
    msg: "HAProxy packages found: {{ haproxy_package_files.files | map(attribute='path') | map('basename') | list }}"
  when: haproxy_package_files.files | length > 0
  tags: [haproxy, install, packages, debug]

- name: Filter HAProxy packages by OS version (prefer EL9, skip EL8)
  set_fact:
    haproxy_packages_filtered: "{{ haproxy_package_files.files | selectattr('path', 'match', '.*el9.*') | list }}"
  when: haproxy_package_files.files | length > 0
  tags: [haproxy, install, packages]

- name: Fallback to all packages if no EL9 packages found
  set_fact:
    haproxy_packages_filtered: "{{ haproxy_package_files.files }}"
  when:
    - haproxy_package_files.files | length > 0
    - haproxy_packages_filtered | default([]) | length == 0
  tags: [haproxy, install, packages]

- name: Display filtered HAProxy packages
  debug:
    msg: "HAProxy packages to install: {{ haproxy_packages_filtered | default([]) | map(attribute='path') | map('basename') | list }}"
  when: haproxy_packages_filtered | default([]) | length > 0
  tags: [haproxy, install, packages, debug]

- name: Install HAProxy dependencies
  dnf:
    name:
      - openssl-libs
      - lua
    state: present
    disablerepo: epel,epel-modular
  become: yes
  ignore_errors: yes
  tags: [haproxy, install, packages, dependencies]

- name: Install HAProxy package (offline using rpm)
  command: rpm -Uvh --force "{{ item.path }}"
  loop: "{{ haproxy_packages_filtered | default([]) }}"
  become: yes
  when: haproxy_packages_filtered | default([]) | length > 0
  register: haproxy_install_result
  tags: [haproxy, install, packages]

- name: Install HAProxy package with --nodeps if dependency install failed
  command: rpm -Uvh --force --nodeps "{{ item.path }}"
  loop: "{{ haproxy_packages_filtered | default([]) }}"
  become: yes
  when: 
    - haproxy_packages_filtered | default([]) | length > 0
    - haproxy_install_result.results | selectattr('rc', 'ne', 0) | list | length > 0
  register: haproxy_install_nodeps
  tags: [haproxy, install, packages]

- name: Warn if installed with --nodeps
  debug:
    msg: "WARNING: HAProxy installed with --nodeps flag. Some features may not work if dependencies are missing."
  when:
    - haproxy_packages_filtered | default([]) | length > 0
    - haproxy_install_result.results | selectattr('rc', 'ne', 0) | list | length > 0
    - haproxy_install_nodeps.results | selectattr('rc', 'eq', 0) | list | length > 0
  tags: [haproxy, install, packages]

- name: Fail if no HAProxy package found
  fail:
    msg: "No HAProxy package found in {{ paths.offline_dir }}. Please ensure haproxy-*.rpm is available."
  when: haproxy_package_files.files | length == 0
  tags: [haproxy, install, packages]

- name: Create HAProxy directories
  file:
    path: "{{ item }}"
    state: directory
    owner: haproxy
    group: haproxy
    mode: '0755'
  become: yes
  loop:
    - "{{ haproxy_chroot_dir }}"
    - "{{ haproxy_chroot_dir }}/dev"
    - "{{ haproxy_chroot_dir }}/run"
    - "{{ haproxy_chroot_dir }}/run/stunnel"
    - "{{ haproxy_chroot_dir }}/run/stunnel/sockets"

- name: Create SSL certificate directory
  file:
    path: /etc/pki/tls/certs
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Clean up old SSL certificate files
  file:
    path: "{{ item }}"
    state: absent
  become: yes
  loop:
    - /etc/pki/tls/certs/haproxy.pem
    - /etc/pki/tls/certs/haproxy.pem.key
    - /etc/pki/tls/certs/haproxy.crt
    - /etc/pki/tls/certs/haproxy.key

- name: Generate demo SSL certificate and key for HAProxy (combined PEM)
  shell: |
    openssl req -x509 -newkey rsa:2048 -keyout /tmp/haproxy.key -out /tmp/haproxy.crt -days 365 -nodes -subj "/C=US/ST=State/L=City/O=Organization/CN={{ ansible_fqdn | default(ansible_hostname) }}"
    cat /tmp/haproxy.crt /tmp/haproxy.key > /etc/pki/tls/certs/haproxy.pem
    rm -f /tmp/haproxy.key /tmp/haproxy.crt
  become: yes

- name: Set proper permissions on SSL certificate
  file:
    path: /etc/pki/tls/certs/haproxy.pem
    mode: '0644'
    owner: root
    group: root
  become: yes

- name: Configure HAProxy
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
    backup: yes
  become: yes
  notify: restart haproxy

- name: Ensure HAProxy config ends with newline
  shell: echo >> /etc/haproxy/haproxy.cfg
  become: yes
  changed_when: false

- name: Configure rsyslog for HAProxy
  template:
    src: 99-haproxy.conf.j2
    dest: /etc/rsyslog.d/99-haproxy.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  become: yes
  notify: restart rsyslog

- name: Verify SSL certificate exists
  stat:
    path: /etc/pki/tls/certs/haproxy.pem
  register: ssl_cert_check

- name: Fail if SSL certificate not found
  fail:
    msg: "SSL certificate /etc/pki/tls/certs/haproxy.pem not found"
  when: not ssl_cert_check.stat.exists

- name: Validate HAProxy configuration
  command: haproxy -c -f /etc/haproxy/haproxy.cfg
  register: haproxy_config_check
  changed_when: false
  failed_when: haproxy_config_check.rc != 0
  become: yes

- name: Enable and start HAProxy service
  systemd:
    name: haproxy
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes
  when: haproxy_config_check.rc == 0

- name: Verify HAProxy is running
  systemd:
    name: haproxy
  register: haproxy_status
  become: yes

- name: Display HAProxy status
  debug:
    msg: "HAProxy is {{ haproxy_status.status.ActiveState }}"

