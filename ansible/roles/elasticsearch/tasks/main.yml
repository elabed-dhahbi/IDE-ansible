---
# Elasticsearch Installation and Configuration

- name: Include Elasticsearch installation tasks
  include_tasks: install_elasticsearch.yml
  tags: [elasticsearch, install]

- name: Include Elasticsearch user configuration tasks
  include_tasks: configure_user.yml
  tags: [elasticsearch, user]

- name: Include Elasticsearch directory setup tasks
  include_tasks: configure_directories.yml
  tags: [elasticsearch, directories]

- name: Include Elasticsearch configuration tasks
  include_tasks: configure_elasticsearch.yml
  tags: [elasticsearch, config]

- name: Include Elasticsearch security setup tasks
  include_tasks: configure_security.yml
  tags: [elasticsearch, security]

- name: Include Elasticsearch service configuration tasks
  include_tasks: configure_service.yml
  tags: [elasticsearch, service]

- name: Include Elasticsearch ILM policies for Logstash
  include_tasks: "{{ playbook_dir }}/tasks/ensure_logstash_ilm_policies.yml"
  vars:
    es_ilm_url_base: "http://127.0.0.1:{{ service_ports.elasticsearch }}"
    es_ilm_user: "elastic"
    es_ilm_password: "{{ system_config.service_passwords.elasticsearch | default('elastic') }}"
  tags: [elasticsearch, ilm]


