---
# Elasticsearch Installation Tasks

- name: Ensure offline directory exists on target
  file:
    path: "{{ paths.offline_dir }}"
    state: directory
    mode: '0755'
  become: yes
  tags: [elasticsearch, install, packages]

- name: Find Elasticsearch packages on controller
  find:
    paths: "{{ paths.offline_dir }}"
    patterns: "{{ elasticsearch_package }}"
  register: elasticsearch_rpm_files
  delegate_to: localhost
  become: no
  tags: [elasticsearch, install, packages]

- name: Fail if Elasticsearch package is not available
  fail:
    msg: "Elasticsearch package not found: {{ paths.offline_dir }}/{{ elasticsearch_package }}"
  when: elasticsearch_rpm_files.files | length == 0
  tags: [elasticsearch, install, packages]

- name: Copy Elasticsearch packages to target
  copy:
    src: "{{ item.path }}"
    dest: "{{ paths.offline_dir }}/"
    mode: '0644'
  loop: "{{ elasticsearch_rpm_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  become: yes
  tags: [elasticsearch, install, packages]

- name: Install Elasticsearch package
  yum:
    name: "{{ paths.offline_dir }}/{{ item.path | basename }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ elasticsearch_rpm_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  become: yes
  tags: [elasticsearch, install, packages]

- name: Check if Elasticsearch is already installed
  stat:
    path: "{{ elasticsearch_install_dir }}"
  register: elasticsearch_installed
  tags: [elasticsearch, install, check]
