---
# Elasticsearch Service Configuration Tasks

- name: Check if Elasticsearch is already running
  systemd:
    name: "{{ elasticsearch_service_name }}"
  register: elasticsearch_status
  tags: [elasticsearch, service, check]

- name: Start Elasticsearch service (ignore systemd timeouts)
  command: systemctl start {{ elasticsearch_service_name }}
  become: yes
  ignore_errors: yes
  when: elasticsearch_status.status.ActiveState != "active"
  tags: [elasticsearch, service, start]

- name: Enable Elasticsearch service
  command: systemctl enable {{ elasticsearch_service_name }}
  become: yes
  ignore_errors: yes
  when: elasticsearch_status.status.ActiveState != "active"
  tags: [elasticsearch, service, enable]

- name: Wait for Elasticsearch to be ready
  wait_for:
    port: "{{ service_ports.elasticsearch }}"
    host: "127.0.0.1"
    delay: 10
    timeout: 300
  ignore_errors: yes
  tags: [elasticsearch, service, wait]

- name: Check whether Elasticsearch password bootstrap is already complete
  uri:
    url: "http://127.0.0.1:{{ service_ports.elasticsearch }}/_security/_authenticate"
    method: GET
    user: "elastic"
    password: "{{ system_config.service_passwords.elasticsearch | default('elastic') }}"
    force_basic_auth: yes
    status_code: [200, 401]
  register: elasticsearch_password_auth
  failed_when: false
  tags: [elasticsearch, service, passwords]

- name: Show Elasticsearch password bootstrap state
  debug:
    msg: >-
      Elasticsearch password bootstrap already complete={{ elasticsearch_password_auth.status == 200 }}
  tags: [elasticsearch, service, passwords]

# `elasticsearch-setup-passwords interactive` drives a JLine terminal: under a
# pty its prompts arrive as terminal control sequences, so driving it with
# expect times out waiting for text that never appears literally. Bootstrap
# without a terminal instead - seed bootstrap.password in the keystore, restart
# once, then set the remaining reserved users over the REST API.
- name: Seed the elastic bootstrap password in the Elasticsearch keystore
  shell: |
    set -euo pipefail
    if [ ! -f "${ES_PATH_CONF}/elasticsearch.keystore" ]; then
      bin/elasticsearch-keystore create
    fi
    printf '%s' "{{ system_config.service_passwords.elasticsearch | default('elastic') }}" \
      | bin/elasticsearch-keystore add -x -f bootstrap.password
  args:
    chdir: /usr/share/elasticsearch
    executable: /bin/bash
  environment:
    ES_PATH_CONF: "{{ elasticsearch_config_dir }}"
  become: yes
  when: elasticsearch_password_auth.status != 200
  tags: [elasticsearch, service, passwords]

- name: Restore Elasticsearch keystore ownership
  file:
    path: "{{ elasticsearch_config_dir }}/elasticsearch.keystore"
    owner: root
    group: "{{ elasticsearch_group }}"
    mode: '0660'
  become: yes
  when: elasticsearch_password_auth.status != 200
  tags: [elasticsearch, service, passwords]

# bootstrap.password is only read at startup, and only applies while the
# reserved users have no password stored in the security index.
- name: Restart Elasticsearch to apply the bootstrap password
  systemd:
    name: "{{ elasticsearch_service_name }}"
    state: restarted
  become: yes
  when: elasticsearch_password_auth.status != 200
  tags: [elasticsearch, service, passwords, restart]

- name: Wait for Elasticsearch to listen after the bootstrap restart
  wait_for:
    port: "{{ service_ports.elasticsearch }}"
    host: "127.0.0.1"
    delay: 10
    timeout: 300
  when: elasticsearch_password_auth.status != 200
  tags: [elasticsearch, service, passwords, wait]

- name: Wait until the elastic user authenticates
  uri:
    url: "http://127.0.0.1:{{ service_ports.elasticsearch }}/_security/_authenticate"
    method: GET
    user: "elastic"
    password: "{{ system_config.service_passwords.elasticsearch | default('elastic') }}"
    force_basic_auth: yes
    status_code: 200
  register: elasticsearch_elastic_auth
  retries: 30
  delay: 5
  until: elasticsearch_elastic_auth.status | default(0) == 200
  when: elasticsearch_password_auth.status != 200
  tags: [elasticsearch, service, passwords]

- name: Set passwords for the remaining reserved users
  uri:
    url: "http://127.0.0.1:{{ service_ports.elasticsearch }}/_security/user/{{ item }}/_password"
    method: PUT
    user: "elastic"
    password: "{{ system_config.service_passwords.elasticsearch | default('elastic') }}"
    force_basic_auth: yes
    body_format: json
    body:
      password: "{{ system_config.service_passwords.elasticsearch | default('elastic') }}"
    status_code: 200
  loop:
    - kibana_system
    - logstash_system
    - beats_system
    - apm_system
    - remote_monitoring_user
  when: elasticsearch_password_auth.status != 200
  tags: [elasticsearch, service, passwords]

- name: Mark Elasticsearch passwords as bootstrapped
  set_fact:
    passwords_changed: "{{ elasticsearch_password_auth.status != 200 }}"
  tags: [elasticsearch, service, passwords]

- name: Check Elasticsearch cluster health
  uri:
    url: "http://127.0.0.1:{{ service_ports.elasticsearch }}/_cluster/health"
    method: GET
    user: "elastic"
    password: "{{ system_config.service_passwords.elasticsearch | default('elastic') }}"
    force_basic_auth: yes
  register: elasticsearch_health
  tags: [elasticsearch, service, health]

- name: Display Elasticsearch status
  debug:
    msg:
      - "Elasticsearch is running on 127.0.0.1:{{ service_ports.elasticsearch }}"
      - "Cluster status: {{ elasticsearch_health.json.status | default('unknown') }}"
  tags: [elasticsearch, service, status]
