# DRS directories and the drs user are created by the SCPdrs RPM.
# Do not mkdir /opt/drs (or subdirs) and do not recurse-chown the install tree.
# Recursive file/chown walks crash on vendor resource links
# (e.g. .../Fisio 639/pictures/picture.gif).

- name: Verify DRS install directory exists (created by RPM)
  stat:
    path: "{{ drs_install_dir }}"
  register: drs_install_stat
  tags: [drs, directories]

- name: Require DRS install directory from RPM
  assert:
    that:
      - drs_install_stat.stat.exists | default(false)
      - drs_install_stat.stat.isdir | default(false)
    fail_msg: >-
      {{ drs_install_dir }} is missing after SCPdrs RPM install.
      The package should create the user, group, and directory layout.
  tags: [drs, directories]
