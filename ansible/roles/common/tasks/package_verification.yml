    - not kibana_package_check.stat.exists 
    - package_verification.fail_on_missing
  tags: [common, packages, verification, kibana]

- name: Check for Logstash package
  shell: "ls {{ paths.offline_dir }}/logstash-*.rpm 2>/dev/null | head -1"
  register: logstash_package_check
  when: inventory_hostname in groups['logstash']
  failed_when: false
  tags: [common, packages, verification, logstash]

- name: Fail if Logstash package not found
  fail:
    msg: "Logstash package not found in {{ paths.offline_dir }}/"
  when: 
    - inventory_hostname in groups['logstash']
    - logstash_package_check.stdout == ""
    - package_verification.fail_on_missing | default(false)
  tags: [common, packages, verification, logstash]

- name: Check for JDK8 package
  shell: "ls {{ paths.offline_dir }}/openlogic-openjdk-8u*linux*.tar.gz 2>/dev/null | head -1"
  register: jdk8_package_check
  failed_when: false
  tags: [common, packages, verification, jdk]

- name: Fail if JDK8 package not found
  fail:
    msg: "JDK8 package not found in {{ paths.offline_dir }}/"
  when: 
    - jdk8_package_check.stdout == ""
    - package_verification.fail_on_missing | default(false)
  tags: [common, packages, verification, jdk]

- name: Display package verification results
  debug:
    msg:
      - "Package verification completed"
      - "PostgreSQL repo: {{ 'Found' if postgres_repo_check.stat.exists else 'Missing' }}"
      - "DMC: {{ 'Found' if dmc_package_check.stat.exists else 'Missing' }}"
      - "MMG: {{ 'Found' if mmg_package_check.stat.exists else 'Missing' }}"
      - "MMSOAP: {{ 'Found' if mmsoap_package_check.stat.exists else 'Missing' }}"
      - "SMPPC: {{ 'Found' if smppc_package_check.stat.exists else 'Missing' }}"
      - "SLS: {{ 'Found' if sls_package_check.stat.exists else 'Missing' }}"
      - "Elasticsearch: {{ 'Found' if es_package_check.stat.exists else 'Missing' }}"
      - "Kibana: {{ 'Found' if kibana_package_check.stat.exists else 'Missing' }}"
      - "Logstash: {{ 'Found' if logstash_package_check.stat.exists else 'Missing' }}"
      - "JDK8: {{ 'Found' if jdk8_package_check.stat.exists else 'Missing' }}"
  tags: [common, packages, verification, summary]
