---
# Package Verification Tasks
# Verifies that required packages are available in offline directory

- name: Check if offline directory exists
  stat:
    path: "{{ paths.offline_dir }}"
  register: offline_dir_check
  tags: [common, packages, verification]

- name: Fail if offline directory not found
  fail:
    msg: "Offline package directory not found: {{ paths.offline_dir }}"
  when: not offline_dir_check.stat.exists
  tags: [common, packages, verification]

- name: Verify PostgreSQL repository package
  stat:
    path: "{{ paths.offline_dir }}/{{ package_globs.pgdg_repo_rpm }}"
  register: postgres_repo_check
  when: inventory_hostname in groups['postgres']
  tags: [common, packages, verification, postgres]

- name: Fail if PostgreSQL repository package not found
  fail:
    msg: "PostgreSQL repository package not found: {{ paths.offline_dir }}/{{ package_globs.pgdg_repo_rpm }}"
  when: 
    - inventory_hostname in groups['postgres']
    - not postgres_repo_check.stat.exists 
    - package_verification.fail_on_missing
  tags: [common, packages, verification, postgres]

- name: Verify DMC package
  stat:
    path: "{{ paths.offline_dir }}/{{ package_globs.dmc_rpm }}"
  register: dmc_package_check
  when: inventory_hostname in groups['dmc1'] or inventory_hostname in groups['dmc2']
  tags: [common, packages, verification, dmc]

- name: Fail if DMC package not found
  fail:
    msg: "DMC package not found: {{ paths.offline_dir }}/{{ package_globs.dmc_rpm }}"
  when: 
    - inventory_hostname in groups['dmc1'] or inventory_hostname in groups['dmc2']
    - not dmc_package_check.stat.exists 
    - package_verification.fail_on_missing
