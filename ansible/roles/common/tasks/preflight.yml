---
# Preflight System Preparation
# Basic system preparation for DMC installation

- name: Display system information
  debug:
    msg:
      - "System: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      - "Architecture: {{ ansible_architecture }}"
      - "Memory: {{ ansible_memtotal_mb / 1024 | round(1) }}GB"
      - "CPU Cores: {{ ansible_processor_vcpus }}"
      - "Available Disk: {{ ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first | int / 1024 / 1024 / 1024 | round(1) }}GB"
  tags: [common, preflight, info]

# A file:// repo definition whose repodata is missing makes every dnf/yum call
# on the host fail with "Failed to download metadata for repo 'offline-repo'".
# Left behind by an earlier run, it breaks preflight, Zabbix, DMC and MMG.
- name: Remove local file:// repositories that have no metadata
  shell: |
    set -u
    changed=0
    for repo in $(ls /etc/yum.repos.d/*.repo 2>/dev/null); do
      base="$(sed -n 's|^baseurl[[:space:]]*=[[:space:]]*file://||p' "$repo" | head -1)"
      [ -n "$base" ] || continue
      if [ ! -f "${base}/repodata/repomd.xml" ]; then
        echo "removing $repo (no ${base}/repodata/repomd.xml)"
        rm -f "$repo"
        changed=1
      fi
    done
    exit $changed
  args:
    executable: /bin/bash
  register: stale_local_repos
  become: yes
  changed_when: stale_local_repos.rc == 1
  failed_when: false
  tags: [common, preflight, repository]

- name: Report removed local repositories
  debug:
    msg: "{{ stale_local_repos.stdout_lines | default([]) }}"
  when: stale_local_repos.stdout_lines | default([]) | length > 0
  tags: [common, preflight, repository]

- name: Check if firewalld package is installed
  package_facts:
    manager: auto
  register: package_facts_result
  tags: [common, preflight]

- name: Stop and disable firewalld
  systemd:
    name: firewalld
    state: stopped
    enabled: false
  become: true
  when: "'firewalld' in ansible_facts.packages"
  tags: [common, preflight, firewall]

- name: Set SELinux to permissive mode
  selinux:
    policy: targeted
    state: permissive
  become: true
  tags: [common, preflight, selinux]

- name: Ensure SELinux is permissive (restart if needed)
  command: setenforce 0
  become: true
  failed_when: false
  tags: [common, preflight, selinux]

- name: Verify SELinux status
  command: getenforce
  register: selinux_status
  changed_when: false
  tags: [common, preflight, selinux]

- name: Display SELinux status
  debug:
    msg: "SELinux status: {{ selinux_status.stdout }}"
  tags: [common, preflight, selinux]
