---
# Logstash Installation Tasks

- name: Ensure offline directory exists on target
  file:
    path: "{{ paths.offline_dir }}"
    state: directory
    mode: '0755'
  become: yes
  tags: [logstash, install, packages]

- name: Copy Logstash packages to target
  copy:
    src: "{{ item }}"
    dest: "{{ paths.offline_dir }}/"
    mode: '0644'
  loop: "{{ lookup('fileglob', paths.offline_dir + '/' + package_globs.logstash_rpm, wantlist=True, errors='ignore') }}"
  become: yes
  tags: [logstash, install, packages]

- name: Install Logstash package
  yum:
    name: "{{ item }}"
    state: present
    disable_gpg_check: yes
  loop: "{{ lookup('fileglob', paths.offline_dir + '/' + package_globs.logstash_rpm, wantlist=True, errors='ignore') }}"
  become: yes
  tags: [logstash, install, packages]

- name: Check if Logstash is already installed
  stat:
    path: "{{ logstash_install_dir }}"
  register: logstash_installed
  tags: [logstash, install, check]