---
# SLS Configuration Defaults

# SLS version
sls_version: "{{ versions.sls }}"

# Service configuration
sls_service_name: "sls"
sls_user: "sls"
sls_group: "sls"

# Directory paths
sls_install_dir: "/opt/sls"
sls_home: "/opt/sls/home"
sls_current_dir: "/opt/sls/current"
sls_logs_dir: "/var/opt/sls/{{ sls_version }}/log"

# Java configuration
java_home: "/usr/j2se/openlogic-openjdk-8u412-b08-linux-x32"
java_version: "8u412-b08"

# SLS configuration
sls_config:
  # HTTP port
  http_port: 50420
  
  # Log paths
  application_log: "/var/opt/sls/{{ versions.sls }}/log/application.log"
  alert_log: "/var/opt/sls/{{ versions.sls }}/log/alert.log"
  
  # Platform configuration
  context_url: "http://{{ ansible_host }}:50420/"

# System packages required for SLS
sls_system_packages:
  - ksh
  - libnsl
  - libc.so.6
  - libnsl.so.1
  - libdl.so.2
  - ld-linux.so.2

# Package configuration
package_globs:
  sls_rpm: "SCPsls-{{ versions.sls }}*.tar.gz"
  jdk8_32bit: "openlogic-openjdk-{{ java_version }}*linux*.tar.gz"