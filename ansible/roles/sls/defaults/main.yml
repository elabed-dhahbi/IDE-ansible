---
# SLS Configuration Defaults

# SLS version
sls_version: "{{ versions.sls }}"

# Service configuration
sls_service_name: "sls"
sls_user: "sls"
sls_group: "sls"

# Directory paths
sls_install_dir: "/opt/sls"
sls_home: "/opt/sls/home"
sls_current_dir: "/opt/sls/current"
sls_logs_dir: "/var/opt/sls/{{ sls_version }}/log"

# Directory name of the 32-bit OpenJDK tarball after extract. versions.jdk8 is
# "8u412"; the folder is "openlogic-openjdk-8u412-b08-linux-x32".
sls_java_home: "/usr/j2se/openlogic-openjdk-8u412-b08-linux-x32"
java_version: "8u412-b08"

# SLS configuration
sls_config:
  http_port: "{{ service_ports.sls_http | default(50420) }}"
  application_log: "/var/opt/sls/{{ versions.sls }}/log/application.log"
  alert_log: "/var/opt/sls/{{ versions.sls }}/log/alert.log"
  context_url: "http://{{ ansible_host }}:{{ service_ports.sls_http | default(50420) }}/"

# System packages required for SLS
sls_system_packages:
  - ksh
  - libnsl
  - libc.so.6
  - libnsl.so.1
  - libdl.so.2
  - ld-linux.so.2

# Package globs come from config/packages.yaml (play vars_files). Do not
# redefine package_globs here: a role default would hide the play values.