---
# DMC Role Default Variables

# DMC version (inherited from main configuration)
dmc_version: "{{ versions.dmc }}"

# Service configuration
dmc_service_name: "dmc"
dmc_user: "dmc"
dmc_group: "dmc"

# Directory configuration
dmc_install_dir: "/opt/dmc"
dmc_home: "/opt/dmc/home"
dmc_current_dir: "/opt/dmc/current"
dmc_logs_dir: "/var/opt/dmc/{{ dmc_version }}/log"
dmc_conf_dir: "/opt/dmc/current/conf"
dmc_drbfile_dir: "/opt/dmc/drbfile"

# Java configuration (from centralized vars/release.yml)
java_major_version: "{{ java_major_version | default('8') }}"
java_full_version: "{{ java_full_version | default('8u412') }}"
java_build_version: "{{ java_build_version | default('8u412-b08') }}"
java_legacy_version: "{{ java_legacy_version | default('1_8_0_92') }}"
java_install_dir: "{{ system_paths.java_install_dir | default('/usr/j2se') }}"
# Full JDK path derived from sicap_java.offline_package (e.g. /usr/j2se/1_8_0_92-jdk)
dmc_sicap_jdk_home: "{{ ((sicap_java | default({})).install_dir | default(java_install_dir | default('/usr/j2se'))) }}/{{ ((sicap_java | default({})).offline_package | default('1_8_0_92-jdk.tar.gz')) | regex_replace('\\.tar\\.gz$', '') }}"
java_home: "{{ java_install_dir }}/current"
java_version: "{{ java_build_version }}"  # Legacy compatibility

# DMC configuration - simplified to avoid circular references
dmc_http_port: "{{ (dmc.http_port | default(50400)) if (dmc is defined) else 50400 }}"
dmc_http_host: "{{ (dmc.http_host | default('0.0.0.0')) if (dmc is defined) else '0.0.0.0' }}"
dmc_node_id: "{{ (dmc.node_id | default(1)) if (dmc is defined) else 1 }}"

# Current DMC node IP/host as defined by inventory.
# This ensures that when installing/configuring dmc1 vs dmc2, URLs point to THAT node.
dmc_node_ip: "{{ hostvars[inventory_hostname].ansible_host | default(ansible_host | default(inventory_hostname)) }}"

# Java memory settings.
# values.yaml carries these under the top-level `dmc_java` mapping, not under
# `dmc.java`: reading only `dmc.java` meant every value here fell back to the
# hardcoded default and values.yaml was ignored. `dmc.java` stays as a fallback
# for inventories that still set it.
dmc_java_xms: "{{ (dmc_java | default({})).xms | default(((dmc | default({})).java | default({})).xms | default('8192m', true), true) }}"
dmc_java_xmx: "{{ (dmc_java | default({})).xmx | default(((dmc | default({})).java | default({})).xmx | default('8192m', true), true) }}"
dmc_java_perm_size: "{{ (dmc_java | default({})).perm_size | default(((dmc | default({})).java | default({})).perm_size | default('512m', true), true) }}"
dmc_java_max_perm_size: "{{ (dmc_java | default({})).max_perm_size | default(((dmc | default({})).java | default({})).max_perm_size | default('512m', true), true) }}"

# Database configuration
# If using external database, set database_config.external_host in values.yaml
# Otherwise, it will use the first host in [postgres] group or localhost
dmc_database_host: >-
  {%- if database_config.external_host is defined and database_config.external_host -%}
    {{ database_config.external_host }}
  {%- elif groups['postgres'] is defined and groups['postgres'] | length > 0 -%}
    {{ hostvars[groups['postgres'][0]]['ansible_host'] }}
  {%- else -%}
    localhost
  {%- endif -%}
dmc_database_port: "{{ database_config.postgres_port | default(5432) }}"
dmc_database_name: "{{ database_config.dmc_database | default('dmc46') }}"
dmc_database_user: "{{ database_config.dmc_user | default('dmc4') }}"
dmc_database_password: "{{ database_config.dmc_password | default('dmc4') }}"
dmc_database_tablespace_data: "{{ database_config.tablespace_data | default('dmc4tab') }}"
dmc_database_tablespace_index: "{{ database_config.tablespace_index | default('dmc4idx') }}"
dmc_database_tablespace_lob: "{{ database_config.tablespace_lob | default('dmc4tab') }}"
# DMC schema name (many deployments expect all objects under this schema)
dmc_database_schema: "{{ database_config.dmc_schema | default('dmc4') }}"

# Provider configuration
dmc_provider_id: "{{ (dmc.provider.id | default(41)) if (dmc is defined and dmc.provider is defined) else 41 }}"
dmc_provider_name: "{{ customer_config.name | default('sicap') }}"
dmc_provider_description: "{{ customer_config.description | default('sicap test provider') }}"
dmc_provider_extid: "{{ (dmc.provider.extid | default(1)) if (dmc is defined and dmc.provider is defined) else 1 }}"
dmc_provider_extnumid: "{{ (dmc.provider.extnumid | default(1000)) if (dmc is defined and dmc.provider is defined) else 1000 }}"
dmc_provider_authenticated_mode: "{{ (dmc.provider.authenticated_mode | default(true)) if (dmc is defined and dmc.provider is defined) else true }}"

# External service configuration
# MMSOAP endpoint for cm-DMCProtocolMMG.properties — sourced from inventory group `[mmsoap]` (ansible_host).
# `service_ips.mmsoap` is derived the same way; we avoid `values.yaml` overrides here by design.
# Note: `| default()` does not trigger on empty strings, so treat '' as missing.
dmc_mmsoap_host: >-
  {{
    (
      hostvars[groups['mmsoap'][0]]['ansible_host']
      if groups['mmsoap'] is defined and groups['mmsoap'] | length > 0
      else none
    )
    | default(
        (
          (service_ips | default({})).mmsoap
          if (((service_ips | default({})).mmsoap | default('') | string) | length) > 0
          else none
        ),
        true
      )
  }}
dmc_mmsoap_port: >-
  {{
    (
      (service_ports | default({})).mmsoap_http
      | default((service_ports | default({})).mmsoap, true)
      | default(50434, true)
    )
  }}
dmc_mmsoap_username: "{{ database_config.dmc_user | default('dmc4') }}"
dmc_mmsoap_password: "{{ database_config.dmc_password | default('dmc4') }}"
dmc_mmsoap_service_id: 1

# DRS runs on every DMC node, so [drs] holds lpdmc1p and lpdmc2p and each DMC
# must address its own DRS. service_ips.drs is groups['drs'][0], which pointed
# DMC2 at DMC1's DRS. Use this node's inventory ansible_host when it runs DRS
# itself, and only fall back to the first [drs] host otherwise.
dmc_drs_host: >-
  {{
    dmc_node_ip
    if inventory_hostname in (groups['drs'] | default([]))
    else (
      hostvars[groups['drs'][0]]['ansible_host']
      if (groups['drs'] | default([])) | length > 0
      else ((service_ips | default({})).drs | default('localhost', true))
    )
  }}
dmc_drs_port: "{{ service_ports.drs_http | default(9292) }}"

dmc_elasticsearch_host: "{{ service_ips.elasticsearch | default('localhost') }}"
dmc_elasticsearch_port: "{{ service_ports.elasticsearch | default(9200) }}"
dmc_elasticsearch_username: "{{ (dmc.elasticsearch.username | default('elastic')) if (dmc is defined and dmc.elasticsearch is defined) else 'elastic' }}"
dmc_elasticsearch_password: "{{ (dmc.elasticsearch.password | default('elastic')) if (dmc is defined and dmc.elasticsearch is defined) else 'elastic' }}"

# Search engine endpoint for rest-api.properties.
# Use stack_type: elk -> Elasticsearch, opensearch -> OpenSearch.
dmc_search_engine_host: >-
  {{
    (
      (stack_type | default('elk')) == 'opensearch'
    )
    | ternary((service_ips.opensearch | default('localhost', true)), (service_ips.elasticsearch | default('localhost', true)))
    | default('localhost', true)
  }}
dmc_search_engine_port: >-
  {{
    (
      (stack_type | default('elk')) == 'opensearch'
    )
    | ternary((service_ports.opensearch_http | default(9200)), (service_ports.elasticsearch | default(9200)))
  }}

# System configuration
dmc_country: "{{ customer_config.country | default('Germany') }}"
dmc_timezone: "{{ (dmc.timezone | default('GMT+1')) if (dmc is defined) else 'GMT+1' }}"
dmc_hugepages: "{{ (dmc.hugepages | default(5120)) if (dmc is defined) else 5120 }}"  # 5GB in 2MB pages
dmc_memlock: "{{ (dmc.memlock | default(10240000)) if (dmc is defined) else 10240000 }}"

# Logging configuration
dmc_logging_level: "{{ (dmc.logging.level | default('INFO')) if (dmc is defined and dmc.logging is defined) else 'INFO' }}"
dmc_logging_file: "/var/opt/dmc/{{ dmc_version }}/log/dmc.log"
dmc_logging_max_size: "{{ (dmc.logging.max_size | default('100MB')) if (dmc is defined and dmc.logging is defined) else '100MB' }}"
dmc_logging_max_files: "{{ (dmc.logging.max_files | default(10)) if (dmc is defined and dmc.logging is defined) else 10 }}"

# Package configuration
# NOTE: package patterns are centralized in `sicap-ide/config/packages.yaml` under `package_globs`.

# iOS Enabler configuration
dmc_ios_enabler:
  enabled: "{{ ios_enabler.enabled | default(false) }}"
  mmg_ws_url: "http://{{ ios_enabler.mmg_host }}:{{ ios_enabler.mmg_port }}/soapserver/soapserver"
  mmg_username: "{{ ios_enabler.mmg_username }}"
  mmg_password: "{{ ios_enabler.mmg_password }}"
  node_id: "{{ ios_enabler.node_id_dmc1 if dmc_node_id == 1 else ios_enabler.node_id_dmc2 }}"
  # Dynamic local IP based on DMC group membership
  frontend_host: "{{ hostvars[groups['dmc1'][0]]['ansible_host'] if inventory_hostname in groups['dmc1'] else hostvars[groups['dmc2'][0]]['ansible_host'] }}"
  api_provider_host: "{{ hostvars[groups['dmc1'][0]]['ansible_host'] if inventory_hostname in groups['dmc1'] else hostvars[groups['dmc2'][0]]['ansible_host'] }}"
  connector_base_url: "https://{{ ios_enabler.public_ip }}:{{ ios_enabler.connector_port }}/dmiosenabler/dmiosenabler"
  enrollment_retries: 1
  enrollment_timeout: 259200
  scep_payload_url: "http://{{ ios_enabler.public_ip }}:{{ ios_enabler.scep_port }}/sicap-ca/scep"
  scep_challenge_url: "http://{{ hostvars[groups['dmc1'][0]]['ansible_host'] if inventory_hostname in groups['dmc1'] else hostvars[groups['dmc2'][0]]['ansible_host'] }}:{{ ios_enabler.challenge_port }}/sicap-ca/challenge"
  session_timeout: 259200
  session_polling_timeout: 259200
  session_agent_timeout: 259200
  session_query_expire_timeout: 259200
  ios_header_regexp: "MDM,Mac OS(.)*OS 4,OS 4(.)*Mac OS,iPhone OS 4_,Mac OS(.)*OS 5,OS 5(.)*Mac OS,iPhone OS 5_,Mac OS(.)*OS 6,OS 6(.)*Mac OS,iPhone OS 6_,Mac OS(.)*OS 7,OS 7(.)*Mac OS,iPhone OS 7_,Mac OS(.)*OS 8,OS 8(.)*Mac OS,iPhone OS 8_,Mac OS(.)*OS 9,OS 9(.)*Mac OS,iPhone OS 9_,Mac OS(.)*OS 10,OS 10(.)*Mac OS,iPhone OS 10_,Mac OS(.)*OS 11,OS 11(.)*Mac OS,iPhone OS 11_,Mac OS(.)*OS 12,OS 12(.)*Mac OS,iPhone OS 12_,Mac OS(.)*OS 13,OS 13(.)*Mac OS,iPhone OS 13_, Mac OS(.)*OS 14,OS 14(.)*Mac OS,iPhone OS 14_,Mac OS(.)*OS 15,OS 15(.)*Mac OS,iPhone OS 15_"
  ios16_header_regexp: "Mac OS(.)*OS 16,OS 16(.)*Mac OS,iPhone OS 16_,MDM"
  ios17_header_regexp: "Mac OS(.)*OS 17,OS 17(.)*Mac OS,iPhone OS 17_,MDM"

# System limits configuration
dmc_limits:
  nofile:
    soft: 4096
    hard: 65536
  nproc:
    soft: 4096
    hard: 65536
  memlock:
    soft: 10240000
    hard: 10240000
