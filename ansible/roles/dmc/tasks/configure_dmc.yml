    path: "{{ dmc_conf_dir }}/cm-DMCProtocolMMG.properties"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
    backup: yes
  loop:
    - regexp: '(?m)^[ \t]*mmg\.serviceUrl\.default[ \t]*=.*$'
      replace: 'mmg.serviceUrl.default=http://{{ dmc_mmsoap_host }}:{{ dmc_mmsoap_port }}/soapserver/soapserver'
