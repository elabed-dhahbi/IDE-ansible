      mmg.username.default={{ dmc_mmsoap_username }}
      mmg.password.default={{ dmc_mmsoap_password }}
      mmg.serviceId.default={{ dmc_mmsoap_service_id }}
    dest: "{{ dmc_conf_dir }}/cm-DMCProtocolMMG.properties"
    owner: "{{ dmc_user }}"
    group: "{{ dmc_group }}"
    mode: '0644'
    force: no
    backup: yes
  become: yes
  tags: [dmc, config, properties]

- name: Check cm-DMCProtocolMMG.properties exists (do not overwrite vendor file)
  stat:
    path: "{{ dmc_conf_dir }}/cm-DMCProtocolMMG.properties"
  register: dmcprotocol_mmg_props_stat
  become: yes
  tags: [dmc, config, properties]

- name: Fail if cm-DMCProtocolMMG.properties is missing
  fail:
    msg: "Missing {{ dmc_conf_dir }}/cm-DMCProtocolMMG.properties. This file should be provided by the DMC package; refusing to generate a truncated version."
  when: not dmcprotocol_mmg_props_stat.stat.exists
  tags: [dmc, config, properties]

- name: Fail if inventory has no MMSOAP host ([mmsoap] group)
  fail:
    msg: >-
      MMSOAP host is required for cm-DMCProtocolMMG.properties. Define `[mmsoap]` in your inventory
      (e.g. inventories/TT/hosts.ini) with `ansible_host=<MMSOAP_IP>`.
  when: groups['mmsoap'] is not defined or (groups['mmsoap'] | length) == 0
  tags: [dmc, config, properties]

- name: Fail if MMSOAP ansible_host is empty
  fail:
    msg: >-
      Host {{ groups['mmsoap'][0] }} is in [mmsoap] but has no ansible_host. Set ansible_host in inventory.
  when: >-
    groups['mmsoap'] is defined and (groups['mmsoap'] | length) > 0
    and (
      (hostvars[groups['mmsoap'][0]]['ansible_host'] | default('') | string | trim | length) == 0
    )
  tags: [dmc, config, properties]

- name: Update cm-DMCProtocolMMG.properties keys (replace existing lines)
