    backup: yes
  become: yes
  tags: [dmc, config, properties]

- name: Find DMC .properties files under conf dir
  find:
    paths: "{{ dmc_conf_dir }}"
    patterns: "*.properties"
    file_type: file
  register: dmc_properties_files
  become: yes
  tags: [dmc, config, properties]

- name: Normalize all DMC .properties line endings (strip CRLF)
  replace:
    path: "{{ item.path }}"
    regexp: '\r'
    replace: ''
    backup: yes
  loop: "{{ dmc_properties_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  become: yes
  when: (dmc_properties_files.matched | default(0)) | int > 0
  tags: [dmc, config, properties]

