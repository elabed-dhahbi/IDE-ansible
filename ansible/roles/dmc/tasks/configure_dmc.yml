---
# DMC Configuration Tasks

# Let RPM handle dmcenv configuration - only modify what's absolutely necessary

# Let RPM handle standalone.conf configuration

- name: Update standalone-full.xml HTTP port
  shell: |
    sed -i 's/\${jboss.http.port:8080}/\${jboss.http.port:50400}/' {{ dmc_conf_dir }}/standalone-full.xml
  become: yes
  tags: [dmc, config, standalone]

- name: Update all database URLs in standalone-full.xml
  shell: |
    # Use a simple regex to replace all JDBC URLs with the correct host, port, and database
    sed -i -E 's#jdbc:postgresql://[a-zA-Z0-9._-]+:[0-9]+/[a-zA-Z0-9._-]+#jdbc:postgresql://{{ dmc_database_host }}:{{ dmc_database_port }}/{{ dmc_database_name }}#g' {{ dmc_conf_dir }}/standalone-full.xml
  become: yes
  tags: [dmc, config, database]

- name: Update database usernames in standalone-full.xml
  replace:
    path: "{{ dmc_conf_dir }}/standalone-full.xml"
    regexp: '<user-name>[^<]+</user-name>'
    replace: '<user-name>{{ dmc_database_user }}</user-name>'
  become: yes
  tags: [dmc, config, database]

- name: Update database passwords in standalone-full.xml
  replace:
    path: "{{ dmc_conf_dir }}/standalone-full.xml"
    regexp: '<password>[^<]+</password>'
    replace: '<password>{{ dmc_database_password }}</password>'
  become: yes
  tags: [dmc, config, database]

- name: Check current JAVA_HOME configuration in .profile.sicap
  shell: |
    grep "JAVA_HOME=" {{ dmc_home }}/.profile.sicap
  become: yes
  register: java_home_before
  tags: [dmc, config, debug]

- name: Display current JAVA_HOME configuration
  debug:
    msg: "Current JAVA_HOME lines: {{ java_home_before.stdout_lines }}"
  tags: [dmc, config, debug]

- name: Update JAVA_HOME in .profile.sicap
  lineinfile:
    path: "{{ dmc_home }}/.profile.sicap"
    regexp: '^export JAVA_HOME='
    line: 'export JAVA_HOME=${JAVA_HOME:-{{ dmc_sicap_jdk_home }}}'
    backup: yes
  become: yes
  tags: [dmc, config, java]

- name: Verify JAVA_HOME was updated correctly
  shell: |
    grep "JAVA_HOME=" {{ dmc_home }}/.profile.sicap
  become: yes
  register: java_home_after
  tags: [dmc, config, debug]

- name: Display updated JAVA_HOME configuration
  debug:
    msg: "Updated JAVA_HOME lines: {{ java_home_after.stdout_lines }}"
  tags: [dmc, config, debug]

- name: Update DMC Java memory settings in dmcenv
  lineinfile:
    path: "{{ dmc_current_dir }}/bin/dmcenv"
    regexp: '^export JAVA_OPTS=.*'
    line: 'export JAVA_OPTS="-DLOG_BL_BASE=$LOG_BASE/DMC-BusinessLog -DLOG_TH_BASE=$LOG_BASE/DMC-TechnicalLog -DLOG_BL_FBLL_BASE=$LOG_BASE/DMC-BusinessLogLoader -Djmx.export.kpi.dir=/tmp -Djboss.server.log.dir=$LOG_BASE -Xms{{ dmc_java.xms }} -Xmx{{ dmc_java.xmx }} -XX:PermSize={{ dmc_java.perm_size }} -XX:MaxPermSize={{ dmc_java.max_perm_size }} -agentlib:jdwp=transport=dt_socket,address=8787,server=y,suspend=n -Dlog4j.configurationFile=/opt/dmc/current/conf/log4j2.xml -Djava.awt.headless=true -Dorg.jboss.resolver.warning=true -Dsun.rmi.dgc.client.gcInterval=3600000 -Dsun.rmi.dgc.server.gcInterval=3600000 -XX:+UseParNewGC -XX:+AggressiveOpts -XX:+DoEscapeAnalysis -XX:+UseLargePages -XX:+UseTLAB -XX:TLABSize=64k -Duser.timezone=GMT+1"'
    backup: yes
  become: yes
  tags: [dmc, config, java, memory]

- name: Verify dmcenv Java configuration
  shell: |
    grep "JAVA_OPTS=" {{ dmc_current_dir }}/bin/dmcenv
  become: yes
  register: dmcenv_java_config
  tags: [dmc, config, java, debug]

- name: Display dmcenv Java configuration
  debug:
    msg: "DMC dmcenv Java configuration: {{ dmcenv_java_config.stdout_lines }}"
  tags: [dmc, config, java, debug]

- name: Update DMC Java memory settings in standalone.conf
  lineinfile:
    path: "{{ dmc_current_dir }}/bin/standalone.conf"
    regexp: '^JAVA_OPTS=.*'
    line: 'JAVA_OPTS="-DLOG_BL_BASE=$LOG_BASE/DMC-BusinessLog -DLOG_TH_BASE=$LOG_BASE/DMC-TechnicalLog -DLOG_BL_FBLL_BASE=$LOG_BASE/DMC-BusinessLogLoader -Djmx.export.kpi.dir=/tmp -Djboss.server.log.dir=$LOG_BASE -Xms{{ dmc_java.xms }} -Xmx{{ dmc_java.xmx }} -XX:PermSize={{ dmc_java.perm_size }} -XX:MaxPermSize={{ dmc_java.max_perm_size }} -agentlib:jdwp=transport=dt_socket,address=8787,server=y,suspend=n -Dlog4j.configurationFile=/opt/dmc/current/conf/log4j2.xml -Djava.awt.headless=true -Dorg.jboss.resolver.warning=true -Dsun.rmi.dgc.client.gcInterval=3600000 -Dsun.rmi.dgc.server.gcInterval=3600000 -XX:+UseParNewGC -XX:+AggressiveOpts -XX:+DoEscapeAnalysis -XX:+UseLargePages -XX:+UseTLAB -XX:TLABSize=64k -Duser.timezone=GMT+1"'
    backup: yes
  become: yes
  tags: [dmc, config, java, memory, standalone]

- name: Verify standalone.conf Java configuration
  shell: |
    grep "JAVA_OPTS=" {{ dmc_current_dir }}/bin/standalone.conf
  become: yes
  register: standalone_java_config
  tags: [dmc, config, java, debug]

- name: Display standalone.conf Java configuration
  debug:
    msg: "DMC standalone.conf Java configuration: {{ standalone_java_config.stdout_lines }}"
  tags: [dmc, config, java, debug]

- name: Create DRB file directory
  file:
    path: "{{ dmc_drbfile_dir }}"
    state: directory
    owner: "{{ dmc_user }}"
    group: "{{ dmc_group }}"
    mode: '0755'
  become: yes
  tags: [dmc, config, directories]

- name: Verify DRB file directory creation
  stat:
    path: "{{ dmc_drbfile_dir }}"
  register: drbfile_dir_stat
  tags: [dmc, config, directories, debug]

- name: Display DRB file directory status
  debug:
    msg: "DRB file directory {{ dmc_drbfile_dir }} exists: {{ drbfile_dir_stat.stat.exists }}"
  tags: [dmc, config, directories, debug]

- name: Add Java 8 environment variables to .profile
  lineinfile:
    path: "{{ dmc_home }}/.profile"
    line: "export JAVA_HOME=/usr/j2se/current"
    create: yes
    backup: yes
  become: yes
  tags: [dmc, config, java]

- name: Add Java 8 PATH to .profile
  lineinfile:
    path: "{{ dmc_home }}/.profile"
    line: "export PATH=$JAVA_HOME/bin:$PATH"
    create: yes
    backup: yes
  become: yes
  tags: [dmc, config, java]

- name: Verify .profile Java configuration
  shell: |
    grep -E "(JAVA_HOME|PATH.*JAVA)" {{ dmc_home }}/.profile
  become: yes
  register: profile_java_config
  tags: [dmc, config, debug]

- name: Display .profile Java configuration
  debug:
    msg: "Java configuration in .profile: {{ profile_java_config.stdout_lines }}"
  tags: [dmc, config, debug]

- name: Check Java version after configuration
  shell: |
    source {{ dmc_home }}/.profile && java -version
  become_user: "{{ dmc_user }}"
  register: java_version_check
  tags: [dmc, config, debug]

- name: Display Java version check result
  debug:
    msg: "{{ java_version_check.stdout_lines }}"
  tags: [dmc, config, debug]

- name: Check DMC logs for startup errors
  shell: |
    tail -50 {{ dmc_logs_dir }}/dmc.log 2>/dev/null || echo "No dmc.log found"
  become_user: "{{ dmc_user }}"
  register: dmc_startup_logs
  tags: [dmc, config, debug]

- name: Display DMC startup logs
  debug:
    msg: "{{ dmc_startup_logs.stdout_lines }}"
  tags: [dmc, config, debug]

- name: Check if DMC process is running
  shell: |
    ps aux | grep dmc | grep -v grep || echo "No DMC processes found"
  become_user: "{{ dmc_user }}"
  register: dmc_process_check
  tags: [dmc, config, debug]

- name: Display DMC process check result
  debug:
    msg: "{{ dmc_process_check.stdout_lines }}"
  tags: [dmc, config, debug]

- name: Find DMC license file in offline directory
  find:
    paths: "{{ paths.offline_dir }}"
    patterns: "licence_DMC*"
  register: dmc_license_files
  become: yes
  tags: [dmc, config, license]

- name: Display DMC license files found
  debug:
    msg: "DMC license files found: {{ dmc_license_files.files | map(attribute='path') | list }}"
  tags: [dmc, config, license]

- name: Copy DMC license file to conf directory
  copy:
    src: "{{ item.path }}"
    dest: "{{ dmc_conf_dir }}/{{ item.path | basename }}"
    owner: "{{ dmc_user }}"
    group: "{{ dmc_group }}"
    mode: '0644'
    remote_src: yes
  loop: "{{ dmc_license_files.files }}"
  become: yes
  when: dmc_license_files.files | length > 0
  tags: [dmc, config, license]

- name: Create symbolic link for license file
  file:
    src: "{{ dmc_conf_dir }}/{{ dmc_license_files.files[0].path | basename }}"
    dest: "{{ dmc_conf_dir }}/license"
    state: link
    force: yes
  become: yes
  when: dmc_license_files.files | length > 0
  tags: [dmc, config, license]

- name: Display error if no DMC license found
  debug:
    msg: "WARNING: No DMC license files found in offline directory!"
  when: dmc_license_files.files | length == 0
  tags: [dmc, config, license]

- name: Update license file path in cm-Licensing.properties
  shell: |
    sed -i 's|^license\.file\.path.*|license.file.path = {{ dmc_conf_dir }}/license|' {{ dmc_conf_dir }}/cm-Licensing.properties
  become: yes
  tags: [dmc, config, properties]

- name: Update DMC node ID in cm-sicap-dmc-platform.properties
  lineinfile:
    path: "{{ dmc_conf_dir }}/cm-sicap-dmc-platform.properties"
    regexp: '^dmc\.node\.id\s*='
    line: 'dmc.node.id = {{ dmc_node_id }}'
    backup: yes
  become: yes
  tags: [dmc, config, properties]

- name: Check cm-DRBProvider.properties exists (do not overwrite vendor file)
  stat:
    path: "{{ dmc_conf_dir }}/cm-DRBProvider.properties"
  register: drbprovider_props_stat
  become: yes
  tags: [dmc, config, properties]

- name: Fail if cm-DRBProvider.properties is missing
  fail:
    msg: "Missing {{ dmc_conf_dir }}/cm-DRBProvider.properties. This file should be provided by the DMC package; refusing to generate a truncated version."
  when: not drbprovider_props_stat.stat.exists
  tags: [dmc, config, properties]

- name: Ensure DRBProvider rootPart key exists (do not append)
  shell: >
    grep -qE '^[[:space:]]*dmc\.DRBProvider\.deviceresources\.helpURL\.rootPart[[:space:]]*='
    {{ dmc_conf_dir }}/cm-DRBProvider.properties
  become: yes
  changed_when: false
  tags: [dmc, config, properties]

- name: Update DRBProvider rootPart URL (replace existing line)
  replace:
    path: "{{ dmc_conf_dir }}/cm-DRBProvider.properties"
    regexp: '(?m)^[ \t]*dmc\.DRBProvider\.deviceresources\.helpURL\.rootPart[ \t]*=.*$'
    replace: "dmc.DRBProvider.deviceresources.helpURL.rootPart=http://{{ dmc_node_ip }}:{{ dmc_http_port }}"
    backup: yes
  become: yes
  tags: [dmc, config, properties]

- name: Verify DRBProvider rootPart URL updated
  shell: >
    grep -qF
    "dmc.DRBProvider.deviceresources.helpURL.rootPart=http://{{ dmc_node_ip }}:{{ dmc_http_port }}"
    {{ dmc_conf_dir }}/cm-DRBProvider.properties
  become: yes
  changed_when: false
  tags: [dmc, config, properties]

- name: Ensure DRBProvider checkVersion key exists (do not append)
  shell: >
    grep -qE '^[[:space:]]*dmc\.DRBProvider\.DRBUpdate\.DeviceResources\.checkVersion\.url[[:space:]]*='
    {{ dmc_conf_dir }}/cm-DRBProvider.properties
  become: yes
  changed_when: false
  tags: [dmc, config, properties]

- name: Update DRBProvider checkVersion URL (replace existing line)
  replace:
    path: "{{ dmc_conf_dir }}/cm-DRBProvider.properties"
    regexp: '(?m)^[ \t]*dmc\.DRBProvider\.DRBUpdate\.DeviceResources\.checkVersion\.url[ \t]*=.*$'
    replace: "dmc.DRBProvider.DRBUpdate.DeviceResources.checkVersion.url=http://{{ dmc_node_ip }}:{{ dmc_http_port }}/sicap-dmc-deviceresources/versionstatus"
    backup: yes
  become: yes
  tags: [dmc, config, properties]

- name: Verify DRBProvider checkVersion URL updated
  shell: >
    grep -qF
    "dmc.DRBProvider.DRBUpdate.DeviceResources.checkVersion.url=http://{{ dmc_node_ip }}:{{ dmc_http_port }}/sicap-dmc-deviceresources/versionstatus"
    {{ dmc_conf_dir }}/cm-DRBProvider.properties
  become: yes
  changed_when: false
  tags: [dmc, config, properties]

- name: Ensure DRBProvider rollbackVersion key exists (do not append)
  shell: >
    grep -qE '^[[:space:]]*dmc\.DRBProvider\.DRBUpdate\.DeviceResources\.rollbackVersion\.url[[:space:]]*='
    {{ dmc_conf_dir }}/cm-DRBProvider.properties
  become: yes
  changed_when: false
  tags: [dmc, config, properties]

- name: Update DRBProvider rollbackVersion URL (replace existing line)
  replace:
    path: "{{ dmc_conf_dir }}/cm-DRBProvider.properties"
    regexp: '(?m)^[ \t]*dmc\.DRBProvider\.DRBUpdate\.DeviceResources\.rollbackVersion\.url[ \t]*=.*$'
    replace: "dmc.DRBProvider.DRBUpdate.DeviceResources.rollbackVersion.url=http://{{ dmc_node_ip }}:{{ dmc_http_port }}/sicap-dmc-deviceresources/rollback"
    backup: yes
  become: yes
  tags: [dmc, config, properties]

- name: Verify DRBProvider rollbackVersion URL updated
  shell: >
    grep -qF
    "dmc.DRBProvider.DRBUpdate.DeviceResources.rollbackVersion.url=http://{{ dmc_node_ip }}:{{ dmc_http_port }}/sicap-dmc-deviceresources/rollback"
    {{ dmc_conf_dir }}/cm-DRBProvider.properties
  become: yes
  changed_when: false
  tags: [dmc, config, properties]

- name: Remove duplicate DRBProvider URL keys (keep first occurrence)
  shell: |
    {{ ansible_python_interpreter }} - <<'PY'
    from __future__ import annotations

    path = "{{ dmc_conf_dir }}/cm-DRBProvider.properties"
    keys = [
      "dmc.DRBProvider.deviceresources.helpURL.rootPart",
      "dmc.DRBProvider.DRBUpdate.DeviceResources.checkVersion.url",
      "dmc.DRBProvider.DRBUpdate.DeviceResources.rollbackVersion.url",
    ]

    with open(path, "r", encoding="utf-8", errors="surrogateescape") as f:
      lines = f.readlines()

    seen = {k: False for k in keys}
    out: list[str] = []
    for line in lines:
      stripped = line.lstrip()
      matched_key = next((k for k in keys if stripped.startswith(k) and "=" in stripped), None)
      if matched_key is None:
        out.append(line)
        continue
      if seen[matched_key]:
        continue
      seen[matched_key] = True
      out.append(line)

    if out != lines:
      with open(path, "w", encoding="utf-8", errors="surrogateescape") as f:
        f.writelines(out)
    PY
  become: yes
  tags: [dmc, config, properties]

- name: Create cm-ADDBackEnd.properties
  copy:
    content: |
      dmc.addbe.businessLogEnabled=true
      dmc.addbe.defaultSource.ADD_FE1=HLR
      dmc.addbe.defaultSource.ADD_FE2=CHECK_IMEI
      dmc.addbe.defaultProvider.ADD_FE1={{ dmc_provider_name }}
      dmc.addbe.defaultProvider.ADD_FE2={{ customer_config.name | default('PROVIDER_NAME') }}
    dest: "{{ dmc_conf_dir }}/cm-ADDBackEnd.properties"
    owner: "{{ dmc_user }}"
    group: "{{ dmc_group }}"
    mode: '0644'
    force: no
    backup: yes
  become: yes
  tags: [dmc, config, properties]

- name: Check cm-ADDBackEnd.properties exists (do not overwrite vendor file)
  stat:
    path: "{{ dmc_conf_dir }}/cm-ADDBackEnd.properties"
  register: addbackend_props_stat
  become: yes
  tags: [dmc, config, properties]

- name: Fail if cm-ADDBackEnd.properties is missing
  fail:
    msg: "Missing {{ dmc_conf_dir }}/cm-ADDBackEnd.properties. This file should be provided by the DMC package; refusing to generate a truncated version."
  when: not addbackend_props_stat.stat.exists
  tags: [dmc, config, properties]

- name: Update cm-ADDBackEnd.properties keys (replace existing lines)
  replace:
    path: "{{ dmc_conf_dir }}/cm-ADDBackEnd.properties"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
    backup: yes
  loop:
    - regexp: '(?m)^[ \t]*dmc\.addbe\.businessLogEnabled[ \t]*=.*$'
      replace: 'dmc.addbe.businessLogEnabled=true'
    - regexp: '(?m)^[ \t]*dmc\.addbe\.defaultSource\.ADD_FE1[ \t]*=.*$'
      replace: 'dmc.addbe.defaultSource.ADD_FE1=HLR'
    - regexp: '(?m)^[ \t]*dmc\.addbe\.defaultSource\.ADD_FE2[ \t]*=.*$'
      replace: 'dmc.addbe.defaultSource.ADD_FE2=CHECK_IMEI'
    - regexp: '(?m)^[ \t]*dmc\.addbe\.defaultProvider\.ADD_FE1[ \t]*=.*$'
      replace: 'dmc.addbe.defaultProvider.ADD_FE1={{ dmc_provider_name }}'
    - regexp: '(?m)^[ \t]*dmc\.addbe\.defaultProvider\.ADD_FE2[ \t]*=.*$'
      replace: 'dmc.addbe.defaultProvider.ADD_FE2=[PROVIDER_NAME]'
  become: yes
  tags: [dmc, config, properties]

- name: Verify cm-ADDBackEnd.properties keys updated
  shell: |
    set -e
    grep -qF "dmc.addbe.businessLogEnabled=true" "{{ dmc_conf_dir }}/cm-ADDBackEnd.properties"
    grep -qF "dmc.addbe.defaultSource.ADD_FE1=HLR" "{{ dmc_conf_dir }}/cm-ADDBackEnd.properties"
    grep -qF "dmc.addbe.defaultSource.ADD_FE2=CHECK_IMEI" "{{ dmc_conf_dir }}/cm-ADDBackEnd.properties"
    grep -qF "dmc.addbe.defaultProvider.ADD_FE1={{ dmc_provider_name }}" "{{ dmc_conf_dir }}/cm-ADDBackEnd.properties"
    grep -qF "dmc.addbe.defaultProvider.ADD_FE2=[PROVIDER_NAME]" "{{ dmc_conf_dir }}/cm-ADDBackEnd.properties"
  become: yes
  changed_when: false
  tags: [dmc, config, properties]

- name: Create cm-DeviceDefinitions.properties
  copy:
    content: |
      dmc.DeviceDefinitions.DRBUpdate.ReloadProcess.performFKValidation=false
      dmc.DeviceDefinitions.DRBUpdate.ReloadProcess.permitIdempotentReloads=true
      dmc.DeviceDefinitions.DRBUpdate.ReloadProcess.writeSQLStatementsFile=3
      dmc.DeviceDefinitions.device.IMEI.checkCRC=NEVER
      dmc.DeviceDefinitions.device.IMEI.acceptNoCRC=true
    dest: "{{ dmc_conf_dir }}/cm-DeviceDefinitions.properties"
    owner: "{{ dmc_user }}"
    group: "{{ dmc_group }}"
    mode: '0644'
    force: no
    backup: yes
  become: yes
  tags: [dmc, config, properties]

- name: Check cm-DeviceDefinitions.properties exists (do not overwrite vendor file)
  stat:
    path: "{{ dmc_conf_dir }}/cm-DeviceDefinitions.properties"
  register: devdefs_props_stat
  become: yes
  tags: [dmc, config, properties]

- name: Fail if cm-DeviceDefinitions.properties is missing
  fail:
    msg: "Missing {{ dmc_conf_dir }}/cm-DeviceDefinitions.properties. This file should be provided by the DMC package; refusing to generate a truncated version."
  when: not devdefs_props_stat.stat.exists
  tags: [dmc, config, properties]

- name: Update cm-DeviceDefinitions.properties keys (replace existing lines)
  replace:
    path: "{{ dmc_conf_dir }}/cm-DeviceDefinitions.properties"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
    backup: yes
  loop:
    - regexp: '(?m)^[ \t]*dmc\.DeviceDefinitions\.DRBUpdate\.ReloadProcess\.performFKValidation[ \t]*=.*$'
      replace: 'dmc.DeviceDefinitions.DRBUpdate.ReloadProcess.performFKValidation=false'
    - regexp: '(?m)^[ \t]*dmc\.DeviceDefinitions\.DRBUpdate\.ReloadProcess\.permitIdempotentReloads[ \t]*=.*$'
      replace: 'dmc.DeviceDefinitions.DRBUpdate.ReloadProcess.permitIdempotentReloads=true'
    - regexp: '(?m)^[ \t]*dmc\.DeviceDefinitions\.DRBUpdate\.ReloadProcess\.writeSQLStatementsFile[ \t]*=.*$'
      replace: 'dmc.DeviceDefinitions.DRBUpdate.ReloadProcess.writeSQLStatementsFile=3'
    - regexp: '(?m)^[ \t]*dmc\.DeviceDefinitions\.device\.IMEI\.checkCRC[ \t]*=.*$'
      replace: 'dmc.DeviceDefinitions.device.IMEI.checkCRC=NEVER'
    - regexp: '(?m)^[ \t]*dmc\.DeviceDefinitions\.device\.IMEI\.acceptNoCRC[ \t]*=.*$'
      replace: 'dmc.DeviceDefinitions.device.IMEI.acceptNoCRC=true'
  become: yes
  tags: [dmc, config, properties]

- name: Verify cm-DeviceDefinitions.properties keys updated
  shell: |
    set -e
    grep -qF "dmc.DeviceDefinitions.DRBUpdate.ReloadProcess.performFKValidation=false" "{{ dmc_conf_dir }}/cm-DeviceDefinitions.properties"
    grep -qF "dmc.DeviceDefinitions.DRBUpdate.ReloadProcess.permitIdempotentReloads=true" "{{ dmc_conf_dir }}/cm-DeviceDefinitions.properties"
    grep -qF "dmc.DeviceDefinitions.DRBUpdate.ReloadProcess.writeSQLStatementsFile=3" "{{ dmc_conf_dir }}/cm-DeviceDefinitions.properties"
    grep -qF "dmc.DeviceDefinitions.device.IMEI.checkCRC=NEVER" "{{ dmc_conf_dir }}/cm-DeviceDefinitions.properties"
    grep -qF "dmc.DeviceDefinitions.device.IMEI.acceptNoCRC=true" "{{ dmc_conf_dir }}/cm-DeviceDefinitions.properties"
  become: yes
  changed_when: false
  tags: [dmc, config, properties]

- name: Create cm-sicap-enabler-gateway.properties
  copy:
    content: |
      SMS.active=true
      SMS.trigger.active=true
      IOS.active=true
      IOS.trigger.active=true
    dest: "{{ dmc_conf_dir }}/cm-sicap-enabler-gateway.properties"
    owner: "{{ dmc_user }}"
    group: "{{ dmc_group }}"
    mode: '0644'
    force: no
    backup: yes
  become: yes
  tags: [dmc, config, properties]

- name: Check cm-sicap-enabler-gateway.properties exists (do not overwrite vendor file)
  stat:
    path: "{{ dmc_conf_dir }}/cm-sicap-enabler-gateway.properties"
  register: enabler_gw_props_stat
  become: yes
  tags: [dmc, config, properties]

- name: Fail if cm-sicap-enabler-gateway.properties is missing
  fail:
    msg: "Missing {{ dmc_conf_dir }}/cm-sicap-enabler-gateway.properties. This file should be provided by the DMC package; refusing to generate a truncated version."
  when: not enabler_gw_props_stat.stat.exists
  tags: [dmc, config, properties]

- name: Update cm-sicap-enabler-gateway.properties keys (replace existing lines)
  replace:
    path: "{{ dmc_conf_dir }}/cm-sicap-enabler-gateway.properties"
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
    backup: yes
  loop:
    - regexp: '(?m)^[ \t]*SMS\.active[ \t]*=.*$'
      replace: 'SMS.active=true'
    - regexp: '(?m)^[ \t]*SMS\.trigger\.active[ \t]*=.*$'
      replace: 'SMS.trigger.active=true'
    - regexp: '(?m)^[ \t]*IOS\.active[ \t]*=.*$'
      replace: 'IOS.active=true'
    - regexp: '(?m)^[ \t]*IOS\.trigger\.active[ \t]*=.*$'
      replace: 'IOS.trigger.active=true'
    - regexp: '(?m)^[ \t]*SICAP_DM_AGENT\.jndi\.provider_url[ \t]*=.*$'
