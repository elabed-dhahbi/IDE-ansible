    grep -qF "mmg.dmcNodeId={{ dmc_node_id }}" "{{ dmc_conf_dir }}/cm-DMCProtocolMMG.properties"
    grep -qF "mmg.username.default={{ dmc_mmsoap_username }}" "{{ dmc_conf_dir }}/cm-DMCProtocolMMG.properties"
    grep -qF "mmg.password.default={{ dmc_mmsoap_password }}" "{{ dmc_conf_dir }}/cm-DMCProtocolMMG.properties"
