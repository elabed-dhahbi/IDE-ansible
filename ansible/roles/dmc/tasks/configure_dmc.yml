    grep -qF "IOS.active=true" "{{ dmc_conf_dir }}/cm-sicap-enabler-gateway.properties"
    grep -qF "IOS.trigger.active=true" "{{ dmc_conf_dir }}/cm-sicap-enabler-gateway.properties"
