    cp "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL.sql" "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    {% if not use_tablespace_data or not use_tablespace_index or not use_tablespace_lob %}
    sed -i 's/TABLESPACE[[:space:]]*:tablespace_def_data[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*:tablespace_def_index[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*:tablespace_oth_data[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*:tablespace_oth_index[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*:tablespace_def_lob[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*{{ dmc_database_tablespace_data }}[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*{{ dmc_database_tablespace_index }}[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*{{ dmc_database_tablespace_lob }}[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*default[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*default;//g' "/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql"
    {% endif %}
  become: yes
  tags: [dmc, database, qrtz]

- name: Install DMC QRTZ scripts
  shell: |
    CMD="PGPASSWORD=\"{{ dmc_database_password }}\" {{ psql_binary }} -U \"{{ dmc_database_user }}\" -d \"{{ dmc_database_name }}\" -h \"{{ dmc_database_host }}\" -p \"{{ dmc_database_port }}\" -f \"/tmp/db/dmc/install/DMC4_install_qrtz_PostgreSQL_processed.sql\""
    {% if use_tablespace_data %}
    CMD="$CMD -v tablespace_def_data=\"{{ dmc_database_tablespace_data }}\" -v tablespace_oth_data=\"{{ dmc_database_tablespace_data }}\""
    {% endif %}
    {% if use_tablespace_lob %}
    CMD="$CMD -v tablespace_def_lob=\"{{ dmc_database_tablespace_lob }}\""
    {% endif %}
    {% if use_tablespace_index %}
    CMD="$CMD -v tablespace_def_index=\"{{ dmc_database_tablespace_index }}\" -v tablespace_oth_index=\"{{ dmc_database_tablespace_index }}\""
    {% endif %}
    eval $CMD
  become: yes
  register: qrtz_result
  failed_when: "'ERROR:' in qrtz_result.stderr and 'already exists' not in qrtz_result.stderr and 'does not exist' not in qrtz_result.stderr"
  changed_when: qrtz_result.rc == 0
  tags: [dmc, database, qrtz]

- name: Pre-process DML script to handle missing or default tablespaces
