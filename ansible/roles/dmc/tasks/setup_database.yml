- name: Pre-process migration script to handle missing or default tablespaces
  shell: |
    cp "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL.sql" "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
    {% if not use_tablespace_data or not use_tablespace_index or not use_tablespace_lob %}
    sed -i 's/TABLESPACE[[:space:]]*:tablespace_def_data[[:space:]]*//g' "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*:tablespace_def_index[[:space:]]*//g' "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*:tablespace_oth_data[[:space:]]*//g' "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*:tablespace_oth_index[[:space:]]*//g' "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*:tablespace_def_lob[[:space:]]*//g' "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*{{ dmc_database_tablespace_data }}[[:space:]]*//g' "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*{{ dmc_database_tablespace_index }}[[:space:]]*//g' "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*{{ dmc_database_tablespace_lob }}[[:space:]]*//g' "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*default[[:space:]]*//g' "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*default;//g' "/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql"
