- name: Install DMC migration scripts
  shell: |
    CMD="PGPASSWORD=\"{{ dmc_database_password }}\" {{ psql_binary }} -U \"{{ dmc_database_user }}\" -d \"{{ dmc_database_name }}\" -h \"{{ dmc_database_host }}\" -p \"{{ dmc_database_port }}\" -f \"/tmp/db/dmc/migration/DMC4.5.15_to_DMC4.5.16_migration_Roadmap_IPV6_PostgreSQL_processed.sql\""
    {% if use_tablespace_data %}
    CMD="$CMD -v tablespace_def_data=\"{{ dmc_database_tablespace_data }}\" -v tablespace_oth_data=\"{{ dmc_database_tablespace_data }}\""
    {% endif %}
    {% if use_tablespace_lob %}
    CMD="$CMD -v tablespace_def_lob=\"{{ dmc_database_tablespace_lob }}\""
    {% endif %}
    {% if use_tablespace_index %}
    CMD="$CMD -v tablespace_def_index=\"{{ dmc_database_tablespace_index }}\" -v tablespace_oth_index=\"{{ dmc_database_tablespace_index }}\""
    {% endif %}
    eval $CMD
  become: yes
  register: migration_result
  failed_when: "'ERROR:' in migration_result.stderr and 'already exists' not in migration_result.stderr and 'does not exist' not in migration_result.stderr"
  changed_when: migration_result.rc == 0
  tags: [dmc, database, migration]

- name: Get provider ID from database
  shell: |
    PGPASSWORD="{{ dmc_database_password }}" {{ psql_binary }} -U "{{ dmc_database_user }}" -d "{{ dmc_database_name }}" -h "{{ dmc_database_host }}" -p "{{ dmc_database_port }}" \
      -t -c "SELECT id FROM eu_provider WHERE name = '{{ dmc_provider_name }}';"
  register: provider_id_result
  become: yes
  failed_when: false
  changed_when: false
  tags: [dmc, database, provider]

- name: Set provider ID from database result
  set_fact:
    actual_provider_id: "{{ provider_id_result.stdout.strip() if (provider_id_result.rc == 0 and provider_id_result.stdout.strip()) else dmc_provider_id }}"
  tags: [dmc, database, provider]

- name: Display provider ID
  debug:
    msg: "Provider ID from database: {{ actual_provider_id }}"
  tags: [dmc, database, provider]

- name: Update cm-EndUser.properties with actual provider ID
  lineinfile:
    path: "{{ dmc_conf_dir }}/cm-EndUser.properties"
    regexp: 'dmc\.core\.enduser\.mobilehistory\.size\.provider\.\d+'
    line: 'dmc.core.enduser.mobilehistory.size.provider.{{ actual_provider_id }}=10'
    backup: yes
  become: yes
  tags: [dmc, database, provider]

- name: Update rest-api.properties with actual provider ID
  lineinfile:
    path: "{{ dmc_conf_dir }}/rest-api.properties"
    regexp: 'cache\.providers\.list = \d+'
    line: 'cache.providers.list = {{ actual_provider_id }}'
    backup: yes
  become: yes
  tags: [dmc, database, provider]

- name: Update cm-DMCDeployMode.properties with actual provider ID
  lineinfile:
    path: "{{ dmc_conf_dir }}/cm-DMCDeployMode.properties"
    regexp: 'deployedProviderId=\d+'
    line: 'deployedProviderId={{ actual_provider_id }}'
    backup: yes
  become: yes
  tags: [dmc, database, provider]

- name: Clean up temporary database files
  file:
    path: "/tmp/db/dmc"
    state: absent
  become: yes
  tags: [dmc, database, cleanup]
