    sed -i 's/TABLESPACE[[:space:]]*{{ dmc_database_tablespace_lob }}[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_dml_PostgreSQL_processed.sql"
    sed -i 's/TABLESPACE[[:space:]]*default[[:space:]]*//g' "/tmp/db/dmc/install/DMC4_install_dml_PostgreSQL_processed.sql"
