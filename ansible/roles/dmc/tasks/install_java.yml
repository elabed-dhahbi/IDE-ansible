---
# Java for DMC: use full JDK path from sicap_java (dmc_sicap_jdk_home), not /usr/j2se/current.

- name: Validate Java installation variables
  assert:
    that:
      - java_install_dir is defined
      - java_legacy_version is defined
      - paths.offline_dir is defined
      - dmc_sicap_jdk_home is defined
    fail_msg: "Required Java variables not defined. Check vars/release.yml, roles/dmc/defaults/main.yml, and config/values.yaml"
    success_msg: "All required Java variables are defined"
  tags: [dmc, java, install, validation, always]

- name: Resolve Java installation directory (single source of truth)
  set_fact:
    dmc_java_install_dir_resolved: "{{ sicap_java.install_dir | default(java_install_dir | default(system_paths.java_install_dir)) }}"
  tags: [dmc, java, install, validation, always]

- name: Ensure Java installation directory exists
  file:
    path: "{{ dmc_java_install_dir_resolved }}"
    state: directory
    mode: '0755'
  become: yes
  tags: [dmc, java, install, directories]

- name: Find Java package in offline directory
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "{{ sicap_java.offline_package | default(package_globs.jdk8_64bit | default('1_8_0_92-jdk.tar.gz')) }}"
      - "openlogic-openjdk-{{ java_full_version | default('8u412') }}*linux*.tar.gz"
    file_type: file
  register: java_package_files
  tags: [dmc, java, install, discovery]

- name: Validate Java package found
  assert:
    that:
      - java_package_files.files | length > 0
    fail_msg: "No Java package found in {{ paths.offline_dir }}. Ensure Java package is present."
    success_msg: "Found at least one Java archive under offline dir"
  tags: [dmc, java, install, validation]

- name: Check whether SICAP JDK java is usable
  command: "{{ dmc_sicap_jdk_home }}/bin/java -version"
  register: java_sicap_jdk_check
  changed_when: false
  failed_when: false
  become: yes
  tags: [dmc, java, install, validation]

- name: Determine whether SICAP JDK is already installed
  set_fact:
    java_sicap_jdk_ok: "{{ (java_sicap_jdk_check.rc | default(1)) == 0 }}"
  tags: [dmc, java, install, validation]

- name: Select Java archive (prefer sicap_java.offline_package)
  set_fact:
    dmc_java_archive_selected: >-
      {{
        (
          java_package_files.files
          | default([])
          | selectattr('path', 'search', '/' ~ (sicap_java.offline_package | default('1_8_0_92-jdk.tar.gz') | regex_escape()) ~ '$')
          | list
          | first
        )
        | default(
          (java_package_files.files | default([]) | sort(attribute='mtime', reverse=true) | first)
        )
      }}
  tags: [dmc, java, install, validation]

- name: Validate selected Java archive
  assert:
    that:
      - dmc_java_archive_selected is defined
      - dmc_java_archive_selected.path is defined
      - dmc_java_archive_selected.path | length > 0
  tags: [dmc, java, install, validation]

- name: Stage Java archive into install directory
  copy:
    src: "{{ dmc_java_archive_selected.path }}"
    dest: "{{ dmc_java_install_dir_resolved }}/{{ dmc_java_archive_selected.path | basename }}"
    remote_src: yes
    owner: root
    group: root
    mode: '0644'
  become: yes
  when: not java_sicap_jdk_ok
  tags: [dmc, java, install]

- name: Set staged Java archive path
  set_fact:
    dmc_java_archive_staged: "{{ dmc_java_install_dir_resolved }}/{{ dmc_java_archive_selected.path | basename }}"
  when: not java_sicap_jdk_ok
  tags: [dmc, java, install]

- name: Extract JDK package (only if SICAP JDK not usable)
  unarchive:
    src: "{{ dmc_java_archive_staged | default(dmc_java_archive_selected.path) }}"
    dest: "{{ dmc_java_install_dir_resolved }}"
    remote_src: yes
    owner: root
    group: root
    mode: '0755'
  become: yes
  when: not java_sicap_jdk_ok
  tags: [dmc, java, install]

- name: Validate SICAP JDK java binary exists
  stat:
    path: "{{ dmc_sicap_jdk_home }}/bin/java"
  register: dmc_sicap_java_stat
  become: yes
  failed_when: not (dmc_sicap_java_stat.stat.exists | default(false))
  tags: [dmc, java, verify, validation]

- name: Optional compatibility symlink current -> SICAP JDK
  file:
    src: "{{ dmc_sicap_jdk_home }}"
    dest: "{{ dmc_java_install_dir_resolved }}/current"
    state: link
    force: yes
  become: yes
  tags: [dmc, java, install, symlink]

- name: Set Java directory permissions
  file:
    path: "{{ dmc_java_install_dir_resolved }}"
    mode: '0755'
    recurse: yes
  become: yes
  tags: [dmc, java, permissions]

- name: Verify Java installation
  command: "{{ dmc_sicap_jdk_home }}/bin/java -version"
  register: java_version
  changed_when: false
  failed_when: java_version.rc != 0
  become: yes
  tags: [dmc, java, verify, validation]

- name: Display Java version
  debug:
    msg: "{{ java_version.stderr_lines | default(java_version.stdout_lines) }}"
  tags: [dmc, java, verify]

- name: Set JAVA_HOME environment variable in .profile.sicap
  lineinfile:
    path: "{{ dmc_home }}/.profile.sicap"
    regexp: '^export JAVA_HOME='
    line: 'export JAVA_HOME=${JAVA_HOME:-{{ dmc_sicap_jdk_home }}}'
    backup: yes
  become: yes
  tags: [dmc, java, environment, config]
