---
# Logstash OSS Plugin Installation Tasks

- name: Check if plugins are already installed
  shell: /usr/share/logstash/bin/logstash-plugin list | grep -E "(logstash-filter-rest|logstash-output-opensearch)"
  register: plugins_check
  failed_when: false
  become: yes
  tags: [logstash_oss, plugins, check]

- name: Find offline plugins packages
  find:
    paths: "{{ paths.offline_dir }}"
    patterns: "logstash-*.zip"
  register: offline_plugin_zips
  tags: [logstash_oss, plugins, find]

- name: Filter out source code zip files
  set_fact:
    plugin_zips: "{{ offline_plugin_zips.files | reject('match', '.*-main\\.zip$') | list }}"
  tags: [logstash_oss, plugins, filter]

- name: Debug - Show found plugin files
  debug:
    msg: "Found plugin files: {{ offline_plugin_zips.files | map(attribute='path') | list }}"
  tags: [logstash_oss, plugins, debug]

- name: Copy offline plugin zips to logstash directory
  copy:
    src: "{{ item.path }}"
    dest: "/usr/share/logstash/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ plugin_zips }}"
  become: yes
  when: plugin_zips | length > 0
  tags: [logstash_oss, plugins, copy]

- name: Install plugins from offline zips
  shell: |
    cd /usr/share/logstash
    export LS_JAVA_OPTS="-Xmx2g -Xms1g"
    for zip in logstash-*.zip; do
      if [ -f "$zip" ] && [[ "$zip" != *"-main.zip" ]]; then
        echo "Installing plugin from $zip"
        unzip -o "$zip"
        bin/logstash-plugin install file:///usr/share/logstash/$zip
      fi
    done
  become: yes
  when: plugin_zips | length > 0
  tags: [logstash_oss, plugins, install]

- name: Verify rest filter plugin installation
  shell: /usr/share/logstash/bin/logstash-plugin list | grep "logstash-filter-rest"
  register: rest_plugin_verify
  become: yes
  tags: [logstash_oss, plugins, verify]

- name: Install plugins directly from zip files if not found
  shell: |
    cd /usr/share/logstash
    export LS_JAVA_OPTS="-Xmx2g -Xms1g"
    for zip in logstash-*.zip; do
      if [ -f "$zip" ] && [[ "$zip" != *"-main.zip" ]]; then
        echo "Installing plugins from $zip"
        bin/logstash-plugin install file:///usr/share/logstash/$zip
      fi
    done
  become: yes
  when: plugins_check.rc != 0
  tags: [logstash_oss, plugins, install_direct]

- name: Check if opensearch plugin is in offline-plugins zip
  shell: |
    cd /usr/share/logstash
    if [ -f "logstash-offline-plugins-*.zip" ]; then
      unzip -l logstash-offline-plugins-*.zip 2>/dev/null | grep -q "logstash-output-opensearch" && echo "found" || echo "not_found"
    else
      echo "not_found"
    fi
  register: opensearch_in_offline_pack
  failed_when: false
  changed_when: false
  become: yes
  when: 
    - (plugins_check.rc != 0 or (plugins_check.stdout is defined and 'logstash-output-opensearch' not in plugins_check.stdout))
  tags: [logstash_oss, plugins, check_offline_pack]

- name: Find opensearch output plugin in offline directory
  find:
    paths: "{{ paths.offline_dir }}"
    patterns: "logstash-output-opensearch*.zip"
  register: opensearch_plugin_zips
  delegate_to: localhost
  tags: [logstash_oss, plugins, find_opensearch]

- name: Copy opensearch output plugin zip to logstash directory
  copy:
    src: "{{ item.path }}"
    dest: "/usr/share/logstash/{{ item.path | basename }}"
    mode: '0644'
  loop: "{{ opensearch_plugin_zips.files }}"
  become: yes
  when: 
    - (plugins_check.rc != 0 or "'logstash-output-opensearch' not in plugins_check.stdout")
    - opensearch_plugin_zips.files | length > 0
  tags: [logstash_oss, plugins, copy_opensearch]

- name: Install opensearch output plugin from offline zip if not found
  shell: |
    cd /usr/share/logstash
    export LS_JAVA_OPTS="-Xmx2g -Xms1g"
    for zip in logstash-output-opensearch*.zip; do
      if [ -f "$zip" ]; then
        if [[ "$zip" == *"-main.zip" ]]; then
          echo "Detected source code zip: $zip"
          echo "Extracting source code..."
          BUILD_DIR="/tmp/logstash-plugin-build-$$"
          mkdir -p "$BUILD_DIR"
          unzip -q -o "$zip" -d "$BUILD_DIR"
          PLUGIN_DIR=$(find "$BUILD_DIR" -maxdepth 1 -type d -name "logstash-output-opensearch*" | head -1)
          if [ -z "$PLUGIN_DIR" ]; then
            echo "ERROR: Could not find plugin directory in extracted zip"
            rm -rf "$BUILD_DIR"
            exit 1
          fi
          echo "Installing plugin from source directory: $PLUGIN_DIR"
          cd /usr/share/logstash
          if /usr/share/logstash/bin/logstash-plugin install "$PLUGIN_DIR" 2>/dev/null; then
            echo "Successfully installed from source directory"
            rm -rf "$BUILD_DIR"
          else
            echo "WARNING: Cannot install plugin directly from source code."
            echo "For offline installations, prepare an offline pack on a machine with internet access:"
            echo "  1. Install the plugin: /usr/share/logstash/bin/logstash-plugin install logstash-output-opensearch"
            echo "  2. Create offline pack: /usr/share/logstash/bin/logstash-plugin prepare-offline-pack logstash-output-opensearch"
            echo "  3. Copy the generated logstash-offline-plugins-*.zip to your offline directory"
            echo "  4. Install from pack: bin/logstash-plugin install file:///path/to/logstash-offline-plugins-*.zip"
            echo "Skipping plugin installation. You may need to install it manually later."
            rm -rf "$BUILD_DIR"
            exit 0
          fi
        else
          echo "Installing opensearch output plugin from plugin pack: $zip"
          bin/logstash-plugin install file:///usr/share/logstash/$zip
        fi
      fi
    done
  become: yes
  when: 
    - (plugins_check.rc != 0 or (plugins_check.stdout is defined and 'logstash-output-opensearch' not in plugins_check.stdout))
    - opensearch_plugin_zips.files | length > 0
  tags: [logstash_oss, plugins, install_opensearch]

- name: Warn if opensearch output plugin not found in offline directory
  debug:
    msg: "WARNING: logstash-output-opensearch plugin not found in offline directory. Plugin installation from rubygems.org will be skipped in offline mode."
  when: 
    - (plugins_check.rc != 0 or "'logstash-output-opensearch' not in plugins_check.stdout")
    - opensearch_plugin_zips.files | length == 0
  tags: [logstash_oss, plugins, warn_opensearch]

- name: Verify opensearch output plugin installation
  shell: /usr/share/logstash/bin/logstash-plugin list | grep "logstash-output-opensearch"
  register: opensearch_plugin_verify
  failed_when: false
  changed_when: false
  become: yes
  tags: [logstash_oss, plugins, verify]

- name: Display rest filter plugin status
  debug:
    msg: "Rest filter plugin installed: {{ rest_plugin_verify.stdout_lines }}"
  tags: [logstash_oss, plugins, status]

- name: Display opensearch output plugin status
  debug:
    msg: "OpenSearch output plugin installed: {{ opensearch_plugin_verify.stdout_lines if opensearch_plugin_verify.rc == 0 else 'NOT INSTALLED - See instructions below' }}"
  tags: [logstash_oss, plugins, status]

- name: Warn if opensearch plugin is not installed
  debug:
    msg: |
      WARNING: logstash-output-opensearch plugin is not installed.
      
      To install it offline, you need to prepare an offline pack on a machine with internet access:
      
      1. Install the plugin:
         /usr/share/logstash/bin/logstash-plugin install logstash-output-opensearch
      
      2. Create offline pack:
         /usr/share/logstash/bin/logstash-plugin prepare-offline-pack logstash-output-opensearch
      
      3. Copy the generated logstash-offline-plugins-*.zip to your offline directory
      
      4. The playbook will automatically install it on the next run
      
      Alternatively, you can install it manually:
        /usr/share/logstash/bin/logstash-plugin install file:///path/to/logstash-offline-plugins-*.zip
  when: opensearch_plugin_verify.rc != 0
  tags: [logstash_oss, plugins, warn_missing]

- name: Clean up offline plugin zips
  shell: |
    rm -f /usr/share/logstash/logstash-*.zip
  become: yes
  tags: [logstash_oss, plugins, cleanup]

- name: Clear logstash cache
  shell: |
    rm -f /var/lib/logstash/plugins/inputs/file/.sincedb*
  become: yes
  tags: [logstash_oss, plugins, cache]
