---
# Logstash OSS Configuration Tasks

- name: Create logstash conf.d directory
  file:
    path: "{{ logstash_oss_config_dir }}/conf.d"
    state: directory
    owner: "{{ logstash_oss_user }}"
    group: "{{ logstash_oss_group }}"
    mode: '0755'
  become: yes
  tags: [logstash_oss, config, main]

- name: Create logstash configuration file
  template:
    src: logstash_oss.conf.j2
    dest: "{{ logstash_oss_config_dir }}/conf.d/logstash.conf"
    owner: "{{ logstash_oss_user }}"
    group: "{{ logstash_oss_group }}"
    mode: '0644'
  become: yes
  tags: [logstash_oss, config, main]

- name: Create JVM options directory
  file:
    path: "{{ logstash_oss_config_dir }}/jvm.options.d"
    state: directory
    owner: "{{ logstash_oss_user }}"
    group: "{{ logstash_oss_group }}"
    mode: '0755'
  become: yes
  tags: [logstash_oss, config, jvm]

- name: Create JVM options file
  copy:
    content: |
      -Xms{{ logstash_oss_jvm.heap_size }}
      -Xmx{{ logstash_oss_jvm.heap_size }}
      -XX:HeapDumpPath={{ logstash_oss_jvm_settings.heap_dump_path }}
      -XX:ErrorFile={{ logstash_oss_logs_dir }}/hs_err_pid%p.log
    dest: "{{ logstash_oss_config_dir }}/jvm.options.d/jvm.options"
    owner: "{{ logstash_oss_user }}"
    group: "{{ logstash_oss_group }}"
    mode: '0644'
  become: yes
  tags: [logstash_oss, config, jvm]

- name: Create logstash.yml configuration
  copy:
    content: |
      http.host: "0.0.0.0"
      http.port: 9600
      log.level: info
      path.data: {{ logstash_oss_data_dir }}
      path.logs: {{ logstash_oss_logs_dir }}
      path.config: "{{ logstash_oss_config.path_config }}"
      pipeline.workers: 2
      pipeline.batch.size: 125
      pipeline.batch.delay: 50
      # OpenSearch specific settings
      pipeline.ecs_compatibility: disabled
      api.ssl.enabled: false
    dest: "{{ logstash_oss_config_dir }}/logstash.yml"
    owner: "{{ logstash_oss_user }}"
    group: "{{ logstash_oss_group }}"
    mode: '0644'
  become: yes
  register: logstash_oss_yml_file
  tags: [logstash_oss, config, main]

# RPM pipelines.yml wins over path.config when it defines a pipeline.
- name: Create Logstash pipelines.yml
  copy:
    content: |
      - pipeline.id: main
        path.config: "{{ logstash_oss_config.path_config }}"
    dest: "{{ logstash_oss_config_dir }}/pipelines.yml"
    owner: "{{ logstash_oss_user }}"
    group: "{{ logstash_oss_group }}"
    mode: '0644'
  become: yes
  tags: [logstash_oss, config, main]

- name: Create systemd override directory
  file:
    path: "/etc/systemd/system/{{ logstash_oss_service_name }}.service.d"
    state: directory
    mode: '0755'
  become: yes
  tags: [logstash_oss, config, systemd]

- name: Create systemd override configuration
  copy:
    content: |
      [Service]
      # Keeps logstash-core on the OSS code path even if an x-pack directory
      # reappears under {{ logstash_oss_install_dir }} (ELK stack RPM).
      Environment=OSS=true
      LimitMEMLOCK={{ logstash_oss_system.memlock_limit }}
      LimitNOFILE={{ logstash_oss_system.nofile_limit }}
      TimeoutStartSec={{ logstash_oss_systemd_timeout_start_sec }}
      TimeoutStopSec={{ logstash_oss_systemd_timeout_stop_sec }}
    dest: "/etc/systemd/system/{{ logstash_oss_service_name }}.service.d/override.conf"
    mode: '0644'
  become: yes
  register: logstash_oss_override_file
  tags: [logstash_oss, config, systemd]

- name: Remember Logstash OSS settings changes for service restart
  set_fact:
    logstash_oss_config_changed: >-
      {{ (logstash_oss_yml_file.changed | default(false))
         or (logstash_oss_override_file.changed | default(false)) }}
  tags: [logstash_oss, config, main, systemd]
