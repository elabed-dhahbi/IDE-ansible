---
# Logstash OSS Configuration Defaults for OpenSearch Stack

# Stack type (set by Makefile)
stack_type: "{{ stack_type | default('opensearch') }}"

# Logstash OSS version
logstash_oss_version: "{{ versions.logstash_oss | default('8.19.4') }}"

# When true, install logstash-output-opensearch from Rubygems if the offline pack does not contain it (or install failed).
# Set false only on air-gapped hosts that must supply a correct prepare-offline-pack zip under paths.offline_dir.
logstash_oss_plugin_install_allow_online: true

# Service configuration
logstash_oss_service_name: "logstash"
logstash_oss_user: "logstash"
logstash_oss_group: "logstash"

# systemd service timeouts (seconds). Logstash can take a while to compile pipelines/plugins.
logstash_oss_systemd_timeout_start_sec: 300
logstash_oss_systemd_timeout_stop_sec: 300

# Directory paths
logstash_oss_install_dir: "/usr/share/logstash"
logstash_oss_config_dir: "/etc/logstash"
logstash_oss_home: "/opt/logstash"
logstash_oss_data_dir: "/var/opt/logstash/data"
logstash_oss_logs_dir: "/var/opt/logstash/logs"
logstash_oss_patterns_dir: "/opt/logstash/patterns"
logstash_oss_pipeline_dir: "/usr/share/logstash/pipeline"

# Logstash OSS configuration
logstash_oss_config:
  # Network configuration
  http_host: "0.0.0.0"
  http_port: 9600
  
  # Pipeline configuration
  pipeline_ecs_compatibility: "disabled"
  api_ssl_enabled: false
  path_config: "/usr/share/logstash/pipeline/logstash.conf"
  node_name: "logstash"
  log_level: "info"
  path_data: "/var/opt/logstash/data"
  path_logs: "/var/opt/logstash/logs"
  pipeline_separate_logs: true
  
  # DMC log paths
  dmc_log_base_path: "/var/opt/dmc/current/log/DMC-BusinessLog"
  csv_export_path: "/var/opt/dmc-statistics/csvexport/logstash"
  
  # DRS configuration
  drs_host: "{{ groups['drs'] | first | default('192.168.249.241') }}"
  drs_port: "8080"
  drs_base_url: "http://{{ groups['drs'] | first | default('192.168.249.241') }}:8080/drs"
  
  # OpenSearch configuration
  opensearch_hosts: "{{ groups['opensearch'] | map('extract', hostvars, 'ansible_host') | map('regex_replace', '^(.*)$', 'https://\\1:9200') | list }}"
  opensearch_user: "admin"
  opensearch_password: "{{ system_config.service_passwords.opensearch | default('Ops@#s1cap#') }}"
  
  # Customer configuration
  customer_name: "{{ system_config.customer_name | default('DMC 4.6 DEMO') }}"
  
  # Index configuration
  dmc_index_name: "dmc-logs"
  csv_index_name: "csvexport"

# JVM configuration
# Note: logstash_oss_jvm.heap_size is defined in values.yaml
logstash_oss_jvm_settings:
  heap_dump_path: "/var/opt/logstash/data"

# System configuration
logstash_oss_system:
  memory_lock: true
  nofile_limit: 65535
  memlock_limit: "infinity"

# Package configuration (inherited from values.yaml)
package_globs:
  logstash_oss_rpm: "{{ package_globs.logstash_oss_rpm | default('logstash-oss-' + logstash_oss_version + '-x86_64.rpm') }}"
  logstash_filter_rest: "{{ package_globs.logstash_filter_rest | default('logstash-filter-rest-*.zip') }}"

# Logstash OSS specific settings
logstash_oss_settings:
  # Disable ECS compatibility
  pipeline_ecs_compatibility: "disabled"
  # Disable SSL for HTTP calls
  api_ssl_enabled: false
  # Set the correct path to the configuration file
  path_config: "/usr/share/logstash/pipeline/logstash.conf"
  # Name for the node
  node_name: "logstash"
  # Set log level
  log_level: "info"
  # Change data path
  path_data: "/var/opt/logstash/data"
  # Change log path
  path_logs: "/var/opt/logstash/logs"
  # Separation of logs per pipeline
  pipeline_separate_logs: true

