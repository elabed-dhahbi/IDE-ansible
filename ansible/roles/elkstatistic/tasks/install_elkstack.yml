---
# ELK Statistics Stack Installation Tasks
# Note: User and group are created by DMC RPM package, not by this playbook

- name: Verify DMC user exists (created by DMC RPM)
  getent:
    database: passwd
    key: "{{ elkstack_user }}"
  register: dmc_user_info
  tags: [elkstatistic, install, user, validation]

- name: Fail if DMC user does not exist
  fail:
    msg: "DMC user '{{ elkstack_user }}' does not exist. Please install DMC RPM first, which creates the user."
  when: dmc_user_info.ansible_facts.getent_passwd[elkstack_user] is not defined
  tags: [elkstatistic, install, user, validation]

- name: Display DMC user information
  debug:
    msg: "Using existing DMC user: {{ dmc_user_info.ansible_facts.getent_passwd[elkstack_user] }}"
  tags: [elkstatistic, install, user, validation]

- name: Create ELK Statistics directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ elkstack_user }}"
    group: "{{ elkstack_group }}"
    mode: '0755'
  become: true
  loop:
    - "{{ elkstack_install_dir }}"
    - "{{ elkstack_logs_dir }}"
    - "{{ elkstack_csv_dir }}"
    - "{{ elkstack_csv_logstash_dir }}"
  tags: [elkstatistic, install, directories]

- name: Find ELK Statistics package (dynamic version detection)
  find:
    paths: "{{ elkstack_package.source_dir }}"
    patterns: "prd-dmcstats-*.zip"
  register: elkstack_package_files
  tags: [elkstatistic, install, packages]

- name: Fail if ELK Statistics package not found
  fail:
    msg: "ELK Statistics package not found. Expected pattern: prd-dmcstats-*.zip in {{ elkstack_package.source_dir }}"
  when: elkstack_package_files.matched == 0
  tags: [elkstatistic, install, packages]

- name: Extract version from package filename
  set_fact:
    elkstack_detected_version: "{{ elkstack_package_files.files[0].path | basename | regex_replace('prd-dmcstats-(.+)\\.zip', '\\1') }}"
  tags: [elkstatistic, install, packages]

- name: Display detected ELK Statistics version
  debug:
    msg: "Detected ELK Statistics version: {{ elkstack_detected_version }} from package: {{ elkstack_package_files.files[0].path | basename }}"
  tags: [elkstatistic, install, packages]

- name: Copy ELK Statistics package to target
  copy:
    src: "{{ elkstack_package_files.files[0].path }}"
    dest: "{{ elkstack_install_dir }}/{{ elkstack_package_files.files[0].path | basename }}"
    mode: '0644'
  become: true
  tags: [elkstatistic, install, packages]

- name: Extract ELK Statistics package
  unarchive:
    src: "{{ elkstack_install_dir }}/{{ elkstack_package_files.files[0].path | basename }}"
    dest: "{{ elkstack_install_dir }}"
    owner: "{{ elkstack_user }}"
    group: "{{ elkstack_group }}"
    mode: '0755'
  become: true
  tags: [elkstatistic, install, extract]

- name: Verify extracted version directory exists
  stat:
    path: "{{ elkstack_install_dir }}/{{ elkstack_detected_version }}"
  register: elkstack_version_dir
  tags: [elkstatistic, install, validation]

- name: Fail if version directory not found after extraction
  fail:
    msg: "Version directory {{ elkstack_install_dir }}/{{ elkstack_detected_version }} not found after extraction. Check package contents."
  when: not elkstack_version_dir.stat.exists
  tags: [elkstatistic, install, validation]

- name: Remove existing current symlink if it exists
  file:
    path: "{{ elkstack_install_dir }}/current"
    state: absent
  become: true
  tags: [elkstatistic, install, symlink]

- name: Create current symbolic link to detected version
  file:
    src: "{{ elkstack_install_dir }}/{{ elkstack_detected_version }}"
    dest: "{{ elkstack_install_dir }}/current"
    state: link
    owner: "{{ elkstack_user }}"
    group: "{{ elkstack_group }}"
  become: true
  tags: [elkstatistic, install, symlink]

- name: Verify current symlink was created correctly
  stat:
    path: "{{ elkstack_install_dir }}/current"
  register: elkstack_current_link
  become: true
  tags: [elkstatistic, install, validation]

- name: Display current symlink status
  debug:
    msg: "Current symlink points to: {{ elkstack_current_link.stat.lnk_target if elkstack_current_link.stat.islnk else 'ERROR: Not a symlink' }}"
  tags: [elkstatistic, install, validation]

- name: Extract CSV export archive
  unarchive:
    src: "{{ elkstack_install_dir }}/current/csv_export.zip"
    dest: "{{ elkstack_install_dir }}/current/"
    owner: "{{ elkstack_user }}"
    group: "{{ elkstack_group }}"
    mode: '0755'
  become: true
  tags: [elkstatistic, install, csv_export]

- name: Set executable permissions for scripts
  file:
    path: "{{ elkstack_install_dir }}/current/csv_export/launcher"
    mode: '0755'
    recurse: true
  become: true
  tags: [elkstatistic, install, permissions]
