---
# MMG Directory Configuration Tasks
# Note: All MMG directories are created by the RPM package

- name: Verify MMG directories exist (created by RPM)
  stat:
    path: "{{ item }}"
  loop:
    - "{{ mmg_home }}"
    - "{{ mmg_config_dir }}"
    - "{{ mmg_logs_dir }}"
    - "{{ mmg_data_dir }}"
  register: mmg_dirs_check
  tags: [mmg, directories, verify]

- name: Display MMG directory status
  debug:
    msg: "Directory {{ item.item }} exists: {{ item.stat.exists }}"
  loop: "{{ mmg_dirs_check.results }}"
  tags: [mmg, directories, verify]