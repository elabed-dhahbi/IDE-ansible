---
# MMG Role Default Variables

# MMG version (inherited from main configuration)
mmg_version: "{{ versions.mmg }}"

# Service configuration
mmg_service_name: "mmg"
mmg_user: "mmg"
mmg_group: "mmg"
mmg_user_password: "mmg"

# Directory configuration
mmg_home: "/opt/mmg/home"
mmg_install_dir: "/opt/mmg"
mmg_current_dir: "/opt/mmg/current"
mmg_config_dir: "/opt/mmg/current/conf"
mmg_logs_dir: "/var/log/mmg"
mmg_data_dir: "/var/lib/mmg"

# Heap for mmgenv JAVA_HEAP_SIZE (megabytes, no unit suffix).
mmg_java_heap_size: "{{ (mmg_java | default({})).heap_size | default(2048) }}"

# 32-bit OpenJDK path used by SLS on the same VM. MMG's service profile must
# match whatever install_java.yml / SLS actually extracted under /usr/j2se.
mmg_java_home: "{{ (mmg_java | default({})).home | default('/usr/j2se/openlogic-openjdk-8u412-b08-linux-x32') }}"

# MMG configuration
mmg_config:
  http_port: "{{ service_ports.mmg_http }}"
  http_host: "0.0.0.0"
  node_id: "{{ ansible_hostname }}"
  
  # Database configuration
  database:
    host: "{{ service_ips.postgres }}"
    port: "{{ service_ports.postgres }}"
    name: "{{ postgresql_config.databases.mmg.name }}"
    user: "{{ postgresql_config.users.mmg.name | default('mmg') }}"
    password: "{{ postgresql_config.users.mmg.password }}"

# Package configuration
mmg_package: "{{ package_globs.mmg_rpm }}"




