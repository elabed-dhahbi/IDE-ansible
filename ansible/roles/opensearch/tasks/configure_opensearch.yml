
---
# OpenSearch Configuration Tasks

# Phase 4: Production Readiness - Variable Validation
- name: Validate required variables
  assert:
    that:
      - opensearch_config_dir is defined
      - opensearch_config is defined
      - opensearch_config.admin_password is defined
      - opensearch_config.cluster_name is defined
      - opensearch_user is defined
      - opensearch_group is defined
      - opensearch_certificates is defined
      - opensearch_certificates.security_dir is defined
    fail_msg: "Required OpenSearch variables are not defined. Check defaults/main.yml and config/values.yaml"
    success_msg: "All required variables are defined"
  tags: [opensearch, validation, always]

- name: Pre-flight checks - Verify OpenSSL is installed
  command: which openssl
  register: openssl_check
  changed_when: false
  failed_when: openssl_check.rc != 0
  tags: [opensearch, validation, always]

- name: Pre-flight checks - Verify required directories exist
  stat:
    path: "{{ item }}"
  register: dir_check
  loop:
    - "{{ opensearch_config_dir }}"
    - "{{ opensearch_data_dir }}"
    - "{{ opensearch_logs_dir }}"
  tags: [opensearch, validation, always]

- name: Pre-flight checks - Create directories if missing
  file:
    path: "{{ item.item }}"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0755'
  loop: "{{ dir_check.results }}"
  when: not item.stat.exists
  become: yes
  tags: [opensearch, validation, always]

- name: Initialize OpenSearch restart flag
  set_fact:
    opensearch_restart_needed: false
  tags: [opensearch, config, restart, always]

# Phase 1.3: Template-based Configuration (Idempotent)
- name: Check if OpenSearch configuration exists
  stat:
    path: "{{ opensearch_config_dir }}/opensearch.yml"
  register: opensearch_yml_stat
  become: yes
  tags: [opensearch, config, main, backup]

- name: Backup existing OpenSearch configuration
  copy:
    src: "{{ opensearch_config_dir }}/opensearch.yml"
    dest: "{{ opensearch_config_dir }}/opensearch.yml.backup-{{ ansible_date_time.epoch }}"
    remote_src: yes
  become: yes
  when:
    - opensearch_config_backup | default(true)
    - opensearch_yml_stat.stat.exists
  failed_when: false
  changed_when: false
  tags: [opensearch, config, main, backup]

- name: Generate OpenSearch configuration from template
  template:
    src: opensearch.yml.j2
    dest: "{{ opensearch_config_dir }}/opensearch.yml"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0600'
    backup: yes
  become: yes
  register: opensearch_config_template_result
  tags: [opensearch, config, main]

- name: Find OpenSearch YAML backups with insecure permissions
  find:
    paths: "{{ opensearch_config_dir }}"
    patterns:
      - "opensearch.yml.backup-*"
      - "opensearch.yml.rpmsave"
    file_type: file
  register: opensearch_yml_backups_found
  become: yes
  changed_when: false
  failed_when: false
  tags: [opensearch, config, main, permissions]

- name: Enforce secure permissions on OpenSearch YAML and backups
  file:
    path: "{{ item }}"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0600'
  loop: "{{ ([opensearch_config_dir ~ '/opensearch.yml'] + (opensearch_yml_backups_found.files | default([]) | map(attribute='path') | list)) | unique }}"
  become: yes
  tags: [opensearch, config, main, permissions]

- name: Mark OpenSearch restart needed (config template changed)
  set_fact:
    opensearch_restart_needed: true
  when: opensearch_config_template_result is changed
  tags: [opensearch, config, main, restart]

# Phase 1.1: Idempotent Service Management
- name: Check if OpenSearch service is running
  systemd:
    name: "{{ opensearch_service_name }}"
  register: opensearch_service_status
  become: yes
  changed_when: false
  failed_when: false
  tags: [opensearch, config, security, certificates]

- name: Check certificate expiration and validity
  shell: |
    if [ -f "{{ opensearch_config_dir }}/security/{{ item }}" ]; then
      openssl x509 -in {{ opensearch_config_dir }}/security/{{ item }} -noout -checkend {{ opensearch_cert_min_validity_seconds | default(2592000) }} 2>/dev/null
      echo "valid"
    else
      echo "missing"
    fi
  args:
    executable: /bin/bash
  register: cert_validation
  failed_when: false
  changed_when: false
  loop:
    - root-ca.pem
    - esnode.pem
    - admin.pem
  become: yes
  tags: [opensearch, config, security, certificates]

- name: Determine if certificates need regeneration
  set_fact:
    certs_need_regeneration: >
      {{ cert_validation.results | selectattr('stdout', 'match', 'missing|error') | list | length > 0 }}
  tags: [opensearch, config, security, certificates]

- name: Stop OpenSearch service before certificate changes (only if needed)
  systemd:
    name: "{{ opensearch_service_name }}"
    state: stopped
  become: yes
  when: >
    certs_need_regeneration and
    opensearch_service_status.status.ActiveState == "active"
  ignore_errors: yes
  tags: [opensearch, config, security, certificates]

- name: Remove any existing demo certificates
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ opensearch_config_dir }}/esnode.pem"
    - "{{ opensearch_config_dir }}/esnode-key.pem"
    - "{{ opensearch_config_dir }}/root-ca.pem"
    - "{{ opensearch_config_dir }}/kirk.pem"
    - "{{ opensearch_config_dir }}/kirk-key.pem"
  become: yes
  tags: [opensearch, config, security, certificates]

- name: Create OpenSearch security certificates directory
  file:
    path: "{{ opensearch_config_dir }}/security"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0755'
  become: yes
  tags: [opensearch, config, security, certificates]

# Phase 4: Error Handling for Certificate Generation
- name: Generate certificates with error handling
  block:
    - name: Generate Root CA private key
      command: >
        openssl genrsa -out {{ opensearch_certificates.security_dir }}/root-ca-key.pem {{ opensearch_certificates.root_ca.key_size }}
      args:
        creates: "{{ opensearch_certificates.security_dir }}/root-ca-key.pem"
      become: yes
      when: certs_need_regeneration
      tags: [opensearch, config, security, certificates]

    - name: Generate Root CA certificate
      command: >
        openssl req -new -x509 -sha256 -key {{ opensearch_certificates.security_dir }}/root-ca-key.pem
        -subj "/C={{ opensearch_certificates.root_ca.subject.C }}/ST={{ opensearch_certificates.root_ca.subject.ST }}/L={{ opensearch_certificates.root_ca.subject.L }}/O={{ opensearch_certificates.root_ca.subject.O }}/OU={{ opensearch_certificates.root_ca.subject.OU }}/CN={{ opensearch_certificates.root_ca.subject.CN }}"
        -out {{ opensearch_certificates.security_dir }}/root-ca.pem -days {{ opensearch_certificates.root_ca.validity_days }}
      args:
        creates: "{{ opensearch_certificates.security_dir }}/root-ca.pem"
      become: yes
      when: certs_need_regeneration
      tags: [opensearch, config, security, certificates]

    - name: Generate admin private key (following official OpenSearch docs)
      command: >
        openssl genrsa -out {{ opensearch_certificates.security_dir }}/admin-key-temp.pem {{ opensearch_certificates.admin.key_size }}
      args:
        creates: "{{ opensearch_certificates.security_dir }}/admin-key-temp.pem"
      become: yes
      when: certs_need_regeneration
      tags: [opensearch, config, security, certificates]

    - name: Convert admin private key to PKCS#8 (following official OpenSearch docs)
      command: >
        openssl pkcs8 -inform PEM -outform PEM -in {{ opensearch_certificates.security_dir }}/admin-key-temp.pem
        -topk8 -nocrypt -v1 PBE-SHA1-3DES -out {{ opensearch_certificates.security_dir }}/admin-key.pem
      args:
        creates: "{{ opensearch_certificates.security_dir }}/admin-key.pem"
      become: yes
      when: certs_need_regeneration
      tags: [opensearch, config, security, certificates]

    - name: Generate admin certificate signing request (following official OpenSearch docs)
      command: >
        openssl req -new -key {{ opensearch_certificates.security_dir }}/admin-key.pem
        -subj "/C={{ opensearch_certificates.admin.subject.C }}/ST={{ opensearch_certificates.admin.subject.ST }}/L={{ opensearch_certificates.admin.subject.L }}/O={{ opensearch_certificates.admin.subject.O }}/OU={{ opensearch_certificates.admin.subject.OU }}/CN={{ opensearch_certificates.admin.subject.CN }}"
        -out {{ opensearch_certificates.security_dir }}/admin.csr
      args:
        creates: "{{ opensearch_certificates.security_dir }}/admin.csr"
      become: yes
      when: certs_need_regeneration
      tags: [opensearch, config, security, certificates]

    - name: Generate admin certificate (following official OpenSearch docs)
      command: >
        openssl x509 -req -in {{ opensearch_certificates.security_dir }}/admin.csr
        -CA {{ opensearch_certificates.security_dir }}/root-ca.pem
        -CAkey {{ opensearch_certificates.security_dir }}/root-ca-key.pem
        -CAcreateserial -sha256 -out {{ opensearch_certificates.security_dir }}/admin.pem -days {{ opensearch_certificates.admin.validity_days }}
      args:
        creates: "{{ opensearch_certificates.security_dir }}/admin.pem"
      become: yes
      when: certs_need_regeneration
      tags: [opensearch, config, security, certificates]

    - name: Generate node private key
      command: >
        openssl genrsa -out {{ opensearch_certificates.security_dir }}/esnode-key.pem {{ opensearch_certificates.node.key_size }}
      args:
        creates: "{{ opensearch_certificates.security_dir }}/esnode-key.pem"
      become: yes
      when: certs_need_regeneration
      tags: [opensearch, config, security, certificates]

    - name: Generate node certificate signing request
      command: >
        openssl req -new -key {{ opensearch_certificates.security_dir }}/esnode-key.pem
        -subj "/C={{ opensearch_certificates.node.subject.C }}/ST={{ opensearch_certificates.node.subject.ST }}/L={{ opensearch_certificates.node.subject.L }}/O={{ opensearch_certificates.node.subject.O }}/OU={{ opensearch_certificates.node.subject.OU }}/CN={{ opensearch_certificates.node.subject.CN }}"
        -out {{ opensearch_certificates.security_dir }}/esnode.csr
      args:
        creates: "{{ opensearch_certificates.security_dir }}/esnode.csr"
      become: yes
      when: certs_need_regeneration
      tags: [opensearch, config, security, certificates]

    - name: Generate node certificate
      command: >
        openssl x509 -req -in {{ opensearch_certificates.security_dir }}/esnode.csr
        -CA {{ opensearch_certificates.security_dir }}/root-ca.pem
        -CAkey {{ opensearch_certificates.security_dir }}/root-ca-key.pem
        -CAcreateserial -out {{ opensearch_certificates.security_dir }}/esnode.pem -days {{ opensearch_certificates.node.validity_days }}
      args:
        creates: "{{ opensearch_certificates.security_dir }}/esnode.pem"
      become: yes
      when: certs_need_regeneration
      tags: [opensearch, config, security, certificates]

    - name: Clean up certificate signing requests and temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ opensearch_certificates.security_dir }}/esnode.csr"
        - "{{ opensearch_certificates.security_dir }}/admin.csr"
        - "{{ opensearch_certificates.security_dir }}/admin-key-temp.pem"
      become: yes
      tags: [opensearch, config, security, certificates, cleanup]
  rescue:
    - name: Clean up on certificate generation failure
      file:
        path: "{{ opensearch_certificates.security_dir }}"
        state: absent
      become: yes
      ignore_errors: yes
    - name: Fail with descriptive message
      fail:
        msg: "Certificate generation failed. Check OpenSSL installation, permissions, and disk space."
  tags: [opensearch, config, security, certificates]

- name: Set proper ownership for security certificates
  file:
    path: "{{ opensearch_certificates.security_dir }}"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    recurse: yes
    mode: '0755'
  become: yes
  tags: [opensearch, config, security, certificates]

- name: Set secure permissions on certificate private keys
  file:
    path: "{{ item }}"
    mode: '0600'
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
  loop:
    - "{{ opensearch_certificates.security_dir }}/root-ca-key.pem"
    - "{{ opensearch_certificates.security_dir }}/admin-key.pem"
    - "{{ opensearch_certificates.security_dir }}/esnode-key.pem"
  become: yes
  when: certs_need_regeneration | default(false)
  tags: [opensearch, config, security, certificates]

# Security configuration is now handled by the template above
# This section removed - all settings are in opensearch.yml.j2 template

# Phase 1.4: Idempotent Password Hash Generation
- name: Check if internal users file exists and has valid hash
  stat:
    path: "{{ opensearch_config_dir }}/opensearch-security/internal_users.yml"
  register: internal_users_file
  become: yes
  failed_when: false
  tags: [opensearch, config, security, password]

- name: Extract existing password hash from internal_users.yml
  shell: |
    grep -A 5 "^admin:" {{ opensearch_config_dir }}/opensearch-security/internal_users.yml | grep "hash:" | awk '{print $2}' | tr -d '"'
  register: existing_password_hash
  when: internal_users_file.stat.exists
  failed_when: false
  changed_when: false
  become: yes
  tags: [opensearch, config, security, password]

- name: Determine if password hash needs regeneration
  set_fact:
    password_needs_regeneration: >
      {{ not internal_users_file.stat.exists or
         existing_password_hash.stdout is not defined or
         existing_password_hash.stdout | length == 0 }}
  tags: [opensearch, config, security, password]

- name: Generate OpenSearch admin password hash (only if needed)
  shell: |
    cd /usr/share/opensearch/plugins/opensearch-security/tools
    OPENSEARCH_JAVA_HOME={{ opensearch_java_home }} ./hash.sh -p "{{ opensearch_config.admin_password }}"
  register: opensearch_password_hash_result
  become: yes
  when: password_needs_regeneration
  tags: [opensearch, config, security, password]

- name: Set OpenSearch admin password hash
  set_fact:
    opensearch_admin_password_hash: >
      {% if opensearch_password_hash_result is defined and opensearch_password_hash_result.stdout_lines is defined and opensearch_password_hash_result.stdout_lines | length > 0 %}
      {{ (opensearch_password_hash_result.stdout_lines[-1] | regex_search('\\$2[aby]\\$[0-9]{2}\\$[A-Za-z0-9./]{53}')) | default(opensearch_password_hash_result.stdout_lines[-1]) | trim }}
      {% elif existing_password_hash is defined and existing_password_hash.stdout is defined and existing_password_hash.stdout | length > 0 %}
      {{ existing_password_hash.stdout | trim }}
      {% else %}
      ""
      {% endif %}
  tags: [opensearch, config, security, password]

- name: Generate OpenSearch kibanaserver password hash (reuse admin hash)
  set_fact:
    opensearch_kibanaserver_password_hash: "{{ opensearch_admin_password_hash }}"
  tags: [opensearch, config, security, password]

- name: Configure OpenSearch internal users (following official docs)
  copy:
    content: |
      ---
      # This is the internal user database
      # The hash value is a bcrypt hash and can be generated with plugin/tools/hash.sh
      _meta:
         type: "internalusers"
         config_version: 2
      # Define your internal users here
      admin:
         hash: "{{ opensearch_admin_password_hash | trim }}"
         reserved: true
         backend_roles:
         - "admin"
         description: "Admin user"
      kibanaserver:
         hash: "{{ opensearch_kibanaserver_password_hash | trim }}"
         reserved: true
         backend_roles: []
         description: "OpenSearch Dashboards server user"
    dest: "{{ opensearch_config_dir }}/opensearch-security/internal_users.yml"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0644'
    backup: yes
  become: yes
  register: opensearch_internal_users_result
  tags: [opensearch, config, security, users]

- name: Fix YAML indentation for kibanaserver user hash
  shell: |
    sed -i 's/^  hash:/   hash:/' {{ opensearch_config_dir }}/opensearch-security/internal_users.yml
  become: yes
  tags: [opensearch, config, security, users]

- name: Mark OpenSearch restart needed (internal users changed)
  set_fact:
    opensearch_restart_needed: true
  when: opensearch_internal_users_result is changed
  tags: [opensearch, config, security, users, restart]

- name: Configure OpenSearch roles mapping (following official docs)
  copy:
    content: |
      ---
      _meta:
        type: "rolesmapping"
        config_version: 2
      all_access:
        reserved: true
        hidden: false
        backend_roles:
        - "admin"
        hosts: []
        users: []
        and_backend_roles: []
        description: "Maps admin to all_access"
      kibana_server:
        reserved: true
        hidden: false
        backend_roles: []
        hosts: []
        users:
        - "kibanaserver"
        and_backend_roles: []
    dest: "{{ opensearch_config_dir }}/opensearch-security/roles_mapping.yml"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0644'
    backup: yes
  become: yes
  register: opensearch_roles_mapping_result
  tags: [opensearch, config, security, roles]

- name: Mark OpenSearch restart needed (roles mapping changed)
  set_fact:
    opensearch_restart_needed: true
  when: opensearch_roles_mapping_result is changed
  tags: [opensearch, config, security, roles, restart]

- name: Ensure performance analyzer directory owned by opensearch before start
  shell: |
    mkdir -p /dev/shm/performanceanalyzer
    chown opensearch:opensearch /dev/shm/performanceanalyzer
    chmod 755 /dev/shm/performanceanalyzer
  become: yes
  when: certs_need_regeneration
  tags: [opensearch, config, security, certificates]

- name: Start OpenSearch service with new certificates
  systemd:
    name: "{{ opensearch_service_name }}"
    state: started
    enabled: yes
    daemon_reload: yes
  become: yes
  when: certs_need_regeneration
  tags: [opensearch, config, security, certificates]

- name: Wait for OpenSearch to start with new certificates
  wait_for:
    port: "{{ opensearch_config.http_port }}"
    host: "{{ ansible_host }}"
    delay: 10
    timeout: 120
  become: yes
  when: certs_need_regeneration
  tags: [opensearch, config, security, certificates]

# Demo certificates already disabled in template (plugins.security.allow_unsafe_democertificates: false)
# Service restart handled by handler when configuration template changes
# Health checks will verify service is ready after handlers execute

# Performance settings now handled by opensearch.yml.j2 template
# No separate task needed - all settings in template

# Phase 1.3: JVM Configuration (safe)
# Do NOT overwrite {{ opensearch_config_dir }}/jvm.options.
# OpenSearch 3.x ships required JVM flags (including a -javaagent) in the package-provided file.
# Replacing it can remove those flags and prevent the service from starting.

- name: Check JVM options files (system + packaged defaults)
  stat:
    path: "{{ item }}"
  register: opensearch_jvm_options_files
  become: yes
  failed_when: false
  loop:
    - "{{ opensearch_config_dir }}/jvm.options"
    - "/usr/share/opensearch/config/jvm.options"
  tags: [opensearch, config, jvm]

- name: Check whether current jvm.options contains required -javaagent line
  command: grep -qE '^([0-9]+-)?-javaagent:' "{{ opensearch_config_dir }}/jvm.options"
  register: opensearch_jvm_has_javaagent
  become: yes
  changed_when: false
  failed_when: false
  tags: [opensearch, config, jvm]

- name: Detect mistaken use of policy JAR as javaagent (invalid Premain-Class)
  command: grep -qE '^([0-9]+-)?-javaagent:.*opensearch-agent-policy' "{{ opensearch_config_dir }}/jvm.options"
  register: opensearch_jvm_policy_as_javaagent
  become: yes
  changed_when: false
  failed_when: false
  tags: [opensearch, config, jvm]

- name: Extract configured javaagent path (if any)
  shell: |
    set -euo pipefail
    grep -E '^([0-9]+-)?-javaagent:' "{{ opensearch_config_dir }}/jvm.options" | head -1 | sed -E 's/^([0-9]+-)?-javaagent://' || true
  args:
    executable: /bin/bash
  register: opensearch_javaagent_path
  become: yes
  changed_when: false
  failed_when: false
  tags: [opensearch, config, jvm]

# Vendor jvm.options often uses a relative agent path (agent/opensearch-agent.jar). JVM resolves
# -javaagent relative to the process working directory, not OPENSEARCH_HOME — normalize for checks.
- name: Resolve javaagent path to absolute for existence checks
  set_fact:
    opensearch_javaagent_resolved_path: "{{ '' if (p | length == 0) else (p if p.startswith('/') else opensearch_home ~ '/' ~ p) }}"
  vars:
    p: "{{ opensearch_javaagent_path.stdout | default('') | trim }}"
  tags: [opensearch, config, jvm]

- name: Check javaagent jar exists (if configured)
  stat:
    path: "{{ opensearch_javaagent_resolved_path }}"
  register: opensearch_javaagent_jar_stat
  become: yes
  failed_when: false
  when: opensearch_javaagent_resolved_path | length > 0
  tags: [opensearch, config, jvm]

- name: Set default bootstrap javaagent path (when role defaults not loaded)
  set_fact:
    opensearch_home: "{{ opensearch_home | default('/usr/share/opensearch') }}"
    opensearch_javaagent_jar: "{{ opensearch_javaagent_jar | default((opensearch_home | default('/usr/share/opensearch')) ~ '/agent/opensearch-agent.jar') }}"
  tags: [opensearch, config, jvm]

- name: Stat vendor bootstrap javaagent JAR (JDK 21+)
  stat:
    path: "{{ opensearch_javaagent_jar }}"
  register: opensearch_bootstrap_agent_jar
  become: yes
  failed_when: false
  tags: [opensearch, config, jvm]

- name: Remove invalid javaagent line when no valid agent JAR is present
  lineinfile:
    path: "{{ opensearch_config_dir }}/jvm.options"
    regexp: '^([0-9]+-)?-javaagent:'
    state: absent
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0644'
  become: yes
  register: opensearch_javaagent_removed_result
  when:
    - not (opensearch_bootstrap_agent_jar.stat.exists | default(false))
    - (opensearch_jvm_policy_as_javaagent.rc | default(1)) == 0
      or (
        (opensearch_javaagent_resolved_path | length > 0)
        and (not (opensearch_javaagent_jar_stat.stat.exists | default(false)))
      )
  tags: [opensearch, config, jvm]

- name: Mark OpenSearch restart needed (invalid javaagent removed)
  set_fact:
    opensearch_restart_needed: true
  when: opensearch_javaagent_removed_result is changed
  tags: [opensearch, config, jvm, restart]

- name: Restore packaged jvm.options if current file is missing critical flags
  copy:
    src: "/usr/share/opensearch/config/jvm.options"
    dest: "{{ opensearch_config_dir }}/jvm.options"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0644'
    remote_src: yes
    backup: yes
  become: yes
  when:
    - (opensearch_jvm_has_javaagent.rc | default(1)) != 0
      or (opensearch_jvm_policy_as_javaagent.rc | default(1)) == 0
      or (
        (opensearch_javaagent_path.stdout | default('') | trim | length > 0)
        and (not (opensearch_javaagent_jar_stat.stat.exists | default(false)))
      )
    - (opensearch_jvm_options_files.results | selectattr('item','equalto','/usr/share/opensearch/config/jvm.options') | first).stat.exists | default(false)
  register: opensearch_jvm_restored
  tags: [opensearch, config, jvm]

- name: Mark OpenSearch restart needed (jvm.options restored)
  set_fact:
    opensearch_restart_needed: true
  when: opensearch_jvm_restored is changed
  tags: [opensearch, config, jvm, restart]

- name: Ensure bootstrap javaagent line points at vendor agent JAR
  lineinfile:
    path: "{{ opensearch_config_dir }}/jvm.options"
    regexp: '^([0-9]+-)?-javaagent:'
    line: "21-:-javaagent:{{ opensearch_javaagent_jar }}"
    create: yes
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0644'
  become: yes
  register: opensearch_javaagent_line_result
  when: opensearch_bootstrap_agent_jar.stat.exists | default(false)
  tags: [opensearch, config, jvm]

- name: Mark OpenSearch restart needed (javaagent line updated)
  set_fact:
    opensearch_restart_needed: true
  when: opensearch_javaagent_line_result is changed
  tags: [opensearch, config, jvm, restart]

- name: Ensure jvm.options.d directory exists
  file:
    path: "{{ opensearch_config_dir }}/jvm.options.d"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0755'
  become: yes
  tags: [opensearch, config, jvm]

- name: Write Ansible-managed JVM overrides (heap/gc) as drop-in
  template:
    src: jvm.options.j2
    dest: "{{ opensearch_config_dir }}/jvm.options.d/99-ansible.options"
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0644'
    backup: yes
  become: yes
  register: opensearch_jvm_dropin_result
  tags: [opensearch, config, jvm]

- name: Mark OpenSearch restart needed (JVM drop-in changed)
  set_fact:
    opensearch_restart_needed: true
  when: opensearch_jvm_dropin_result is changed
  tags: [opensearch, config, jvm, restart]

- name: Configure systemd service limits
  lineinfile:
    path: "/etc/systemd/system/opensearch.service.d/override.conf"
    line: "{{ item }}"
    create: yes
  loop:
    - "[Service]"
    - "LimitMEMLOCK=infinity"
    - "LimitNOFILE={{ opensearch_limits.max_file_descriptors }}"
  become: yes
  tags: [opensearch, config, systemd]

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: yes
  tags: [opensearch, config, systemd]

- name: Set Java environment for OpenSearch user
  lineinfile:
    path: "/opt/opensearch/.profile"
    line: "export JAVA_HOME={{ opensearch_java_home }}"
    create: yes
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0644'
  become: yes
  tags: [opensearch, config, java]

# Password hash generation and user configuration already handled earlier in playbook
# These duplicate tasks removed - see Phase 1.4 above

- name: Fix Performance Analyzer directory ownership
  file:
    path: "/dev/shm/performanceanalyzer"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0755'
  become: yes
  ignore_errors: yes
  tags: [opensearch, config, performance_analyzer]

- name: Fix systemd service ExecStartPre command for performance analyzer
  lineinfile:
    path: /usr/lib/systemd/system/opensearch.service
    regexp: '^ExecStartPre=/bin/chown opensearch:opensearch /dev/shm/performanceanalyzer$'
    line: 'ExecStartPre=/bin/chown opensearch:opensearch /dev/shm/performanceanalyzer'
    backup: yes
  become: yes
  tags: [opensearch, config, performance_analyzer]

- name: Ensure performance analyzer directory exists with correct ownership
  shell: |
    mkdir -p /dev/shm/performanceanalyzer
    chown opensearch:opensearch /dev/shm/performanceanalyzer
    chmod 755 /dev/shm/performanceanalyzer
  become: yes
  ignore_errors: yes
  tags: [opensearch, config, performance_analyzer]

- name: Ensure /var/opt/opensearch exists with correct ownership
  file:
    path: "/var/opt/opensearch"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0755'
  become: yes
  tags: [opensearch, config, directories, ownership]

- name: Ensure OpenSearch backup directory exists with correct ownership
  file:
    path: "{{ opensearch_backup_dir }}"
    state: directory
    owner: "{{ opensearch_user }}"
    group: "{{ opensearch_group }}"
    mode: '0755'
  become: yes
  tags: [opensearch, config, directories, ownership]

- name: Ensure all OpenSearch directories are owned by opensearch user
  command: chown -R {{ opensearch_user }}:{{ opensearch_group }} {{ item }}
  become: yes
  loop:
    - "/etc/opensearch"
    - "/usr/share/opensearch"
    - "/var/lib/opensearch"
    - "/var/log/opensearch"
    - "/var/opt/opensearch"
    - "/opt/opensearch"
  ignore_errors: yes
  tags: [opensearch, config, ownership]

- name: Restart OpenSearch if configuration changed (single restart point)
  block:
    - name: Restart OpenSearch service (batched changes)
      systemd:
        name: "{{ opensearch_service_name }}"
        state: restarted
        daemon_reload: yes
      become: yes
  rescue:
    - name: Capture OpenSearch service status (batched restart)
      command: systemctl status "{{ opensearch_service_name }}" --no-pager -l
      register: opensearch_service_status_debug
      changed_when: false
      failed_when: false
      become: yes

    - name: Capture OpenSearch service logs (batched restart)
      command: journalctl -u "{{ opensearch_service_name }}" -n 200 --no-pager
      register: opensearch_service_journal_debug
      changed_when: false
      failed_when: false
      become: yes

    - name: Capture effective JVM javaagent configuration (batched restart)
      shell: |
        set -euo pipefail
        echo "=== /etc/opensearch/jvm.options (javaagent lines) ==="
        grep -nE '^([0-9]+-)?-javaagent:' /etc/opensearch/jvm.options || true
        echo ""
        echo "=== /etc/opensearch/jvm.options.d ==="
        ls -la /etc/opensearch/jvm.options.d || true
        echo ""
        echo "=== agent jar existence ==="
        agent=$(grep -E '^([0-9]+-)?-javaagent:' /etc/opensearch/jvm.options | head -1 | sed -E 's/^([0-9]+-)?-javaagent://' || true)
        echo "agent_path=${agent}"
        if [ -n "${agent}" ]; then
          ls -la "${agent}" || true
        fi
      args:
        executable: /bin/bash
      register: opensearch_jvm_debug
      changed_when: false
      failed_when: false
      become: yes

    - name: Fail with OpenSearch restart diagnostics (batched restart)
      fail:
        msg: |
          Unable to restart {{ opensearch_service_name }} after configuration changes.

          === systemctl status ===
          {{ opensearch_service_status_debug.stdout | default('no output') }}

          === journalctl (last 200 lines) ===
          {{ opensearch_service_journal_debug.stdout | default('no output') }}

          === JVM javaagent debug ===
          {{ opensearch_jvm_debug.stdout | default('no output') }}
  when: opensearch_restart_needed | default(false)
  tags: [opensearch, config, restart]

- name: Wait for OpenSearch service to be fully started
  wait_for:
    port: "{{ opensearch_config.http_port }}"
    host: "{{ ansible_host }}"
    delay: 10
    timeout: 60
  become: yes
  tags: [opensearch, config, restart]

- name: Apply security configuration changes using securityadmin.sh (following official docs)
  shell: |
    cd /usr/share/opensearch/plugins/opensearch-security/tools
    OPENSEARCH_JAVA_HOME={{ opensearch_java_home }} ./securityadmin.sh -cd {{ opensearch_config_dir }}/opensearch-security/ -h {{ ansible_host }} -p {{ opensearch_config.http_port }} -cert {{ opensearch_certificates.security_dir }}/admin.pem -key {{ opensearch_certificates.security_dir }}/admin-key.pem -cacert {{ opensearch_certificates.security_dir }}/root-ca.pem -icl -nhnv
  become: yes
  register: securityadmin_result
  retries: 5
  delay: 5
  until: securityadmin_result.rc == 0
  failed_when: securityadmin_result.rc != 0
  changed_when: "'Done with success' in securityadmin_result.stdout"
  tags: [opensearch, config, security, apply]

# Phase 4: Production Health Checks (after handlers flush)
- name: Wait for OpenSearch to be ready
  uri:
    url: "https://{{ ansible_host }}:{{ opensearch_config.http_port }}"
    method: GET
    status_code: [200, 401]  # 401 is OK if auth is working
    user: "admin"
    password: "{{ opensearch_config.admin_password }}"
    force_basic_auth: yes
    validate_certs: false
  register: opensearch_health
  retries: 30
  delay: 10
  until: opensearch_health.status in [200, 401]
  become: yes
  tags: [opensearch, config, health]

- name: Verify OpenSearch cluster health
  uri:
    url: "https://{{ ansible_host }}:{{ opensearch_config.http_port }}/_cluster/health?pretty"
    method: GET
    user: "admin"
    password: "{{ opensearch_config.admin_password }}"
    force_basic_auth: yes
    validate_certs: false
    status_code: [200]
  register: cluster_health
  retries: 10
  delay: 5
  until:
    - cluster_health.status == 200
    - cluster_health.json is defined
    - cluster_health.json.status is defined
    - cluster_health.json.status in ['green', 'yellow']
  failed_when:
    - cluster_health.status is defined
    - cluster_health.status == 200
    - cluster_health.json is defined
    - cluster_health.json.status is defined
    - cluster_health.json.status == 'red'
  become: yes
  tags: [opensearch, config, health]

- name: Display OpenSearch cluster status
  debug:
    msg: "OpenSearch cluster status: {{ (cluster_health.json.status if (cluster_health.json is defined and cluster_health.json.status is defined) else 'unknown') }}"
  tags: [opensearch, config, health]

- name: Verify OpenSearch node is responding
  uri:
    url: "https://{{ ansible_host }}:{{ opensearch_config.http_port }}/_nodes/{{ opensearch_config.node_name }}"
    method: GET
    user: "admin"
    password: "{{ opensearch_config.admin_password }}"
    force_basic_auth: yes
    validate_certs: false
    status_code: [200]
  register: node_status
  become: yes
  tags: [opensearch, config, health]

- name: Display production certificate details
  shell: |
    echo "=== OpenSearch Production Certificates ==="
    ls -la {{ opensearch_certificates.security_dir }}/
    echo ""
    echo "--- Root CA Certificate Details ---"
    openssl x509 -in {{ opensearch_certificates.security_dir }}/root-ca.pem -text -noout | grep -E '(Subject:|Not Before|Not After|Public Key Algorithm)'
    echo ""
    echo "--- Node Certificate Details ---"
    openssl x509 -in {{ opensearch_certificates.security_dir }}/esnode.pem -text -noout | grep -E '(Subject:|Not Before|Not After|Public Key Algorithm)'
    echo ""
    echo "=== Certificate Security Features ==="
    echo "✓ 4096-bit RSA encryption"
    echo "✓ 10-year validity (2025-2035)"
    echo "✓ Production organization: SICAP"
    echo "✓ Proper file permissions"
    echo "✓ No demo certificates allowed"
  register: certificate_details
  become: yes
  tags: [opensearch, config, certificates, status]

- name: Show certificate details
  debug:
    msg: "{{ certificate_details.stdout_lines }}"
  tags: [opensearch, config, certificates, status]

# Phase 4: Final Production Summary
- name: Display OpenSearch installation summary
  debug:
    msg:
      - "=========================================="
      - "OpenSearch Configuration Complete"
      - "=========================================="
      - "Cluster: {{ opensearch_config.cluster_name }}"
      - "Node: {{ opensearch_config.node_name }}"
      - "HTTP Port: {{ opensearch_config.http_port }}"
      - "Transport Port: {{ opensearch_config.transport_port }}"
      - "SSL Enabled: Yes (Transport & HTTP)"
      - "Authentication: Enabled"
      - "Health Status: {{ cluster_health.json.status | default('unknown') }}"
      - "=========================================="
  tags: [opensearch, config, summary]
