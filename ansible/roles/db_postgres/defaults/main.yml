---
# =============================================================================
# PostgreSQL Role Default Variables
# =============================================================================
# These can be overridden in group_vars or host_vars
# Version numbers come from vars/release.yml for centralized management
# =============================================================================

# Skip PostgreSQL installation (set to true to skip installation tasks)
# When true, only DMC database setup tasks will run
skip_postgres_install: false

# PostgreSQL version (from centralized vars/release.yml)
postgresql_major_version: "{{ postgresql_major_version | default('15') }}"
postgresql_full_version: "{{ postgresql_full_version | default('15.14') }}"
postgresql_package_version: "{{ postgresql_package_version | default('15.14-1PGDG.rhel9') }}"
libpq_version: "{{ libpq_version | default('17.6-1PGDG.rhel9') }}"
python3_psycopg2_version: "{{ python3_psycopg2_version | default('2.8.6-6.el9') }}"

# Legacy compatibility (for existing playbooks)
postgresql_version: "{{ postgresql_major_version }}"

# Service configuration
postgresql_service_name: "postgresql-{{ postgresql_major_version }}"

# Directory configuration (inherited from main configuration)
postgresql_data_directory: "{{ postgresql_config.data_directory }}"
postgresql_home_directory: "{{ postgresql_config.home_directory }}"

# Package configuration
postgresql_repo_package: "{{ package_globs.pgdg_repo_rpm }}"

# Database configuration
postgresql_databases: "{{ postgresql_config.databases }}"
postgresql_users: "{{ postgresql_config.users }}"

# Tablespaces configuration
postgresql_tablespaces_base: "{{ install_paths.postgres_tablespaces_base }}"

# Network configuration
postgresql_port: "{{ service_ports.postgres }}"
postgresql_listen_addresses: "*"
postgresql_max_prepared_transactions: 64

# Security configuration
postgresql_ssl: false
postgresql_authentication_method: "password"

# Performance tuning
postgresql_shared_buffers: "256MB"
postgresql_effective_cache_size: "1GB"
postgresql_work_mem: "4MB"
postgresql_maintenance_work_mem: "64MB"

