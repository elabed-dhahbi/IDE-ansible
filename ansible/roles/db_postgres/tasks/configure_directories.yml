---
# PostgreSQL Service Configuration Tasks
# These tasks configure PostgreSQL service and settings after installation
# Tag: postgres_install (runs only when installation is not skipped)
# Includes directory creation, config file modifications, and service configuration

- name: Check if PostgreSQL is initialized
  stat:
    path: "{{ postgresql_config.data_directory }}/postgresql.conf"
  register: postgres_initialized_check
  become: yes
  tags: [postgres, postgres_install, service, config, check]

# Do not use recurse: yes on parents of the tablespace tree: if tablespaces live under
# the same major-version path as PGDATA (e.g. .../15/tablespaces with .../15/data),
# recursive mode/owner changes apply 0755 to the cluster directory and PostgreSQL
# will refuse to start ("invalid permissions", only 0700 or 0750 allowed on PGDATA).
- name: Create PostgreSQL tablespaces base directory
  file:
    path: "{{ install_paths.postgres_tablespaces_base }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
  become: yes
  tags: [postgres, postgres_install, service, directories, tablespaces]

- name: Ensure parent directory permissions for tablespaces
  file:
    path: "{{ install_paths.postgres_tablespaces_base | dirname }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'
  become: yes
  tags: [postgres, postgres_install, service, directories, tablespaces]

- name: Create tablespace directories for DMC
  file:
    path: "{{ install_paths.postgres_tablespaces_base }}/{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  loop:
    - "{{ postgresql_config.databases.dmc46.tablespaces.data }}"
    - "{{ postgresql_config.databases.dmc46.tablespaces.index }}"
  when: postgresql_config.databases.dmc46 is defined
  become: yes
  tags: [postgres, postgres_install, service, directories, tablespaces, dmc]

- name: Create tablespace directories for MMG
  file:
    path: "{{ install_paths.postgres_tablespaces_base }}/{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  loop:
    - "{{ postgresql_config.databases.mmg.tablespaces.data }}"
    - "{{ postgresql_config.databases.mmg.tablespaces.index }}"
  when: postgresql_config.databases.mmg is defined
  become: yes
  tags: [postgres, postgres_install, service, directories, tablespaces, mmg]

- name: Create tablespace directories for MDBA
  file:
    path: "{{ install_paths.postgres_tablespaces_base }}/{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  loop:
    - "{{ postgresql_config.users.mdba.tablespaces.data }}"
    - "{{ postgresql_config.users.mdba.tablespaces.index }}"
  when: postgresql_config.users.mdba is defined
  become: yes
  tags: [postgres, postgres_install, service, directories, tablespaces, mdba]

- name: Update PostgreSQL configuration file with custom data directory
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/postgresql.conf"
    regexp: '^#?data_directory\s*='
    line: "data_directory = '{{ postgresql_config.data_directory }}'"
    backup: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config]

- name: Configure PostgreSQL to listen on all interfaces
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/postgresql.conf"
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = '*'"
    backup: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, network]

- name: Configure PostgreSQL password encryption to use MD5
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/postgresql.conf"
    regexp: '^#?password_encryption\s*='
    line: "password_encryption = md5"
    backup: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Temporarily allow local trust for password bootstrap
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/pg_hba.conf"
    regexp: '^local\s+all\s+all\s+.*$'
    line: "local   all             all                                     trust"
    backup: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Enforce PGDATA permissions before PostgreSQL service (0700; required by postmaster)
  file:
    path: "{{ postgresql_config.data_directory }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth, pgdata]

- name: Check PostgreSQL service status before restart
  systemd:
    name: "{{ postgresql_config.service_name }}"
  register: postgres_service_status_before
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Start PostgreSQL if not running, otherwise restart
  systemd:
    name: "{{ postgresql_config.service_name }}"
    state: "{{ 'started' if (postgres_service_status_before.status.ActiveState | default('inactive')) == 'inactive' else 'restarted' }}"
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]
  ignore_errors: yes
  register: postgres_restart_result

- name: Wait for PostgreSQL to be ready after restart
  wait_for:
    port: "{{ service_ports.postgres }}"
    host: "127.0.0.1"
    delay: 5
    timeout: 30
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]
  ignore_errors: yes

- name: Check PostgreSQL service status after restart
  systemd:
    name: "{{ postgresql_config.service_name }}"
  register: postgres_service_status_after
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Display PostgreSQL service logs if service failed
  command: journalctl -u "{{ postgresql_config.service_name }}" -n 50 --no-pager
  register: postgres_service_logs
  changed_when: false
  failed_when: false
  become: yes
  when: 
    - postgres_initialized_check.stat.exists
    - (postgres_service_status_after.status.ActiveState | default('inactive')) != 'active'
  tags: [postgres, postgres_install, service, config, auth, debug]

- name: Show PostgreSQL service error logs
  debug:
    msg: "{{ postgres_service_logs.stdout_lines }}"
  when: 
    - postgres_initialized_check.stat.exists
    - (postgres_service_status_after.status.ActiveState | default('inactive')) != 'active'
    - postgres_service_logs.stdout_lines is defined
  tags: [postgres, postgres_install, service, config, auth, debug]

- name: Fail if PostgreSQL service is not running
  fail:
    msg: "PostgreSQL service failed to start. Check logs above or run: journalctl -u {{ postgresql_config.service_name }} -n 50"
  when: 
    - postgres_initialized_check.stat.exists
    - (postgres_service_status_after.status.ActiveState | default('inactive')) != 'active'
  tags: [postgres, postgres_install, service, config, auth]

- name: Set PostgreSQL password for postgres user (socket, no host)
  shell: |
    psql -U postgres -d postgres -c "ALTER USER postgres PASSWORD '{{ system_config.service_passwords.postgres }}';"
  become_user: postgres
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Enforce local md5 after password set
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/pg_hba.conf"
    regexp: '^local\s+all\s+all\s+.*$'
    line: "local   all             all                                     md5"
    backup: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Configure PostgreSQL authentication to use MD5
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/pg_hba.conf"
    regexp: '^local\s+all\s+all\s+trust$'
    line: "local   all             all                                     md5"
    backup: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Configure PostgreSQL host authentication to use MD5
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/pg_hba.conf"
    regexp: '^host\s+all\s+all\s+127\.0\.0\.1/32\s+trust$'
    line: "host    all             all             127.0.0.1/32            md5"
    backup: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Configure PostgreSQL host authentication for all networks
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/pg_hba.conf"
    regexp: '^host\s+all\s+all\s+0\.0\.0\.0/0\s+md5$'
    line: "host    all             all             0.0.0.0/0               md5"
    backup: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Ensure PostgreSQL IPv6 localhost uses MD5
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/pg_hba.conf"
    regexp: '^host\s+all\s+all\s+::1/128\s+trust$'
    line: "host    all             all             ::1/128                md5"
    backup: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Configure PostgreSQL host authentication for all IPv6 networks
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/pg_hba.conf"
    regexp: '^host\s+all\s+all\s+::/0\s+md5$'
    line: "host    all             all             ::/0                   md5"
    backup: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, config, auth]

- name: Fix PostgreSQL data directory permissions
  file:
    path: "{{ postgresql_config.data_directory }}"
    owner: postgres
    group: postgres
    mode: '0700'
    recurse: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, permissions]

- name: Restart PostgreSQL service to apply configuration changes
  systemd:
    name: "{{ postgresql_config.service_name }}"
    state: restarted
    enabled: yes
  become: yes
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service]

- name: Wait for PostgreSQL to be ready after restart
  wait_for:
    port: "{{ service_ports.postgres }}"
    host: "{{ ansible_host }}"
    delay: 5
    timeout: 60
  when: postgres_initialized_check.stat.exists
  tags: [postgres, postgres_install, service, wait]
