    - postgresql_config.databases.mmg is defined
  tags: [postgres, databases, mmg]

- name: Create DMC schema (skip mode - using psql)
  shell: |
    export PGPASSWORD='{{ db_password }}'
    {{ psql_binary }} -h {{ db_host }} -p {{ db_port }} -U {{ db_user }} -d {{ postgresql_config.databases.dmc46.name }} -c "CREATE SCHEMA IF NOT EXISTS {{ postgresql_config.databases.dmc46.schema }} AUTHORIZATION {{ postgresql_config.databases.dmc46.owner }};"
  delegate_to: localhost
  when:
    - use_psql_commands | default(false)
    - postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, schemas, dmc]

- name: Create DMC schema (normal mode - using Ansible module)
  postgresql_query:
    query: "CREATE SCHEMA IF NOT EXISTS {{ postgresql_config.databases.dmc46.schema }} AUTHORIZATION {{ postgresql_config.databases.dmc46.owner }}"
    db: "{{ postgresql_config.databases.dmc46.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ db_port }}"
    login_user: "{{ db_user }}"
    login_password: "{{ db_password }}"
  when:
    - not (use_psql_commands | default(false))
    - postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, schemas, dmc]

- name: Set DMC search path (skip mode - using psql)
  shell: |
    export PGPASSWORD='{{ db_password }}'
    {{ psql_binary }} -h {{ db_host }} -p {{ db_port }} -U {{ db_user }} -d {{ postgresql_config.databases.dmc46.name }} -c "ALTER ROLE {{ postgresql_config.databases.dmc46.owner }} IN DATABASE {{ postgresql_config.databases.dmc46.name }} SET search_path = {{ postgresql_config.databases.dmc46.schema }};"
  delegate_to: localhost
  when:
    - use_psql_commands | default(false)
    - postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, schemas, dmc]

- name: Set DMC search path (normal mode - using Ansible module)
