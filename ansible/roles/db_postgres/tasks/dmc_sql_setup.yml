    {{ psql_binary }} -h {{ db_host }} -p {{ db_port }} -U {{ db_user }} -d {{ postgresql_config.databases.dmc46.name }} -c "GRANT USAGE ON SCHEMA {{ postgresql_config.databases.dmc46.schema }} TO {{ postgresql_config.databases.dmc46.owner }};"
