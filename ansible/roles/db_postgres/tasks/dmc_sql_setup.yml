# Note: Tablespace creation is skipped in skip mode because it requires directory creation
# Tablespaces can be created manually by the database administrator if needed
# The tablespace directories must exist on the PostgreSQL server before creating tablespaces

# DMC, MMG and the ELK statistics jobs all connect over TCP with these roles. A
# role that was never created, or whose password is still SCRAM-hashed while
# pg_hba says md5, surfaces much later as
# "FATAL: password authentication failed for user dmc4" on a DMC node, after
# several ignored psql tasks. Prove the logins work here, where the fix lives.
- name: Verify application roles can log in over TCP
  shell: |
    PGPASSWORD='{{ item.password }}' {{ psql_binary | default('psql') }} \
      -h {{ db_host }} -p {{ db_port }} -U {{ item.name }} -d {{ item.db }} -tAc 'SELECT 1'
  delegate_to: "{{ 'localhost' if (use_psql_commands | default(false)) else inventory_hostname }}"
  loop:
    - name: "{{ postgresql_config.users.dmc4.name | default('dmc4') }}"
      password: "{{ postgresql_config.users.dmc4.password }}"
      db: "{{ postgresql_config.databases.dmc46.name }}"
    - name: "{{ postgresql_config.users.mmg.name | default('mmg') }}"
      password: "{{ postgresql_config.users.mmg.password }}"
      db: "{{ postgresql_config.databases.mmg.name }}"
    - name: "{{ postgresql_config.users.mdba.name | default('mdba') }}"
      password: "{{ postgresql_config.users.mdba.password }}"
      db: "{{ postgresql_config.databases.dmc46.name }}"
  loop_control:
    label: "{{ item.name }}@{{ item.db }}"
  register: db_role_login_checks
  failed_when: false
  changed_when: false
  tags: [postgres, databases, users, verify]

- name: Collect role and encryption state when a login failed
  shell: |
    psql -d postgres -tAc "SHOW password_encryption;"
    psql -d postgres -tAc "
      SELECT rolname || ' password=' || CASE
               WHEN rolpassword IS NULL THEN 'NONE'
               WHEN rolpassword LIKE 'SCRAM%' THEN 'SCRAM (md5 auth cannot verify it)'
               ELSE 'md5' END
      FROM pg_authid
      WHERE rolname IN ('{{ postgresql_config.users.dmc4.name | default('dmc4') }}',
                        '{{ postgresql_config.users.mmg.name | default('mmg') }}',
                        '{{ postgresql_config.users.mdba.name | default('mdba') }}');"
  become: yes
  become_user: postgres
  register: db_role_diagnostics
  failed_when: false
  changed_when: false
  when:
    - not (use_psql_commands | default(false))
    - db_role_login_checks.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0
  tags: [postgres, databases, users, verify]

- name: Fail when an application role cannot log in
  fail:
    msg: |
      These database logins were refused on {{ db_host }}:{{ db_port }}:
      {% for result in db_role_login_checks.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) %}
        - {{ result.item.name }}@{{ result.item.db }}: {{ result.stderr | default('') | trim }}
      {% endfor %}
      Role state reported by the cluster:
      {{ db_role_diagnostics.stdout_lines | default(['(not collected)']) | join(', ') }}

      An empty role list means the role creation tasks in this file never ran
      against this cluster. Check that the run included the 'postgres' tag and
      that SKIP_POSTGRES / SKIP_POSTGRES_INSTALL were not set, then re-run:
        ansible-playbook -i {{ inventory_file | default('<inventory>') }} site.yml --tags postgres
      A SCRAM password means the role was created before password_encryption
      became md5; ensure_md5_auth.yml plus the re-hash task in this file fix that
      on the next run.
  when: db_role_login_checks.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0
  tags: [postgres, databases, users, verify]
