    DO \$\$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ postgresql_config.users.mdba.name | default('mdba') }}') THEN
        CREATE USER {{ postgresql_config.users.mdba.name | default('mdba') }} WITH PASSWORD '{{ postgresql_config.users.mdba.password }}';
      ELSE
        ALTER USER {{ postgresql_config.users.mdba.name | default('mdba') }} WITH PASSWORD '{{ postgresql_config.users.mdba.password }}';
      END IF;
    END
    \$\$;"
  become: yes
  become_user: postgres
  when:
    - not (use_psql_commands | default(false))
    - postgresql_config.users.mdba is defined
  tags: [postgres, databases, users, mdba]

- name: Re-hash application role passwords after md5 encryption is active
  command: >
    psql -d postgres -v ON_ERROR_STOP=1
    -c "ALTER USER {{ item.name }} WITH PASSWORD '{{ item.password }}';"
  become: yes
  become_user: postgres
  loop:
    - name: "{{ postgresql_config.users.dmc4.name | default('dmc4') }}"
      password: "{{ postgresql_config.users.dmc4.password }}"
    - name: "{{ postgresql_config.users.mmg.name | default('mmg') }}"
      password: "{{ postgresql_config.users.mmg.password | default('') }}"
    - name: "{{ postgresql_config.users.mdba.name | default('mdba') }}"
      password: "{{ postgresql_config.users.mdba.password | default('') }}"
  when:
    - not (use_psql_commands | default(false))
    - item.password | length > 0
  tags: [postgres, databases, users, auth, dmc]

- name: Create DMC database (skip mode - using psql)
  shell: |
    export PGPASSWORD='{{ db_password }}'
    {{ psql_binary }} -h {{ db_host }} -p {{ db_port }} -U {{ db_user }} -d postgres -c "CREATE DATABASE {{ postgresql_config.databases.dmc46.name }} OWNER {{ postgresql_config.databases.dmc46.owner }};"
  delegate_to: localhost
  when:
    - use_psql_commands | default(false)
    - postgresql_config.databases.dmc46 is defined
  failed_when: false  # Ignore if database already exists
  changed_when: false
  tags: [postgres, databases, dmc]

- name: Create DMC database (normal mode - using Ansible module)
  postgresql_db:
    name: "{{ postgresql_config.databases.dmc46.name }}"
    owner: "{{ postgresql_config.databases.dmc46.owner }}"
    state: present
    login_host: "{{ ansible_host }}"
    login_port: "{{ db_port }}"
    login_user: "{{ db_user }}"
    login_password: "{{ db_password }}"
  when:
    - not (use_psql_commands | default(false))
    - postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, dmc]

- name: Create MMG database (skip mode - using psql)
  shell: |
    export PGPASSWORD='{{ db_password }}'
    {{ psql_binary }} -h {{ db_host }} -p {{ db_port }} -U {{ db_user }} -d postgres -c "CREATE DATABASE {{ postgresql_config.databases.mmg.name }} OWNER {{ postgresql_config.databases.mmg.owner }};"
