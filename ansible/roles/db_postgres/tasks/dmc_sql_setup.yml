    - postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, schemas, dmc]

- name: Grant DMC database permissions (skip mode - using psql)
  shell: |
    export PGPASSWORD='{{ db_password }}'
    {{ psql_binary }} -h {{ db_host }} -p {{ db_port }} -U {{ db_user }} -d {{ postgresql_config.databases.dmc46.name }} -c "GRANT CONNECT ON DATABASE {{ postgresql_config.databases.dmc46.name }} TO {{ postgresql_config.databases.dmc46.owner }};"
  delegate_to: localhost
  when:
