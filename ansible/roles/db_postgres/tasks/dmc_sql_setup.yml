- name: Create MMG schema (normal mode - using Ansible module)
  postgresql_query:
    query: "CREATE SCHEMA IF NOT EXISTS {{ postgresql_config.databases.mmg.schema }} AUTHORIZATION {{ postgresql_config.databases.mmg.owner }}"
    db: "{{ postgresql_config.databases.mmg.name }}"
