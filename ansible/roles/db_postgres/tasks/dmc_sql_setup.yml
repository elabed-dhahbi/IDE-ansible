    {{ psql_binary }} -h {{ db_host }} -p {{ db_port }} -U {{ db_user }} -d {{ postgresql_config.databases.dmc46.name }} -c "ALTER ROLE {{ postgresql_config.databases.dmc46.owner }} IN DATABASE {{ postgresql_config.databases.dmc46.name }} SET search_path = {{ postgresql_config.databases.dmc46.schema }};"
