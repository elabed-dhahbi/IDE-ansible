---
# DMC SQL-Only Setup Tasks
# These tasks create databases, users, schemas, and grant privileges using ONLY SQL
# These tasks ALWAYS run, even in skip_postgres_install mode
# In skip mode: uses psql commands from localhost (Ansible control node)
# In normal mode: uses Ansible PostgreSQL modules

# Postgres IP always comes from inventory [postgres] ansible_host
# (TT: lprep1p ansible_host=192.168.251.188). Do not use values.yaml
# external_host: null — that becomes the hostname "None".
- name: Set database connection parameters from inventory
  set_fact:
    db_host: "{{ hostvars[groups['postgres'][0]]['ansible_host'] }}"
    db_port_raw: "{{ service_ports.postgres | default(5432) }}"
    db_user: postgres
    db_password: "{{ system_config.service_passwords.postgres }}"
  tags: [postgres, databases, config]

- name: Normalize database port (fallback to 5432 when unset/invalid)
  set_fact:
    db_port: "{{ (db_port_raw | int) if (db_port_raw | int) > 0 else 5432 }}"
  tags: [postgres, databases, config]

- name: Show which dmc_sql_setup.yml Ansible loaded
  debug:
    msg: >-
      Creating DMC/MMG/MDBA roles with local psql as OS user postgres on
      {{ inventory_hostname }} (inventory ansible_host={{ ansible_host }}).
      This file must contain: Create DMC user on inventory postgres host via local psql
  tags: [postgres, databases, config]

- name: Require inventory [postgres] ansible_host
  assert:
    that:
      - groups['postgres'] is defined
      - groups['postgres'] | length > 0
      - db_host | default('') | trim | length > 0
      - (db_host | trim | lower) not in ['none', 'null']
    fail_msg: >-
      Need [postgres] with ansible_host in the inventory
      (example: lprep1p ansible_host=192.168.251.188). db_host={{ db_host | default('') | quote }}.
  tags: [postgres, databases, config]

- name: Check if we're in skip mode
  set_fact:
    use_psql_commands: "{{ skip_postgres_install | default(false) }}"
  tags: [postgres, databases, config]

- name: Check if psql is available on localhost (for skip mode)
  command: which psql
  register: psql_check
  delegate_to: localhost
  failed_when: false
  changed_when: false
  when: use_psql_commands | default(false)
  tags: [postgres, databases, check]

- name: Check if PostgreSQL client is installed on localhost (for skip mode)
  command: rpm -q postgresql15 || rpm -q postgresql || rpm -q postgresql-client
  register: postgresql_client_check
  delegate_to: localhost
  failed_when: false
  changed_when: false
  when: 
    - use_psql_commands | default(false)
    - psql_check.rc != 0
  tags: [postgres, databases, check]

- name: Check if offline directory exists on localhost
  stat:
    path: "{{ paths.offline_dir }}"
  register: offline_dir_check
  delegate_to: localhost
  when:
    - use_psql_commands | default(false)
    - psql_check.rc != 0
    - postgresql_client_check.rc != 0
  tags: [postgres, databases, packages]

- name: Find PostgreSQL libs package in offline directory (required dependency)
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "postgresql15-libs-*.rpm"
      - "postgresql-libs-*.rpm"
  register: postgresql_libs_package
  delegate_to: localhost
  when:
    - use_psql_commands | default(false)
    - psql_check.rc != 0
    - postgresql_client_check.rc != 0
    - offline_dir_check.stat.exists
  tags: [postgres, databases, packages]

- name: Find PostgreSQL client package in offline directory (for localhost installation)
  find:
    paths: "{{ paths.offline_dir }}"
    patterns:
      - "postgresql15-*.rpm"
      - "postgresql-*.rpm"
    excludes:
      - "*server*"
      - "*libs*"
      - "*contrib*"
  register: postgresql_client_package
  delegate_to: localhost
  when:
    - use_psql_commands | default(false)
    - psql_check.rc != 0
    - postgresql_client_check.rc != 0
    - offline_dir_check.stat.exists
  tags: [postgres, databases, packages]

- name: Install PostgreSQL libs from offline package on localhost (required dependency)
  command: rpm -Uvh --force --nodeps "{{ item.path }}"
  loop: "{{ postgresql_libs_package.files | default([]) }}"
  delegate_to: localhost
  become: yes
  when:
    - use_psql_commands | default(false)
    - psql_check.rc != 0
    - postgresql_client_check.rc != 0
    - postgresql_libs_package.files | default([]) | length > 0
  ignore_errors: yes
  tags: [postgres, databases, packages]

- name: Install PostgreSQL client from offline package on localhost (for skip mode)
  command: rpm -Uvh --force "{{ item.path }}"
  loop: "{{ postgresql_client_package.files | default([]) }}"
  delegate_to: localhost
  become: yes
  when:
    - use_psql_commands | default(false)
    - psql_check.rc != 0
    - postgresql_client_check.rc != 0
    - postgresql_client_package.files | default([]) | length > 0
  ignore_errors: yes
  tags: [postgres, databases, packages]

- name: Install PostgreSQL client from system repositories on localhost (for skip mode)
  dnf:
    name: postgresql15
    state: present
  delegate_to: localhost
  become: yes
  when:
    - use_psql_commands | default(false)
    - psql_check.rc != 0
    - postgresql_client_check.rc != 0
    - postgresql_client_package.files | default([]) | length == 0
  ignore_errors: yes
  tags: [postgres, databases, packages]

- name: Verify psql is now available after installation
  command: which psql
  register: psql_check_after_install
  delegate_to: localhost
  failed_when: false
  changed_when: false
  when:
    - use_psql_commands | default(false)
    - psql_check.rc != 0
  tags: [postgres, databases, packages]

- name: Fail if PostgreSQL client cannot be installed on localhost
  fail:
    msg: "PostgreSQL client (psql) is required on localhost for skip mode but could not be installed. Please install postgresql15 or postgresql package manually on the Ansible control node: sudo dnf install -y postgresql15"
  when:
    - use_psql_commands | default(false)
    - psql_check.rc != 0
    - psql_check_after_install.rc != 0
  tags: [postgres, databases, packages]

- name: Find psql binary path on localhost (try which first)
  shell: which psql 2>/dev/null || echo ""
  register: psql_which_result
  delegate_to: localhost
  failed_when: false
  changed_when: false
  when: use_psql_commands | default(false)
  tags: [postgres, databases, config]

- name: Find psql binary path on localhost (fallback to find)
  shell: find /usr -name psql -type f 2>/dev/null | head -1 || echo ""
  register: psql_find_result
  delegate_to: localhost
  failed_when: false
  changed_when: false
  when:
    - use_psql_commands | default(false)
    - psql_which_result.stdout | trim == ""
  tags: [postgres, databases, config]

- name: Set psql binary path (clean single path)
  set_fact:
    psql_binary: "{{ (psql_which_result.stdout | trim | split('\n') | first) if psql_which_result.stdout | trim != '' else ((psql_find_result.stdout | trim | split('\n') | first) if psql_find_result.stdout | trim != '' else 'psql') }}"
  when: use_psql_commands | default(false)
  tags: [postgres, databases, config]

- name: Debug psql binary path
  debug:
    msg: "psql_binary set to: '{{ psql_binary }}'"
  when: use_psql_commands | default(false)
  tags: [postgres, databases, config]

# When in skip mode, use psql commands from localhost
# When in normal mode, use Ansible PostgreSQL modules

# CREATE USER alone fails on a re-run ("role already exists"), which is why this
# used to carry failed_when: false. That also hid a wrong postgres password, and
# the run then reached DMC with no dmc4 role at all. Upsert instead, and let real
# errors fail the play here.
- name: Create DMC user (skip mode - using psql)
  shell: |
    set -euo pipefail
    export PGPASSWORD='{{ db_password }}'
    {{ psql_binary }} -h {{ db_host }} -p {{ db_port }} -U {{ db_user }} -d postgres -v ON_ERROR_STOP=1 -c "
    DO \$\$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ postgresql_config.users.dmc4.name | default('dmc4') }}') THEN
        CREATE USER {{ postgresql_config.users.dmc4.name | default('dmc4') }} WITH PASSWORD '{{ postgresql_config.users.dmc4.password }}';
      ELSE
        ALTER USER {{ postgresql_config.users.dmc4.name | default('dmc4') }} WITH PASSWORD '{{ postgresql_config.users.dmc4.password }}';
      END IF;
    END
    \$\$;"
  delegate_to: localhost
  when:
    - use_psql_commands | default(false)
    - postgresql_config.users.dmc4 is defined
  changed_when: false
  tags: [postgres, databases, users, dmc]

- name: Create DMC user on inventory postgres host via local psql
  shell: |
    set -euo pipefail
    psql -d postgres -v ON_ERROR_STOP=1 -c "
    DO \$\$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ postgresql_config.users.dmc4.name | default('dmc4') }}') THEN
        CREATE USER {{ postgresql_config.users.dmc4.name | default('dmc4') }} WITH PASSWORD '{{ postgresql_config.users.dmc4.password }}';
      ELSE
        ALTER USER {{ postgresql_config.users.dmc4.name | default('dmc4') }} WITH PASSWORD '{{ postgresql_config.users.dmc4.password }}';
      END IF;
    END
    \$\$;"
  become: yes
  become_user: postgres
  when:
    - not (use_psql_commands | default(false))
    - postgresql_config.users.dmc4 is defined
  tags: [postgres, databases, users, dmc]

