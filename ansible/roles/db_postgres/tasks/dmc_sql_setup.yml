    login_port: "{{ db_port }}"
    login_user: "{{ db_user }}"
    login_password: "{{ db_password }}"
  when:
    - not (use_psql_commands | default(false))
    - postgresql_config.users.mdba is defined
  tags: [postgres, databases, users, mdba]

- name: Re-hash application role passwords after md5 encryption is active
  command: >
    psql -d postgres -v ON_ERROR_STOP=1
    -c "ALTER USER {{ item.name }} WITH PASSWORD '{{ item.password }}';"
  become: yes
  become_user: postgres
  loop:
    - name: "{{ postgresql_config.users.dmc4.name | default('dmc4') }}"
      password: "{{ postgresql_config.users.dmc4.password }}"
    - name: "{{ postgresql_config.users.mmg.name | default('mmg') }}"
      password: "{{ postgresql_config.users.mmg.password | default('') }}"
    - name: "{{ postgresql_config.users.mdba.name | default('mdba') }}"
      password: "{{ postgresql_config.users.mdba.password | default('') }}"
  when:
    - not (use_psql_commands | default(false))
    - item.password | length > 0
  tags: [postgres, databases, users, auth, dmc]

