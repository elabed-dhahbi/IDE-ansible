---
# PostgreSQL Database and User Setup Tasks
# Creates databases, users, schemas, and tablespaces based on your installation notes

- name: Ensure PostgreSQL data directory ownership
  file:
    path: "{{ postgresql_config.data_directory }}"
    owner: postgres
    group: postgres
    mode: '0700'
    recurse: yes
  become: yes
  when: not postgres_initialized.stat.exists
  tags: [postgres, databases, init]

- name: Initialize PostgreSQL database
  shell: |
    su - postgres -c "/usr/pgsql-15/bin/initdb -D {{ postgresql_config.data_directory }}"
  become: yes
  when: not postgres_initialized.stat.exists
  tags: [postgres, databases, init]



- name: Temporarily allow local trust for password bootstrap
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/pg_hba.conf"
    regexp: '^local\s+all\s+all\s+.*$'
    line: "local   all             all                                     trust"
    backup: yes
  become: yes
  tags: [postgres, databases, users]

- name: Restart PostgreSQL to apply temporary local trust
  systemd:
    name: "{{ postgresql_config.service_name }}"
    state: restarted
  become: yes
  tags: [postgres, databases, users]

- name: Set PostgreSQL password for postgres user (socket, no host)
  shell: |
    psql -U postgres -d postgres -c "ALTER USER postgres PASSWORD '{{ system_config.service_passwords.postgres }}';"
  become_user: postgres
  tags: [postgres, databases, users]

- name: Enforce local md5 after password set
  lineinfile:
    path: "{{ postgresql_config.data_directory }}/pg_hba.conf"
    regexp: '^local\s+all\s+all\s+.*$'
    line: "local   all             all                                     md5"
    backup: yes
  become: yes
  tags: [postgres, databases, users]

- name: Restart PostgreSQL to apply local md5
  systemd:
    name: "{{ postgresql_config.service_name }}"
    state: restarted
  become: yes
  tags: [postgres, databases, users]

- name: Create DMC user
  postgresql_user:
    name: "{{ postgresql_config.users.dmc4.name | default('dmc4') }}"
    password: "{{ postgresql_config.users.dmc4.password }}"
    state: present
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.users.dmc4 is defined
  tags: [postgres, databases, users, dmc]

- name: Create MMG user
  postgresql_user:
    name: "{{ postgresql_config.users.mmg.name | default('mmg') }}"
    password: "{{ postgresql_config.users.mmg.password }}"
    state: present
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.users.mmg is defined
  tags: [postgres, databases, users, mmg]

- name: Create MDBA user
  postgresql_user:
    name: "{{ postgresql_config.users.mdba.name | default('mdba') }}"
    password: "{{ postgresql_config.users.mdba.password }}"
    state: present
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.users.mdba is defined
  tags: [postgres, databases, users, mdba]

- name: Create DMC database
  postgresql_db:
    name: "{{ postgresql_config.databases.dmc46.name }}"
    owner: "{{ postgresql_config.databases.dmc46.owner }}"
    state: present
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, dmc]

- name: Create MMG database
  postgresql_db:
    name: "{{ postgresql_config.databases.mmg.name }}"
    owner: "{{ postgresql_config.databases.mmg.owner }}"
    state: present
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.databases.mmg is defined
  tags: [postgres, databases, mmg]

- name: Create DMC schema
  postgresql_query:
    query: "CREATE SCHEMA IF NOT EXISTS {{ postgresql_config.databases.dmc46.schema }} AUTHORIZATION {{ postgresql_config.databases.dmc46.owner }}"
    db: "{{ postgresql_config.databases.dmc46.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, schemas, dmc]

- name: Set DMC search path
  postgresql_query:
    query: "ALTER ROLE {{ postgresql_config.databases.dmc46.owner }} IN DATABASE {{ postgresql_config.databases.dmc46.name }} SET search_path = {{ postgresql_config.databases.dmc46.schema }}"
    db: "{{ postgresql_config.databases.dmc46.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, schemas, dmc]

- name: Grant DMC database permissions
  postgresql_query:
    query: "GRANT CONNECT ON DATABASE {{ postgresql_config.databases.dmc46.name }} TO {{ postgresql_config.databases.dmc46.owner }}"
    db: "{{ postgresql_config.databases.dmc46.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, schemas, dmc]

- name: Grant DMC schema permissions
  postgresql_query:
    query: "GRANT USAGE ON SCHEMA {{ postgresql_config.databases.dmc46.schema }} TO {{ postgresql_config.databases.dmc46.owner }}"
    db: "{{ postgresql_config.databases.dmc46.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, schemas, dmc]

- name: Create MMG schema
  postgresql_query:
    query: "CREATE SCHEMA IF NOT EXISTS {{ postgresql_config.databases.mmg.schema }} AUTHORIZATION {{ postgresql_config.databases.mmg.owner }}"
    db: "{{ postgresql_config.databases.mmg.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.databases.mmg is defined
  tags: [postgres, databases, schemas, mmg]

- name: Set MMG search path
  postgresql_query:
    query: "ALTER ROLE {{ postgresql_config.databases.mmg.owner }} IN DATABASE {{ postgresql_config.databases.mmg.name }} SET search_path = {{ postgresql_config.databases.mmg.schema }}"
    db: "{{ postgresql_config.databases.mmg.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.databases.mmg is defined
  tags: [postgres, databases, schemas, mmg]

- name: Grant MMG database permissions
  postgresql_query:
    query: "GRANT CONNECT ON DATABASE {{ postgresql_config.databases.mmg.name }} TO {{ postgresql_config.databases.mmg.owner }}"
    db: "{{ postgresql_config.databases.mmg.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.databases.mmg is defined
  tags: [postgres, databases, schemas, mmg]

- name: Grant MMG schema permissions
  postgresql_query:
    query: "GRANT USAGE ON SCHEMA {{ postgresql_config.databases.mmg.schema }} TO {{ postgresql_config.databases.mmg.owner }}"
    db: "{{ postgresql_config.databases.mmg.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.databases.mmg is defined
  tags: [postgres, databases, schemas, mmg]

- name: Create MDBA schema
  postgresql_query:
    query: "CREATE SCHEMA IF NOT EXISTS {{ postgresql_config.users.mdba.schema }} AUTHORIZATION {{ postgresql_config.users.mdba.name | default('mdba') }}"
    db: "{{ postgresql_config.databases.dmc46.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.users.mdba is defined
  tags: [postgres, databases, schemas, mdba]

- name: Set MDBA search path
  postgresql_query:
    query: "ALTER ROLE {{ postgresql_config.users.mdba.name | default('mdba') }} IN DATABASE {{ postgresql_config.databases.dmc46.name }} SET search_path = {{ postgresql_config.users.mdba.schema }}"
    db: "{{ postgresql_config.databases.dmc46.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.users.mdba is defined
  tags: [postgres, databases, schemas, mdba]

- name: Grant MDBA schema permissions
  postgresql_query:
    query: "GRANT USAGE ON SCHEMA {{ postgresql_config.databases.dmc46.schema }} TO {{ postgresql_config.users.mdba.name | default('mdba') }}"
    db: "{{ postgresql_config.databases.dmc46.name }}"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: postgresql_config.users.mdba is defined
  tags: [postgres, databases, schemas, mdba]

- name: Check if DMC data tablespace exists
  postgresql_query:
    query: "SELECT 1 FROM pg_tablespace WHERE spcname = '{{ postgresql_config.databases.dmc46.tablespaces.data }}'"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  register: dmc_data_tablespace_exists
  when: postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, tablespaces, dmc]

- name: Create DMC data tablespace
  postgresql_query:
    query: "CREATE TABLESPACE {{ postgresql_config.databases.dmc46.tablespaces.data }} OWNER {{ postgresql_config.databases.dmc46.owner }} LOCATION '{{ install_paths.postgres_tablespaces_base }}/{{ postgresql_config.databases.dmc46.tablespaces.data }}'"
    autocommit: yes
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: 
    - postgresql_config.databases.dmc46 is defined
    - dmc_data_tablespace_exists.query_result | length == 0
  tags: [postgres, databases, tablespaces, dmc]

- name: Check if DMC index tablespace exists
  postgresql_query:
    query: "SELECT 1 FROM pg_tablespace WHERE spcname = '{{ postgresql_config.databases.dmc46.tablespaces.index }}'"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  register: dmc_index_tablespace_exists
  when: postgresql_config.databases.dmc46 is defined
  tags: [postgres, databases, tablespaces, dmc]

- name: Create DMC index tablespace
  postgresql_query:
    query: "CREATE TABLESPACE {{ postgresql_config.databases.dmc46.tablespaces.index }} OWNER {{ postgresql_config.databases.dmc46.owner }} LOCATION '{{ install_paths.postgres_tablespaces_base }}/{{ postgresql_config.databases.dmc46.tablespaces.index }}'"
    autocommit: yes
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: 
    - postgresql_config.databases.dmc46 is defined
    - dmc_index_tablespace_exists.query_result | length == 0
  tags: [postgres, databases, tablespaces, dmc]

- name: Check if MMG data tablespace exists
  postgresql_query:
    query: "SELECT 1 FROM pg_tablespace WHERE spcname = '{{ postgresql_config.databases.mmg.tablespaces.data }}'"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  register: mmg_data_tablespace_exists
  when: postgresql_config.databases.mmg is defined
  tags: [postgres, databases, tablespaces, mmg]

- name: Create MMG data tablespace
  postgresql_query:
    query: "CREATE TABLESPACE {{ postgresql_config.databases.mmg.tablespaces.data }} OWNER {{ postgresql_config.databases.mmg.owner }} LOCATION '{{ install_paths.postgres_tablespaces_base }}/{{ postgresql_config.databases.mmg.tablespaces.data }}'"
    autocommit: yes
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: 
    - postgresql_config.databases.mmg is defined
    - mmg_data_tablespace_exists.query_result | length == 0
  tags: [postgres, databases, tablespaces, mmg]

- name: Check if MMG index tablespace exists
  postgresql_query:
    query: "SELECT 1 FROM pg_tablespace WHERE spcname = '{{ postgresql_config.databases.mmg.tablespaces.index }}'"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  register: mmg_index_tablespace_exists
  when: postgresql_config.databases.mmg is defined
  tags: [postgres, databases, tablespaces, mmg]

- name: Create MMG index tablespace
  postgresql_query:
    query: "CREATE TABLESPACE {{ postgresql_config.databases.mmg.tablespaces.index }} OWNER {{ postgresql_config.databases.mmg.owner }} LOCATION '{{ install_paths.postgres_tablespaces_base }}/{{ postgresql_config.databases.mmg.tablespaces.index }}'"
    autocommit: yes
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: 
    - postgresql_config.databases.mmg is defined
    - mmg_index_tablespace_exists.query_result | length == 0
  tags: [postgres, databases, tablespaces, mmg]

- name: Check if MDBA data tablespace exists
  postgresql_query:
    query: "SELECT 1 FROM pg_tablespace WHERE spcname = '{{ postgresql_config.users.mdba.tablespaces.data }}'"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  register: mdba_data_tablespace_exists
  when: postgresql_config.users.mdba is defined
  tags: [postgres, databases, tablespaces, mdba]

- name: Create MDBA data tablespace
  postgresql_query:
    query: "CREATE TABLESPACE {{ postgresql_config.users.mdba.tablespaces.data }} OWNER {{ postgresql_config.users.mdba.name | default('mdba') }} LOCATION '{{ install_paths.postgres_tablespaces_base }}/{{ postgresql_config.users.mdba.tablespaces.data }}'"
    autocommit: yes
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: 
    - postgresql_config.users.mdba is defined
    - mdba_data_tablespace_exists.query_result | length == 0
  tags: [postgres, databases, tablespaces, mdba]

- name: Check if MDBA index tablespace exists
  postgresql_query:
    query: "SELECT 1 FROM pg_tablespace WHERE spcname = '{{ postgresql_config.users.mdba.tablespaces.index }}'"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  register: mdba_index_tablespace_exists
  when: postgresql_config.users.mdba is defined
  tags: [postgres, databases, tablespaces, mdba]

- name: Create MDBA index tablespace
  postgresql_query:
    query: "CREATE TABLESPACE {{ postgresql_config.users.mdba.tablespaces.index }} OWNER {{ postgresql_config.users.mdba.name | default('mdba') }} LOCATION '{{ install_paths.postgres_tablespaces_base }}/{{ postgresql_config.users.mdba.tablespaces.index }}'"
    autocommit: yes
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  when: 
    - postgresql_config.users.mdba is defined
    - mdba_index_tablespace_exists.query_result | length == 0
  tags: [postgres, databases, tablespaces, mdba]

- name: Configure PostgreSQL to accept connections
  postgresql_info:
    filter: "settings"
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  register: postgres_settings
  become_user: postgres
  tags: [postgres, databases, config]

- name: Update PostgreSQL configuration for network access
  postgresql_query:
    query: "ALTER SYSTEM SET listen_addresses = '*'"
    autocommit: yes
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  tags: [postgres, databases, config, network]

- name: Set max prepared transactions
  postgresql_query:
    query: "ALTER SYSTEM SET max_prepared_transactions = 64"
    autocommit: yes
    login_host: "{{ ansible_host }}"
    login_port: "{{ service_ports.postgres }}"
    login_user: postgres
    login_password: "{{ system_config.service_passwords.postgres }}"
  tags: [postgres, databases, config, network]

- name: Restart PostgreSQL to apply configuration changes
  systemd:
    name: "{{ postgresql_config.service_name }}"
    state: restarted
  become: yes
  tags: [postgres, databases, config, service]
