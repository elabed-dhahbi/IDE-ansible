---
# MMG Configuration Tasks

- name: Create MMG configuration file
  copy:
    content: |
      # MMG Configuration File
      # Generated by Ansible
      
      # Server configuration
      server.port={{ mmg_config.http_port }}
      server.host={{ mmg_config.http_host }}
      server.node_id={{ mmg_config.node_id }}
      
      # Database configuration
      database.host={{ mmg_config.database.host }}
      database.port={{ mmg_config.database.port }}
      database.name={{ mmg_config.database.name }}
      database.user={{ mmg_config.database.user }}
      database.password={{ mmg_config.database.password }}
      
      # Logging configuration
      logging.level=INFO
      logging.file={{ mmg_logs_dir }}/mmg.log
    dest: "{{ mmg_config_dir }}/mmg.conf"
    owner: "{{ mmg_user }}"
    group: "{{ mmg_group }}"
    mode: '0644'
  tags: [mmg, config, main]




