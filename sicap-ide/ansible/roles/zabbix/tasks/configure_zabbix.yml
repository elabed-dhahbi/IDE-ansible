---
# Zabbix Configuration Tasks
# Simple configuration only

- name: Create Zabbix server configuration
  template:
    src: zabbix_server.conf.j2
    dest: "/etc/zabbix/zabbix_server.conf"
    owner: "zabbix"
    group: "zabbix"
    mode: '0640'
  become: true
  when: 
    - inventory_hostname in groups['zabbix']
    - zabbix.components.server | default(false)
  tags: [zabbix, config, server]

- name: Create Zabbix agent2 configuration
  template:
    src: zabbix_agent2.conf.j2
    dest: "/etc/zabbix/zabbix_agent2.conf"
    owner: "zabbix"
    group: "zabbix"
    mode: '0640'
  become: true
  when: zabbix.components.agent2 | default(false)
  tags: [zabbix, config, agent2]

- name: Create Zabbix Java Gateway configuration
  template:
    src: zabbix_java_gateway.conf.j2
    dest: "/etc/zabbix/zabbix_java_gateway.conf"
    owner: "zabbix"
    group: "zabbix"
    mode: '0640'
  become: true
  when: zabbix.components.java_gateway | default(false)
  tags: [zabbix, config, java_gateway]