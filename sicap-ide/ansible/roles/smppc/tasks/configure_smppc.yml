---
# SMPPC Configuration Tasks

- name: Create SMPPC configuration file
  copy:
    content: |
      # SMPPC Configuration File
      # Generated by Ansible
      
      # Server configuration
      server.port={{ smppc_config.http_port }}
      server.host={{ smppc_config.http_host }}
      server.node_id={{ smppc_config.node_id }}
      
      # Logging configuration
      logging.level=INFO
      logging.file={{ smppc_logs_dir }}/smppc.log
    dest: "{{ smppc_config_dir }}/smppc.conf"
    owner: "{{ smppc_user }}"
    group: "{{ smppc_group }}"
    mode: '0644'
  tags: [smppc, config, main]




