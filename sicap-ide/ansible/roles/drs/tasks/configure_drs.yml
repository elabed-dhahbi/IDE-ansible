---
# DRS Configuration Tasks

- name: Create application.properties
  copy:
    content: |
      server.port={{ drs_http_port }}
    dest: "{{ drs_conf_dir }}/application.properties"
    owner: "{{ drs_user }}"
    group: "{{ drs_group }}"
    mode: '0644'
  become: yes
  tags: [drs, config, properties]

- name: Create drb.properties
  copy:
    content: |
      # DRB Configuration
      # Generated by Ansible
      drb.import.trig.last.id={{ drs_drb.import_trig_last_id }}
      drb.load.media={{ drs_drb.load_media | lower }}
      drb.load.characteristics.raw={{ drs_drb.load_characteristics_raw | lower }}
      drb.load.deviceprofile.groups={{ drs_drb.load_deviceprofile_groups | lower }}
      drb.load.url={{ drs_drb.load_url }}
      drb.load.characteristics.groups={{ drs_drb.load_characteristics_groups | lower }}
    dest: "{{ drs_conf_dir }}/drb.properties"
    owner: "{{ drs_user }}"
    group: "{{ drs_group }}"
    mode: '0755'
  become: yes
  tags: [drs, config, properties]

- name: Create drs.properties
  copy:
    content: |
      # DRS Configuration
      # Generated by Ansible
      
      # Absolute path to a work directory for DRS.
      data.directory={{ drs_properties.data_directory }}
      
      marketing.script.directory={{ drs_properties.marketing_script_directory }}
      
      # Absolute path to a directory where resources will be extracted.
      drb.resources.directory={{ drs_properties.drb_resources_directory }}
      # Absolute path to a temporary directory for resources processing.
      drb.resources.directory.tmp={{ drs_properties.drb_resources_directory_tmp }}
      
      # Absolute path to the file containing settings for DRB loading.
      drb.configuration.file={{ drs_properties.drb_configuration_file }}
      
      drb.configuration.read.execute={{ drs_properties.drb_configuration_read_execute | lower }}
      
      # CRON specification to schedule the load task.
      drb.configuration.read.cron.schedule={{ drs_properties.drb_configuration_read_cron_schedule }}
      
      # 0: NO_CHECK
      # 1: CHECK (default value)
      # 2: CHECK_0
      imei.validation.mode.crc={{ drs_properties.imei_validation_mode_crc }}
    dest: "{{ drs_conf_dir }}/drs.properties"
    owner: "{{ drs_user }}"
    group: "{{ drs_group }}"
    mode: '0755'
  become: yes
  tags: [drs, config, properties]

- name: Check current JAVA_HOME configuration in .profile.sicap
  shell: |
    grep "JAVA_HOME=" {{ drs_home }}/home/.profile.sicap
  become: yes
  register: drs_java_home_before
  tags: [drs, config, java, debug]

- name: Display current JAVA_HOME configuration
  debug:
    msg: "Current JAVA_HOME lines: {{ drs_java_home_before.stdout_lines }}"
  tags: [drs, config, java, debug]

- name: Update JAVA_HOME in .profile.sicap
  shell: |
    # Remove any existing JAVA_HOME lines that point to /usr/j2se/current
    sed -i '/export JAVA_HOME=\${JAVA_HOME:-\\/usr\\/j2se\\/current}/d' {{ drs_home }}/home/.profile.sicap
    # Update the main JAVA_HOME line to point to /usr/j2se/current
    sed -i 's|JAVA_HOME=\${JAVA_HOME:-/usr/java}|JAVA_HOME=\${JAVA_HOME:-/usr/j2se/current}|' {{ drs_home }}/home/.profile.sicap
  become: yes
  tags: [drs, config, java]

- name: Verify JAVA_HOME was updated correctly
  shell: |
    grep "JAVA_HOME=" {{ drs_home }}/home/.profile.sicap
  become: yes
  register: drs_java_home_after
  tags: [drs, config, java, debug]

- name: Display updated JAVA_HOME configuration
  debug:
    msg: "Updated JAVA_HOME lines: {{ drs_java_home_after.stdout_lines }}"
  tags: [drs, config, java, debug]

- name: Verify Java version for DRS user
  shell: |
    source {{ drs_home }}/home/.profile.sicap && java -version
  become_user: "{{ drs_user }}"
  register: drs_java_version
  tags: [drs, config, java]

- name: Display DRS Java version
  debug:
    msg: "{{ drs_java_version.stdout_lines }}"
  tags: [drs, config, java]




