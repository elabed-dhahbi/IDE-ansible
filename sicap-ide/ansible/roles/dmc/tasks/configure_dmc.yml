- name: Update RMI provider URL in rest-api.properties
  lineinfile:
    path: "{{ dmc_conf_dir }}/rest-api.properties"
    regexp: '^fo\.rmi\.provider\.url\s*='
    line: 'fo.rmi.provider.url = {{ ansible_host }}'
