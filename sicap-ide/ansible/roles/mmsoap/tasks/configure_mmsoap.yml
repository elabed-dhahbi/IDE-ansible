---
# MMSOAP Configuration Tasks

- name: Create MMSOAP configuration file
  copy:
    content: |
      # MMSOAP Configuration File
      # Generated by Ansible
      
      # Server configuration
      server.port={{ mmsoap_config.http_port }}
      server.host={{ mmsoap_config.http_host }}
      server.node_id={{ mmsoap_config.node_id }}
      
      # Logging configuration
      logging.level=INFO
      logging.file={{ mmsoap_logs_dir }}/mmsoap.log
    dest: "{{ mmsoap_config_dir }}/mmsoap.conf"
    owner: "{{ mmsoap_user }}"
    group: "{{ mmsoap_group }}"
    mode: '0644'
  tags: [mmsoap, config, main]




